services:
  docs:
    image: squidfunk/mkdocs-material:9.8.0@sha256:dc3b5de76c6e30d18dc0922d4c4a7bed817e5e155f9ff0e594a53eb56e537e64
    volumes:
      - ./docs:/docs/docs:ro
      - ./templates/docs/mkdocs.yml:/docs/mkdocs.yml:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs.rule: Host(`${PORTCULLIS_HOST_DOCS:-docs.portcullis.local}`)
      traefik.http.routers.docs.entrypoints: websecure
      traefik.http.routers.docs.tls.options: public@file
      traefik.http.routers.docs.middlewares: security-headers@file
      traefik.http.services.docs.loadbalancer.server.port: "8000"
    restart: unless-stopped

networks:
  portcullis-proxy:
    external: true

