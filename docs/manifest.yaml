name: Docs Site
description: Public documentation — no authentication
icon: "\U0001F4C4"
category: public
tags: [docs, static, nginx]
links:
  website: https://squidfunk.github.io/mkdocs-material/
  source: https://github.com/squidfunk/mkdocs-material
instances: multi

auth:
  method: public
  sso: false
  group_access: false
  group_admin: false
  notes: Public documentation site — no authentication required.

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Docs
    url: "https://{{HOST_DOCS}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    skip: "public: no sign-in (auth.method public)"
