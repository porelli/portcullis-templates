# Bundled broker for this Zigbee2MQTT instance (mounted read-only).
# Password + ACL files are written by mosquitto-init at every start from the
# instance's generated passwords (mosquitto 2.1 refuses world-readable ones).
# No anonymous clients; only the two accounts in the password file.
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/passwd
plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/auth/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
