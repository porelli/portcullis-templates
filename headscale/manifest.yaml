name: Headscale
description: Self-hosted Tailscale control server with Headplane admin UI
icon: "\U0001F310"
category: vpn
tags: [vpn, wireguard, mesh, tailscale]
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  keycloak_access_role: true
  group_admin: false
  access_group: users_headscale
  admin_group: admin_headscale
  notes: >
    Headscale uses OIDC for node registration. Users are keyed on the OIDC
    subject (iss + sub) and named after preferred_username (the immutable
    LLDAP username); email_verified_required stays true, so the user-editable,
    unverified LLDAP email is never synced. Write ACL policy users as
    "<username>@", never by email. Headplane admin UI has its own OIDC client;
    it keys its users on sub and links them to the Headscale user with the same
    sub (its email fallback finds nothing because Headscale stores no
    unverified email). The first Headplane user becomes owner, later ones get
    the member role. No group-based access restriction — all OIDC users can
    register nodes. Post-start step for Headplane: create an API key with
    `docker exec portcullis-<instance>-headscale-1 headscale apikeys create --expiration 365d`
    (`portcullis-headscale-headscale-1` for the default instance),
    paste it into the "Headscale API key" setting, then restart the app.
    Renew it before it expires.
    config.yaml is regenerated from the template on every start (so hostname
    and client changes apply), which means manual edits to it in the
    headscale-config volume are lost; change the template instead.
    Upgrades: Headscale is pinned; upgrade one minor release at a time (its
    database migrations do not support skipping) and pick the Headplane release
    that supports that Headscale version.

settings:
  - key: HEADSCALE_API_KEY
    label: Headscale API key
    description: >
      API key Headplane uses to talk to Headscale. Create it after the first
      start with `headscale apikeys create` inside the headscale container.
    type: text

env:
  - key: HEADSCALE_OIDC_CLIENT_SECRET
    description: OIDC client secret for Headscale
    generate: random
  - key: HEADPLANE_OIDC_CLIENT_SECRET
    description: OIDC client secret for Headplane admin UI
    generate: random
  - key: HEADPLANE_COOKIE_SECRET
    description: Headplane session cookie secret (must be exactly 32 characters)
    generate: random

keycloak_clients:
  - client_id: headscale
    secret_env: HEADSCALE_OIDC_CLIENT_SECRET
    redirect_uri: "https://{{HOST_HEADSCALE}}/oidc/callback"
    name: Headscale VPN
  - client_id: headplane
    secret_env: HEADPLANE_OIDC_CLIENT_SECRET
    redirect_uri: "https://{{HOST_HEADPLANE}}/*"
    name: Headplane Admin UI

config_files:
  - src: config/config.yaml
    dest: headscale/config.yaml

urls:
  - label: VPN Control Server
    url: "https://{{HOST_HEADSCALE}}"
  - label: Admin UI
    url: "https://{{HOST_HEADPLANE}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    host: "{{HOST_HEADPLANE}}"
    path: /admin
    # The documented post-start step (auth.notes): Headplane needs a
    # Headscale API key.
    setup:
      - service: headscale
        command: [headscale, apikeys, create, --expiration, 1d]
        save_env: HEADSCALE_API_KEY
    login: ["a:has-text('Single Sign-On')", "button:has-text('Single Sign-On')", "a:has-text('OpenID')"]
    signed_in:
      # The signed-in user is in the page's loader data (avatar menu).
      html: "{username}"
      wait: 20
    password: "Headplane's login page also takes a Headscale API key (a password-type field), its break-glass login"
    expected_fail:
      outsider:
        reason: "Headscale/Headplane have no OIDC group restriction of their own: only the Hub's Keycloak access role (keycloak_access_role) keeps outsiders out, and CI runs without the Hub (app_signin.py registers plain clients)"
        match: "e2eoutsider signed in"
