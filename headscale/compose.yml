# headscale and headplane: upgrade headscale one minor at a time and pick a
# headplane release that supports it.
services:
  headscale-init:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    entrypoint: ["/bin/sh", "-c"]
    # $$VAR: expanded by the container shell from the environment below,
    # not interpolated by compose into the command string. Regenerated on
    # every start: the config is fully derived from the template + env, so a
    # hostname change applies on the next start. Never print the result (it
    # contains the OIDC client secret).
    command:
      - |
        set -eu
        echo "Generating headscale config..."
        sed \
          -e "s|PORTCULLIS_DOMAIN_PLACEHOLDER|$${PORTCULLIS_DOMAIN}|g" \
          -e "s|HEADSCALE_HOST_PLACEHOLDER|$${HEADSCALE_HOST}|g" \
          -e "s|HEADSCALE_OIDC_CLIENT_ID_PLACEHOLDER|$${HEADSCALE_OIDC_CLIENT_ID}|g" \
          -e "s|HEADSCALE_OIDC_SECRET_PLACEHOLDER|$${HEADSCALE_OIDC_CLIENT_SECRET}|g" \
          /tmp/config.yaml.tmpl > /etc/headscale/config.yaml.new
        mv /etc/headscale/config.yaml.new /etc/headscale/config.yaml
        echo "Config generated."
        # dns.extra_records_path must exist before headscale starts; the
        # vpn-dns hook (vpn/glue.py) replaces it when the Hub wires this
        # instance as a VPN provider.
        [ -e /dns/extra-records.json ] || echo '[]' > /dns/extra-records.json
        # The CA bundle for the gateway (a hand-over it mounts read-only: a
        # VPN gateway binds no file but its template's own). Refreshed every
        # start, atomically.
        cp /ca-src/ca-bundle.crt /gateway-ca/.ca-bundle.crt.new
        chmod 0644 /gateway-ca/.ca-bundle.crt.new
        mv /gateway-ca/.ca-bundle.crt.new /gateway-ca/ca-bundle.crt
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      HEADSCALE_HOST: ${PORTCULLIS_HOST_HEADSCALE:-vpn.portcullis.local}
      HEADSCALE_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID_HEADSCALE:-headscale}
      HEADSCALE_OIDC_CLIENT_SECRET: ${HEADSCALE_OIDC_CLIENT_SECRET:?HEADSCALE_OIDC_CLIENT_SECRET must be set}
    volumes:
      - headscale-config:/etc/headscale
      - headscale-dns:/dns
      - gateway-ca:/gateway-ca
      - ./certs/ca-bundle.crt:/ca-src/ca-bundle.crt:ro
      - ./templates/headscale/config/config.yaml:/tmp/config.yaml.tmpl:ro

  headscale:
    image: headscale/headscale:0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    command: serve
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - headscale-data:/var/lib/headscale
      - headscale-config:/etc/headscale:ro
      - headscale-dns:/var/lib/headscale-dns:ro
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      headscale-init:
        condition: service_completed_successfully
    networks:
      # headplane reaches headscale by this alias, which exists only on the
      # instance's own default network: the service name is also an alias on
      # portcullis-proxy, shared by every instance (contracts §3).
      default:
        aliases: [headscale-internal]
      portcullis-proxy: {}
    labels:
      traefik.enable: "true"
      traefik.http.routers.headscale.rule: Host(`${PORTCULLIS_HOST_HEADSCALE:-vpn.portcullis.local}`)
      traefik.http.routers.headscale.entrypoints: websecure
      traefik.http.routers.headscale.tls.options: public@file
      traefik.http.routers.headscale.middlewares: security-headers@file
      traefik.http.services.headscale.loadbalancer.server.port: "8080"
    restart: unless-stopped

  headplane:
    image: ghcr.io/tale/headplane:0.8.2@sha256:b053a0a6699d0a67be3f0d9bae8e7dbe35ed67ae8448412adcbad7ea49866faa
    environment:
      HEADPLANE_LOAD_ENV_OVERRIDES: "true"
      HEADPLANE_HEADSCALE__URL: http://headscale-internal:8080
      HEADPLANE_OIDC__ISSUER: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
      HEADPLANE_OIDC__CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID_HEADPLANE:-headplane}
      HEADPLANE_OIDC__CLIENT_SECRET: ${HEADPLANE_OIDC_CLIENT_SECRET:?HEADPLANE_OIDC_CLIENT_SECRET must be set}
      # Created inside headscale after first start; see manifest notes.
      HEADPLANE_OIDC__HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      # Must be exactly 32 characters (Hub generates 32 hex chars).
      HEADPLANE_SERVER__COOKIE_SECRET: ${HEADPLANE_COOKIE_SECRET:?HEADPLANE_COOKIE_SECRET must be set}
      HEADPLANE_SERVER__BASE_URL: https://${PORTCULLIS_HOST_HEADPLANE:-vpn-admin.portcullis.local}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.crt
    volumes:
      - headplane-data:/var/lib/headplane
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    depends_on:
      - headscale
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.headplane.rule: Host(`${PORTCULLIS_HOST_HEADPLANE:-vpn-admin.portcullis.local}`)
      traefik.http.routers.headplane.entrypoints: websecure
      traefik.http.routers.headplane.tls.options: authaware@file
      traefik.http.routers.headplane.middlewares: client-headers@file,headplane-root-redirect@docker,security-headers@file
      traefik.http.middlewares.headplane-root-redirect.redirectregex.regex: ^https://[^/]+/?$$
      traefik.http.middlewares.headplane-root-redirect.redirectregex.replacement: https://${PORTCULLIS_HOST_HEADPLANE:-vpn-admin.portcullis.local}/admin
      traefik.http.middlewares.headplane-root-redirect.redirectregex.permanent: "false"
      traefik.http.services.headplane.loadbalancer.server.port: "3000"
    restart: unless-stopped

  # Portcullis VPN provider (manifest vpn:, contract §3.3). The gateway is
  # a tailnet node (official tailscale image, userspace networking: no TUN,
  # no capabilities) tagged tag:portcullis-gateway. Wired by the Hub, it
  # gets PORTCULLIS_VPN_EDGE and forwards tailnet connections to its port
  # 443 there with a PROXY v2 header carrying the client node's address
  # (vpn/gateway.sh). It reaches the login / DERP server
  # (${PORTCULLIS_HOST_HEADSCALE}) through Traefik's published port on the
  # host (host-gateway), whatever the public DNS answers.
  gateway:
    image: docker.io/tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    entrypoint: ["/bin/sh", "/portcullis/gateway.sh"]
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      # containerboot's boot deadline stays its default (TS_BOOT_TIMEOUT
      # 60 s) on purpose: a gateway that boots while headscale's router is
      # absent (the Hub's wiring recreates the project) handshakes with
      # Traefik's default TLS options and then gets 421 Misdirected Request
      # on that kept-alive connection for good; the deadline's exit and the
      # restart policy give it a fresh connection. Expect one restart after
      # a recreate (core e2e-vpn waits for it).
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: portcullis-gateway
      # No log upload to log.tailscale.com.
      TS_TAILSCALED_EXTRA_ARGS: --no-logs-no-support
      # The login (control) and DERP server is ${PORTCULLIS_HOST_HEADSCALE}
      # through Traefik's published port on the host (host-gateway): a
      # stable address whatever headscale's container IP. Not
      # http://headscale-internal:8080: tailscale falls back to Noise over
      # https on port 443 after any failed dial (controlhttp
      # forceNoise443) and, on a name with an explicit http port, never
      # returns to 8080, so one headscale restart left the gateway offline.
      TS_EXTRA_ARGS: --login-server=https://${PORTCULLIS_HOST_HEADSCALE:-vpn.portcullis.local}
      # The Hub's CA bundle (Portcullis CA + public roots), handed over by
      # headscale-init through the read-only gateway-ca volume.
      SSL_CERT_FILE: /etc/portcullis-ca/ca-bundle.crt
    extra_hosts:
      - "${PORTCULLIS_HOST_HEADSCALE:-vpn.portcullis.local}:host-gateway"
    volumes:
      - gateway-state:/var/lib/tailscale
      - gateway-auth:/run/gateway:ro
      - gateway-ca:/etc/portcullis-ca:ro
      - ./templates/headscale/vpn/gateway.sh:/portcullis/gateway.sh:ro
    read_only: true
    tmpfs: [/tmp, /run/tailscale]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      - headscale
    restart: unless-stopped

  # The VPN hooks (vpn-devices, vpn-dns, gateway-key): vpn/glue.py, stdlib
  # only, against Headscale's REST API with the "Headscale API key" setting
  # (the headscale image is distroless: no shell for its CLI + jq).
  vpn-glue:
    image: docker.io/library/python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    command: ["sleep", "infinity"]
    init: true
    environment:
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      HEADSCALE_URL: http://headscale-internal:8080
      OIDC_ISSUER: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
    volumes:
      - ./templates/headscale/vpn:/vpn:ro
      - headscale-dns:/dns
      - gateway-auth:/run/gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      - headscale
    restart: unless-stopped

volumes:
  headscale-data: {}
  headscale-config: {}
  headplane-data: {}
  headscale-dns: {}
  gateway-state: {}
  gateway-auth: {}
  gateway-ca: {}

networks:
  portcullis-proxy:
    external: true
