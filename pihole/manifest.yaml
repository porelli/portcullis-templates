name: Pi-hole
description: Network-wide ad blocking via DNS sinkhole (every member of the access group is a full Pi-hole admin; Pi-hole has no roles)
icon: "\U0001F6AB"
category: networking
tags: [dns, adblock, privacy, filtering]
links:
  website: https://pi-hole.net/
  source: https://github.com/pi-hole/pi-hole
instances: multi

auth:
  method: forward-auth
  sso: false
  group_access: true
  group_admin: false
  access_group: users_pihole
  admin_group: admin_pihole
  notes: >
    No SSO in Pi-hole; Portcullis sign-in (forward-auth + group-gate) is the
    only login. Pi-hole's own password is off (FTLCONF_webserver_api_password
    empty), which upstream allows: with no password the API needs no
    session. Safe here because Pi-hole's web server ACL
    (FTLCONF_webserver_acl, https://docs.pi-hole.net/ftldns/configfile/#acl)
    only lets Traefik and the container itself connect: other containers on
    portcullis-proxy get 403, and Traefik serves the host only through the
    gateway. The DNS ports (53) are unaffected; Pi-hole serves no
    DNS-over-HTTPS. Consequences: every member of users_pihole is a full
    Pi-hole admin (Pi-hole has no roles). Without a password FTL (v6.8,
    src/api/auth.c check_client_auth) still refuses browser requests sent by
    other websites, sibling hosts on the same parent domain included
    (Sec-Fetch-Site / Origin), and requests whose Host is not one of its own
    names (DNS rebinding); FTLCONF_webserver_domain is therefore set to the
    instance's hostname at every start. The previous PIHOLE_WEBPASSWORD is no
    longer used. Upgrades: keep an image with FTL v6.8 or later (these
    no-password checks).

ports:
  - key: PIHOLE_DNS_TCP_HOST
    label: DNS (TCP)
    description: Resolver port for TCP-based queries
    container: 53
    protocol: tcp
    default: 53
    required: true
    service: pihole
  - key: PIHOLE_DNS_UDP_HOST
    label: DNS (UDP)
    description: Resolver port for UDP-based queries
    container: 53
    protocol: udp
    default: 53
    required: true
    service: pihole

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Dashboard
    url: "https://{{HOST_PIHOLE}}/admin"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /admin/
    # No identity reaches Pi-hole (no SSO, no password): the dashboard itself.
    signed_in:
      html: "Pi-hole"
      wait: 20

# AI support (contracts §3.2): why the AI can't act in this app.
ai:
  unsupported: "No MCP server known, and every member of the access group is a full administrator of the app (no per-person rights to act with)"
