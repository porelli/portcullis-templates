services:
  firefly-iii:
    image: fireflyiii/core:version-6.7.9@sha256:d51ab6a3a7b91a5c892441578e0da7f2935f84f36bd1151fc3833acc6e060871
    # remote_user_guard trusts HTTP_X_FORWARDED_USER / _EMAIL from any peer and
    # has no proxy allowlist, so the image's nginx (serversideup fpm-nginx,
    # which includes /etc/nginx/server-opts.d/*.conf in its server block)
    # answers 403 to any request carrying X-Forwarded-User or
    # X-Forwarded-Email that does not come from Traefik. $realip_remote_addr
    # is the TCP peer, before realip rewriting.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$PORTCULLIS_TRAEFIK_IP" in
          ""|*[!0-9.]*) echo "PORTCULLIS_TRAEFIK_IP must be an IPv4 address" >&2; exit 1 ;;
        esac
        {
          echo '# Generated by the Portcullis template: only Traefik may assert X-Forwarded-User / X-Forwarded-Email.'
          echo 'set $$portcullis_reject "";'
          echo 'set $$portcullis_ident "$$http_x_forwarded_user$$http_x_forwarded_email";'
          printf 'if ($$realip_remote_addr != "%s") { set $$portcullis_reject 1; }\n' "$$PORTCULLIS_TRAEFIK_IP"
          echo 'if ($$portcullis_ident = "") { set $$portcullis_reject ""; }'
          echo 'if ($$portcullis_reject) { return 403; }'
        } > /etc/nginx/server-opts.d/portcullis-trusted-proxy.conf
        exec docker-php-serversideup-entrypoint /init
    environment:
      PORTCULLIS_TRAEFIK_IP: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      APP_KEY: ${FIREFLY_APP_KEY:?FIREFLY_APP_KEY must be set}
      DB_CONNECTION: pgsql
      DB_HOST: firefly-db
      DB_PORT: "5432"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?FIREFLY_DB_PASSWORD must be set}
      APP_URL: https://finance.${PORTCULLIS_DOMAIN:-portcullis.local}
      # Laravel trusts X-Forwarded-* only from Traefik.
      TRUSTED_PROXIES: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      AUTHENTICATION_GUARD: remote_user_guard
      # Account key = LLDAP username (immutable). Firefly stores it in the
      # users.email column and does not require an address there
      # (RemoteUserProvider::retrieveById). The user-editable email is only
      # the notification address (remote_guard_alt_email preference); it
      # never selects the account.
      AUTHENTICATION_GUARD_HEADER: HTTP_X_FORWARDED_USER
      AUTHENTICATION_GUARD_EMAIL: HTTP_X_FORWARDED_EMAIL
    depends_on:
      - firefly-db
    volumes:
      - firefly-upload:/var/www/html/storage/upload
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.firefly.rule: Host(`finance.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.firefly.entrypoints: websecure
      traefik.http.routers.firefly.tls.options: authaware@file
      traefik.http.routers.firefly.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.firefly.loadbalancer.server.port: "8080"
    restart: unless-stopped

  firefly-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${FIREFLY_DB_PASSWORD:?FIREFLY_DB_PASSWORD must be set}
    volumes:
      - firefly-db-data:/var/lib/postgresql/data

volumes:
  firefly-upload:
    name: portcullis_firefly-upload
  firefly-db-data:
    name: portcullis_firefly-db-data

networks:
  portcullis-proxy:
    external: true
