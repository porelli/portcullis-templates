name: Firefly III
description: Self-hosted personal finance manager with double-entry bookkeeping
icon: "\U0001F4B8"
category: finance
tags: [finance, accounting, budget, bookkeeping]
links:
  website: https://www.firefly-iii.org/
  source: https://github.com/firefly-iii/firefly-iii
instances: multi

auth:
  method: header-auth
  sso: partial
  group_access: true
  group_admin: false
  access_group: users_firefly
  admin_group: admin_firefly
  notes: >
    Uses remote_user_guard: the account is keyed on X-Forwarded-User, the
    immutable LLDAP username (stored in Firefly's email column; Firefly does
    not require an address there). X-Forwarded-Email (user-editable in LLDAP)
    only sets the notification address and never selects an account.
    remote_user_guard has no proxy allowlist, so the container's nginx rejects
    (403) any request carrying X-Forwarded-User or X-Forwarded-Email that does
    not come from Traefik (PORTCULLIS_TRAEFIK_IP); TRUSTED_PROXIES is likewise
    limited to Traefik. Auto-creates user on first login. No group-based admin
    support. Upgrading from a release that keyed users on email: the old
    accounts are named after the email; rename them to the LLDAP username
    (users.email column) before users log in again, or they get new empty
    accounts.

env:
  - key: FIREFLY_APP_KEY
    description: Firefly III encryption key (32 chars)
    generate: random
  - key: FIREFLY_DB_PASSWORD
    description: Firefly III database password
    generate: random

keycloak_clients: []
config_files: []

urls:
  - label: Firefly III
    url: "https://{{HOST_FIREFLY}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    signed_in:
      html: "{username}"
      wait: 20

# AI support (contracts §3.2): why the AI can't act in this app.
ai:
  unsupported: "No official MCP server; community servers are not vetted by Portcullis"
  alternative:
    name: "etnperlong/firefly-iii-mcp"
    source: "https://github.com/etnperlong/firefly-iii-mcp"
    note: "community, 91★, last change Jun 2025, PAT or OAuth (surveyed 2026-11-06)"
