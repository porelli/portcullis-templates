name: Grafana
description: Monitoring dashboards — protected by WebAuthn
icon: "\U0001F4CA"
category: monitoring
tags: [monitoring, dashboards, metrics]
links:
  website: https://grafana.com/oss/grafana/
  source: https://github.com/grafana/grafana
instances: multi

auth:
  method: header-auth
  sso: partial
  group_access: true
  group_admin: false
  access_group: users_grafana
  admin_group: admin_grafana
  # GF_AUTH_PROXY_HEADER_NAME: stripped by the Hub on public paths.
  identity_headers: [X-Forwarded-User]
  # Externally shared ("public") dashboards, Grafana 13.3.0: enabled by
  # default upstream ([public_dashboards] enabled = true), routes in
  # pkg/api/api.go and pkg/services/publicdashboards/internal/api/api.go.
  # Listed mode: nothing is public until an admin lists a dashboard's token.
  public_access:
    enabled_by_default: true
    default_mode: listed
    description: >-
      Externally shared dashboards (/public-dashboards/<access token>) for
      people without a Portcullis account. Grafana serves them read-only and
      anonymously; identity headers are stripped on these paths.
    # Generated: 32 lowercase hex (uuid without dashes); API-created tokens
    # may also use the dashed uuid form.
    token_pattern: '^([0-9a-f]{32}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$'
    # Logins are not honoured on public paths (pkg/services/authn/clients):
    # core's public guard refuses requests carrying Authorization (API keys,
    # service account tokens, basic auth), the extended-JWT headers, the
    # session cookie (grafana_session = [auth] login_cookie_name, not
    # overridden here), the image-renderer cookie renderKey, or a JWT URL
    # login (auth_token; JWT auth is off here, refused defensively).
    credential_headers: [X-Access-Token, X-Grafana-Id]
    credential_cookies: [grafana_session, renderKey]
    credential_query: [auth_token]
    paths:
      - prefix: "/public-dashboards/{token}"
        description: Shared dashboard viewer page
      - prefix: "/api/public/dashboards/{token}"
        description: Dashboard JSON, annotations and panel queries of the shared dashboard
      - prefix: /public/build
        description: JS/CSS bundles, favicon and logos
        supporting: true
      - prefix: /public/fonts
        description: Fonts
        supporting: true
      - prefix: /public/plugins
        description: Assets of non-core panel plugins (reveals which plugins are installed)
        supporting: true
  notes: >-
    Proxy auth with X-Forwarded-User header, accepted only from Traefik
    (GF_AUTH_PROXY_WHITELIST = PORTCULLIS_TRAEFIK_IP) and, while AI support
    is on, from the instance's grafana-mcp companion: its trust network
    mcp-trust (internal, members dashboards and grafana-mcp only) is added
    by trust.sh at every start, read from Grafana's own interface, without
    the gateway, broadcast and Grafana's own address. Auto-creates users.
    Each person's organization role (Viewer, Editor or Admin) comes from the
    instance's Role setting: group-gate sends it as
    X-Forwarded-Attr-Grafana-Role on every request and Grafana syncs it on
    every request (GF_AUTH_PROXY_SYNC_TTL 0). Members of the admin group are
    Admin by default, everyone else Viewer; other groups are set per group
    (privileged: only groups delegates can't steer). A role changed in the
    Grafana UI is overwritten by the next request. A request without the
    role header (the person's role can't be resolved, or group-gate can't
    read the Hub's attributes file) keeps the last synced role: Grafana
    doesn't fall back to Viewer, so remove a person from the instance's
    access group to take access away. Access gated by group-gate.

settings:
  options:
    - key: role
      label: Role
      description: >
        Grafana organization role. A person in several groups gets the
        highest; applied on their next request.
      type: enum
      options:
        - {value: Viewer, label: Viewer}
        - {value: Editor, label: Editor}
        - {value: Admin, label: Admin}
      scope: person
      privileged: true
      default: Viewer
      resolve: max
      group_values: {"{{ADMIN_GROUP}}": Admin}
      applies: next_request
      delivery: [{header: {name: X-Forwarded-Attr-Grafana-Role}}]

env:
  - key: GRAFANA_ADMIN_PASSWORD
    description: Password of Grafana's built-in admin (never used for sign-in; basic auth and the login form are off)
    generate: random
  - key: MCP_GRAFANA_SERVER_TOKEN
    description: Caller secret of the grafana-mcp AI companion (the gate sends it; mcp-grafana refuses every request without it)
    generate: random
keycloak_clients: []
config_files: []

urls:
  - label: Dashboard
    url: "https://{{HOST_GRAFANA}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    signed_in:
      json: {url: /api/user, field: login}

# AI support (contracts §3.2, §15.5): the official mcp-grafana, identity
# headers. The gate sends X-Forwarded-User (and the Role header) plus the
# caller secret; mcp-grafana forwards the two headers to Grafana, which
# trusts them only from Traefik and the companion's trust network
# mcp-trust (portcullis/trust.sh). Every call runs as the person, with their role.
ai:
  mcp:
    - name: grafana
      label: Grafana
      kind: companion
      service: grafana-mcp
      port: 8000
      path: /mcp
      router: grafana                # https://<grafana host>/mcp
      public_path: /mcp
      upstream: official
      source: https://github.com/grafana/mcp-grafana
      # mcp-grafana 2.2.0 answers 2026-07-28 with 2025-11-25 (tests/apps/grafana.sh).
      protocol: ["2025-11-25", "2025-06-18"]
      modes: [read_only, read_write]
      default_mode: read_only
      identity:
        mode: identity_headers
        caller_secret: {env: MCP_GRAFANA_SERVER_TOKEN, header: Authorization, format: "Bearer {secret}"}
      # mcp-grafana 2.2.0's tools (tests/apps/grafana.sh checks these
      # against the real tools/list of both modes). alerting_rules_write
      # and alerting_silences_write delete through an `operation` argument
      # (not `method`), so the whole tool is confirmed.
      tools:
        writes: ["create_*", "update_*", "delete_*", "*_write", "add_activity_to_incident", "install_plugin"]
        confirm: ["delete_*", "alerting_rules_write", "alerting_silences_write"]
        # grafana_api_request sends arbitrary request headers (the Role
        # header among them; also off with --disable-api);
        # alerting_routing_write creates contact points, whose settings
        # carry webhook / chat credentials the model would see.
        never: ["grafana_api_request", "alerting_routing_write"]
