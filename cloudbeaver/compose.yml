services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.3@sha256:0c875296f85ffd7c0ffaaaeff678cd2f383890050297585318d7cf8f49024d1f
    # Automatic server configuration: without it CloudBeaver serves its
    # initial-configuration wizard (server settings + an administrator
    # password) to whoever opens it first. The local administrator is
    # break-glass only; users sign in through the reverseProxy provider.
    environment:
      CB_SERVER_NAME: CloudBeaver
      CB_SERVER_URL: https://${PORTCULLIS_HOST_CLOUDBEAVER:-db.portcullis.local}
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD:?CLOUDBEAVER_ADMIN_PASSWORD must be set}
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./templates/cloudbeaver/cloudbeaver-runtime.conf:/opt/cloudbeaver/workspace/GlobalConfiguration/.cloudbeaver.runtime.conf:ro
    # Default network only: CloudBeaver's reverseProxy auth provider trusts
    # X-Forwarded-User (and X-Team/X-Role/... team and role headers) from any
    # peer and has no proxy allowlist, so it is not attached to the shared
    # portcullis-proxy network. Traefik reaches it through cloudbeaver-gate.
    networks:
      - default
    depends_on:
      cloudbeaver-config:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot before every start: CloudBeaver's persisted runtime config
  # (written by the automatic server configuration or the admin UI) gets
  # the reverseProxy provider re-enabled with X-Forwarded-User. A JSON edit,
  # so any layout of the file works; a file that doesn't parse stops the
  # start (CloudBeaver never runs with a half-patched config).
  cloudbeaver-config:
    image: python:3.15.2-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    command: ["python3", "/patch-runtime-conf.py", "/opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf"]
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./templates/cloudbeaver/patch-runtime-conf.py:/patch-runtime-conf.py:ro
    network_mode: none
    restart: "no"

  # Only service on portcullis-proxy. Answers 403 to any request carrying
  # X-Forwarded-User or X-Forwarded-Email that does not come from Traefik,
  # and always drops the team/role/name headers CloudBeaver would otherwise
  # accept from the client (oauth2-proxy never sets them, so Traefik passes
  # client values through) plus X-Forwarded-Email (CloudBeaver logs in by
  # the user-header = LLDAP username only; the email is never needed).
  cloudbeaver-gate:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    environment:
      PORTCULLIS_TRAEFIK_IP: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
    command:
      - /bin/sh
      - -ec
      - |
        case "$$PORTCULLIS_TRAEFIK_IP" in
          ""|*[!0-9.]*) echo "PORTCULLIS_TRAEFIK_IP must be an IPv4 address" >&2; exit 1 ;;
        esac
        cat > /etc/nginx/conf.d/default.conf <<EOF
        map \$$http_upgrade \$$connection_upgrade { default upgrade; '' close; }
        server {
          listen 8978;
          client_max_body_size 0;
          set \$$portcullis_reject "";
          set \$$portcullis_ident "\$$http_x_forwarded_user\$$http_x_forwarded_email";
          if (\$$remote_addr != "$$PORTCULLIS_TRAEFIK_IP") { set \$$portcullis_reject 1; }
          if (\$$portcullis_ident = "") { set \$$portcullis_reject ""; }
          if (\$$portcullis_reject) { return 403; }
          location / {
            proxy_pass http://cloudbeaver:8978;
            proxy_http_version 1.1;
            proxy_set_header Host \$$http_host;
            proxy_set_header Upgrade \$$http_upgrade;
            proxy_set_header Connection \$$connection_upgrade;
            proxy_set_header X-User "";
            proxy_set_header X-Team "";
            proxy_set_header X-Role "";
            proxy_set_header X-Role-TE "";
            proxy_set_header X-First-name "";
            proxy_set_header X-Last-name "";
            proxy_set_header X-Full-name "";
            proxy_set_header X-Forwarded-Email "";
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - cloudbeaver
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.cloudbeaver.rule: Host(`${PORTCULLIS_HOST_CLOUDBEAVER:-db.portcullis.local}`)
      traefik.http.routers.cloudbeaver.entrypoints: websecure
      traefik.http.routers.cloudbeaver.tls.options: authaware@file
      traefik.http.routers.cloudbeaver.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.cloudbeaver.loadbalancer.server.port: "8978"
    restart: unless-stopped

volumes:
  cloudbeaver-data: {}

networks:
  portcullis-proxy:
    external: true
