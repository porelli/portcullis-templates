name: CloudBeaver
description: Web-based database manager — PostgreSQL, MySQL, SQLite and more
icon: "\U0001F5C3"
category: devops
tags: [database, sql, admin, postgresql, mysql]

auth:
  method: header-auth
  sso: true
  group_access: true
  group_admin: false
  access_group: users_cloudbeaver
  admin_group: admin_cloudbeaver
  notes: Access gated by forward-auth + group-gate. CloudBeaver's reverseProxy auth provider logs users in from X-Forwarded-User and trusts team/role headers from any peer with no allowlist, so CloudBeaver is kept off portcullis-proxy behind a small nginx gate (cloudbeaver-gate) that rejects (403) X-Forwarded-User from anything but Traefik (PORTCULLIS_TRAEFIK_IP) and strips the X-User/X-Team/X-Role/X-Role-TE/name headers. Roles and connections are managed in CloudBeaver.

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Database Manager
    url: "https://db.{{DOMAIN}}"
