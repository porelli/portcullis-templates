services:
  dokuwiki:
    image: linuxserver/dokuwiki:2026-07-14c-ls332@sha256:fac142ae9f7df5d3457037bc8bb668f8bfc6a6b9e02d5d1a5743bf1d030f9a10
    # The image runs executable files in /custom-cont-init.d at every start,
    # after its own setup and before nginx/php-fpm. Install a 0755 copy of
    # the read-only template file there (template file modes are not
    # guaranteed) and hand over to the image's s6 init.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        install -D -m 0755 /portcullis/init.sh /custom-cont-init.d/50-portcullis.sh
        exec /init
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      # Read by init.sh at every start (hostname, OIDC client, groups).
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      PORTCULLIS_HOST_DOKUWIKI: ${PORTCULLIS_HOST_DOKUWIKI:-dokuwiki.portcullis.local}
      PORTCULLIS_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-dokuwiki}
      PORTCULLIS_ACCESS_GROUP: ${PORTCULLIS_ACCESS_GROUP:-users_dokuwiki}
      PORTCULLIS_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_dokuwiki}
      # DokuWiki takes the client IP from X-Forwarded-For only from Traefik.
      PORTCULLIS_TRAEFIK_SOURCE: ${PORTCULLIS_TRAEFIK_SOURCE:-172.31.250.2/32}
      DOKUWIKI_OIDC_SECRET: ${DOKUWIKI_OIDC_SECRET:?DOKUWIKI_OIDC_SECRET must be set}
    volumes:
      - dokuwiki-data:/config
      - ./templates/dokuwiki/init.sh:/portcullis/init.sh:ro
      # Vendored oauth + oauthgeneric plugins (see plugins/VENDORED).
      - ./templates/dokuwiki/plugins:/portcullis/plugins:ro
      # Keycloak may use the internal PKI (PHP's default CA file on Alpine).
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      # Native OIDC (oauth + oauthgeneric plugins): the host is not behind
      # forward-auth; DokuWiki's ACL gives anonymous visitors nothing.
      traefik.http.routers.dokuwiki.rule: Host(`${PORTCULLIS_HOST_DOKUWIKI:-dokuwiki.portcullis.local}`)
      traefik.http.routers.dokuwiki.entrypoints: websecure
      traefik.http.routers.dokuwiki.tls.options: authaware@file
      traefik.http.routers.dokuwiki.middlewares: client-headers@file,security-headers@file
      traefik.http.services.dokuwiki.loadbalancer.server.port: "80"
    restart: unless-stopped

volumes:
  dokuwiki-data: {}

networks:
  portcullis-proxy:
    external: true
