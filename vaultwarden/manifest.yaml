name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager
icon: "\U0001F510"
category: security
tags: [passwords, bitwarden, vault, secrets]
links:
  website: https://github.com/dani-garcia/vaultwarden
  source: https://github.com/dani-garcia/vaultwarden
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  # Defence in depth: Keycloak also refuses sign-in without access_group
  # (the Hub's access role), on top of the login-path gate in compose.yml.
  keycloak_access_role: true
  group_admin: false
  access_group: users_vaultwarden
  admin_group: admin_vaultwarden
  admin_paths: ["/admin"]
  notes: >
    No public exceptions: Bitwarden Send (1.37.4, web vault v2026.7.0) needs
    the web vault at / with root-level hashed assets and the password-login
    token endpoint /identity/connect/token (grant_type=send_access), which
    no narrow path list can express.
    Native SSO via OpenID Connect, and SSO only (SSO_ONLY): the email +
    master password login is disabled in the web vault and for the clients,
    so every sign-in goes through Keycloak. The master password never signs
    anyone in; it only decrypts the vault after the SSO login (Bitwarden's
    end-to-end encryption), so users still set one. The SSO start and callback paths (/identity/connect/authorize,
    /identity/connect/oidc-signin) sit behind forward-auth + group-gate, so
    only members of users_vaultwarden can sign in or get an account by SSO
    (Vaultwarden has no OIDC group restriction); the API, the token exchange
    and the Bitwarden clients are not gated. Removing a user from
    users_vaultwarden blocks new SSO logins, not sessions or devices already
    signed in (deactivate the user in /admin for that). The admin panel
    (/admin) is also behind forward-auth + group-gate and, through
    auth.admin_paths, requires admin_vaultwarden on top of users_vaultwarden;
    Vaultwarden's ADMIN_TOKEN (VAULTWARDEN_ADMIN_TOKEN) is still required, keep
    it secret. Identity: SSO accounts are keyed on the OIDC subject
    (issuer + sub); SSO_SIGNUPS_MATCH_EMAIL stays false, so an SSO login is
    never attached to an existing registered account by email (LLDAP emails
    are user-editable). The Keycloak client uses email_verified_claim: false
    (scope email-unverified: email claim, no email_verified), which
    Vaultwarden accepts with SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION, so new
    users sign up with SSO on their first login and then set the master
    password that encrypts their vault. SIGNUPS_ALLOWED is false (accounts only via SSO) and
    INVITATIONS_ALLOWED is false: an email invitation would create a
    placeholder account that Vaultwarden hands to the first SSO user
    presenting that email. Organisations can therefore only add users who
    have already signed in; check the member's name (their LLDAP username)
    before confirming them, since the email they were found by is
    user-editable. Don't use the /admin "Invite user" button (it ignores
    INVITATIONS_ALLOWED and creates such a placeholder). A user whose email
    collides with an existing account is refused, never merged.

env:
  - key: VAULTWARDEN_ADMIN_TOKEN
    description: Vaultwarden admin panel token
    generate: random
  - key: VAULTWARDEN_OIDC_SECRET
    description: Vaultwarden OIDC client secret
    generate: random

keycloak_clients:
  - client_id: vaultwarden
    secret_env: VAULTWARDEN_OIDC_SECRET
    redirect_uri: "https://{{HOST_VAULTWARDEN}}/identity/connect/oidc-signin"
    name: Vaultwarden
    # New SSO signups need email_verified absent, not false (see notes).
    email_verified_claim: false
config_files: []

urls:
  - label: Vault
    url: "https://{{HOST_VAULTWARDEN}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /#/sso
    login: ["button:has-text('Use single sign-on')", "button:has-text('Continue')", "button:has-text('Create account')"]
    fill:
      # Vaultwarden has no organisations behind SSO: its fixed SSO identifier.
      - {selector: "input[formcontrolname=identifier]", value: "00000000-01DC-01DC-01DC-000000000000"}
      # A new SSO user then sets the master password that encrypts the vault.
      - {selector: "input[type=password] >> nth=0", value: "E2e-master-password-{username}"}
      - {selector: "input[type=password] >> nth=1", value: "E2e-master-password-{username}"}
    password: "Vaultwarden's master password encrypts the vault; a new user sets it after the SSO login (auth.notes)"
    signed_in:
      # The account page of the unlocked vault (the email is a read-only input).
      js: "document.querySelector('input[formcontrolname=email]')?.value || null"
      equals: "{email}"
      url: /#/settings/account
      wait: 20
    admin:
      # admin_paths: group-gate lets only admin_vaultwarden reach the panel
      # (its ADMIN_TOKEN prompt); members get 403.
      reach: /admin

# AI support (contracts §3.2): why the AI can't act in this app.
ai:
  unsupported: "A password vault: Portcullis never puts passwords or secrets in front of an AI model"
