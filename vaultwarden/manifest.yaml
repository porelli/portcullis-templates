name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager
icon: "\U0001F510"
category: security
tags: [passwords, bitwarden, vault, secrets]

auth:
  method: native-oidc
  sso: true
  group_access: false
  group_admin: false
  access_group: users_vaultwarden
  admin_group: admin_vaultwarden
  notes: Native SSO via OpenID Connect. Users still need a master password for vault encryption. The admin panel (/admin) sits behind forward-auth + group-gate, but group-gate policy is per-subdomain, so that only requires an authenticated Portcullis user (admin_vaultwarden is not enforced) — the ADMIN_TOKEN (VAULTWARDEN_ADMIN_TOKEN) remains the real protection for /admin; keep it secret. No group-based access restriction on the vault itself.

env:
  - key: VAULTWARDEN_ADMIN_TOKEN
    description: Vaultwarden admin panel token
    generate: random
  - key: VAULTWARDEN_OIDC_SECRET
    description: Vaultwarden OIDC client secret
    generate: random

keycloak_clients:
  - client_id: vaultwarden
    secret_env: VAULTWARDEN_OIDC_SECRET
    redirect_uri: "https://passwords.{{DOMAIN}}/identity/connect/oidc-signin"
    name: Vaultwarden
config_files: []

urls:
  - label: Vault
    url: "https://passwords.{{DOMAIN}}"
