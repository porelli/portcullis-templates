name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager
icon: "\U0001F510"
category: security
tags: [passwords, bitwarden, vault, secrets]

auth:
  method: native-oidc
  sso: true
  group_access: false
  group_admin: false
  access_group: users_vaultwarden
  admin_group: admin_vaultwarden
  admin_paths: ["/admin"]
  notes: >
    Native SSO via OpenID Connect. Users still need a master password for vault
    encryption. The admin panel (/admin) sits behind forward-auth + group-gate
    and, through auth.admin_paths, requires membership of admin_vaultwarden;
    Vaultwarden's ADMIN_TOKEN (VAULTWARDEN_ADMIN_TOKEN) is still required on
    top, keep it secret. No group-based access restriction on the vault itself.
    Identity: SSO accounts are keyed on the OIDC subject (issuer + sub);
    SSO_SIGNUPS_MATCH_EMAIL stays false, so an SSO login is never attached to
    an existing registered account by email (LLDAP emails are user-editable).
    The Keycloak client uses email_verified_claim: false (scope
    email-unverified: email claim, no email_verified), which Vaultwarden
    accepts with SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION, so new users sign up
    with SSO on their first login and then set a master password. A user
    whose email collides with an existing account is refused, never merged.
    Don't invite people by email (org or /admin invitations) before their
    first SSO login: Vaultwarden attaches an invited, not yet registered
    account to whichever SSO user first presents that (user-editable) email;
    invite existing users, and confirm org members only after checking who
    they are.

env:
  - key: VAULTWARDEN_ADMIN_TOKEN
    description: Vaultwarden admin panel token
    generate: random
  - key: VAULTWARDEN_OIDC_SECRET
    description: Vaultwarden OIDC client secret
    generate: random

keycloak_clients:
  - client_id: vaultwarden
    secret_env: VAULTWARDEN_OIDC_SECRET
    redirect_uri: "https://passwords.{{DOMAIN}}/identity/connect/oidc-signin"
    name: Vaultwarden
    # New SSO signups need email_verified absent, not false (see notes).
    email_verified_claim: false
config_files: []

urls:
  - label: Vault
    url: "https://passwords.{{DOMAIN}}"
