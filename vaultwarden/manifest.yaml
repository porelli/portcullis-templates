name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager
icon: "\U0001F510"
category: security
tags: [passwords, bitwarden, vault, secrets]

auth:
  method: native-oidc
  sso: true
  group_access: false
  group_admin: false
  access_group: users_vaultwarden
  admin_group: admin_vaultwarden
  admin_paths: ["/admin"]
  notes: >
    Native SSO via OpenID Connect. Users still need a master password for vault
    encryption. The admin panel (/admin) sits behind forward-auth + group-gate
    and, through auth.admin_paths, requires membership of admin_vaultwarden;
    Vaultwarden's ADMIN_TOKEN (VAULTWARDEN_ADMIN_TOKEN) is still required on
    top, keep it secret. No group-based access restriction on the vault itself.
    Identity: SSO accounts are keyed on the OIDC subject (issuer + sub);
    SSO_SIGNUPS_MATCH_EMAIL is false, so an SSO login is never attached to an
    existing account by email (LLDAP emails are user-editable). Already linked
    SSO users sign in normally. New SSO signups are refused while Keycloak
    sends email_verified=false (Vaultwarden only accepts true or an absent
    claim, see SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION); until the Vaultwarden
    client stops receiving that claim, invite new users from /admin and have
    them register with a master password. A user whose email collides with an
    existing account is refused, never merged.

env:
  - key: VAULTWARDEN_ADMIN_TOKEN
    description: Vaultwarden admin panel token
    generate: random
  - key: VAULTWARDEN_OIDC_SECRET
    description: Vaultwarden OIDC client secret
    generate: random

keycloak_clients:
  - client_id: vaultwarden
    secret_env: VAULTWARDEN_OIDC_SECRET
    redirect_uri: "https://passwords.{{DOMAIN}}/identity/connect/oidc-signin"
    name: Vaultwarden
config_files: []

urls:
  - label: Vault
    url: "https://passwords.{{DOMAIN}}"
