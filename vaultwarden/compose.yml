services:
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    environment:
      DOMAIN: https://${PORTCULLIS_HOST_VAULTWARDEN:-passwords.portcullis.local}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?VAULTWARDEN_ADMIN_TOKEN must be set}
      # Accounts only via SSO (the login paths below are gated by
      # users_vaultwarden).
      SIGNUPS_ALLOWED: "false"
      # Org invitations by email would create a placeholder account that the
      # first SSO user presenting that (user-editable) email takes over.
      # false: orgs can only add users who already have an account.
      INVITATIONS_ALLOWED: "false"
      SSO_ENABLED: "true"
      # SSO is the only sign-in: the email + master password login (web vault,
      # clients, grant_type=password) is refused. The master password only
      # decrypts the vault after the SSO login.
      SSO_ONLY: "true"
      SSO_AUTHORITY: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
      SSO_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-vaultwarden}
      SSO_CLIENT_SECRET: ${VAULTWARDEN_OIDC_SECRET:?VAULTWARDEN_OIDC_SECRET must be set}
      # SSO users are keyed on the OIDC issuer + sub. Never associate an SSO
      # login with an existing account by email: LLDAP lets users edit their
      # email, so matching would hand over someone else's vault.
      SSO_SIGNUPS_MATCH_EMAIL: "false"
      # Keycloak marks LLDAP email unverified. Vaultwarden refuses new SSO
      # signups when email_verified is false, so the manifest sets
      # email_verified_claim: false: the client gets Keycloak's
      # email-unverified scope (email, no email_verified) instead of email.
      # "Unknown" (claim absent) is accepted with this flag, which is safe
      # only because email matching is off above.
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "true"
      # Default "email profile": the client has no email scope, and Keycloak
      # rejects a requested scope the client lacks (invalid_scope).
      # email-unverified is a default scope, so the email claim still comes.
      SSO_SCOPES: "profile"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - vaultwarden-data:/data
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.vaultwarden.rule: Host(`${PORTCULLIS_HOST_VAULTWARDEN:-passwords.portcullis.local}`)
      traefik.http.routers.vaultwarden.entrypoints: websecure
      traefik.http.routers.vaultwarden.tls.options: authaware@file
      traefik.http.routers.vaultwarden.middlewares: client-headers@file,security-headers@file
      traefik.http.routers.vaultwarden.service: vaultwarden
      traefik.http.services.vaultwarden.loadbalancer.server.port: "80"
      # /admin: additionally behind forward-auth + group-gate, which requires
      # admin_vaultwarden there via the manifest's auth.admin_paths
      # (ADMIN_TOKEN is still required by Vaultwarden itself).
      traefik.http.routers.vaultwarden-admin.rule: Host(`${PORTCULLIS_HOST_VAULTWARDEN:-passwords.portcullis.local}`) && PathPrefix(`/admin`)
      traefik.http.routers.vaultwarden-admin.priority: "100"
      traefik.http.routers.vaultwarden-admin.entrypoints: websecure
      traefik.http.routers.vaultwarden-admin.tls.options: authaware@file
      traefik.http.routers.vaultwarden-admin.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.vaultwarden-admin.service: vaultwarden
      # SSO start and callback: behind forward-auth + group-gate, so only
      # users_vaultwarden members can sign in or get an account by SSO
      # (Vaultwarden has no OIDC group restriction). The API, the
      # /identity/connect/token exchange and the clients stay ungated.
      traefik.http.routers.vaultwarden-sso.rule: Host(`${PORTCULLIS_HOST_VAULTWARDEN:-passwords.portcullis.local}`) && (PathPrefix(`/identity/connect/authorize`) || PathPrefix(`/identity/connect/oidc-signin`))
      traefik.http.routers.vaultwarden-sso.priority: "100"
      traefik.http.routers.vaultwarden-sso.entrypoints: websecure
      traefik.http.routers.vaultwarden-sso.tls.options: authaware@file
      traefik.http.routers.vaultwarden-sso.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.vaultwarden-sso.service: vaultwarden
    restart: unless-stopped

volumes:
  vaultwarden-data: {}

networks:
  portcullis-proxy:
    external: true
