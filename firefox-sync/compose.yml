services:
  # Mozilla's syncstorage-rs (Sync storage + tokenserver in one process),
  # PostgreSQL build of porelli/firefox-sync. Firefox reaches it in the
  # background without cookies or client certificates, so its router is
  # public (see auth.notes); who may sync is decided by the tokenserver's
  # allowlist trigger (guard.sql), installed before this starts.
  firefox-sync:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.1@sha256:e67e05fab539e94c81ce6991d01309c2996db1178dcad8c5cd7640eca48c7e95
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_MASTER_SECRET:?FIREFOX_SYNC_MASTER_SECRET must be set}
      # Connects as firefoxsync_app (guard.sql): owns no table, no superuser,
      # read-only on the allowlist; can't drop or bypass the trigger.
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_APP_DB_PASSWORD:?FIREFOX_SYNC_APP_DB_PASSWORD must be set}@firefox-sync-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      # Migrations run in firefox-sync-migrate (as the owner), never here.
      # (syncstorage-rs' storage side always runs diesel's check, a no-op
      # once migrated; see guard.sql.)
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "false"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_APP_DB_PASSWORD:?FIREFOX_SYNC_APP_DB_PASSWORD must be set}@firefox-sync-db:5432/firefoxsync
      # No SYNC_TOKENSERVER__INIT_NODE_URL here: firefox-sync-migrate creates
      # the node row; this role may only update a node's load (guard.sql).
      # Mozilla accounts: Firefox signs in at accounts.firefox.com; the
      # tokenserver verifies its OAuth token there and knows the account
      # only as <uid>@api.accounts.firefox.com.
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: api.accounts.firefox.com
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: https://oauth.accounts.firefox.com/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_METRICS_SECRET:?FIREFOX_SYNC_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      # No account-events webhook (default off; kept explicit).
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      # No FxA delete-data endpoint (0.25: DELETE /1.0/users/<uid>/storage,
      # default off; kept explicit).
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      firefox-sync-init:
        condition: service_completed_successfully
    networks:
      # The admin UI reaches it as firefox-sync-internal, a name only this
      # instance's default network has (on portcullis-proxy every
      # instance's service answers to "firefox-sync").
      default:
        aliases: [firefox-sync-internal]
      portcullis-proxy: {}
    labels:
      traefik.enable: "true"
      traefik.http.routers.firefox-sync.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}`)
      traefik.http.routers.firefox-sync.entrypoints: websecure
      traefik.http.routers.firefox-sync.tls.options: public@file
      # No proxy body cap: Traefik's buffering middleware would hold every
      # body (up to its cap) in core Traefik's memory / tmp before anything
      # checks it. Without it Traefik streams the request, and syncstorage-rs
      # bounds it itself: unauthenticated requests fail the Hawk extractor
      # before the body is read; storage writes check Content-Length and
      # stream-limit the read to max_request_bytes, 413 otherwise
      # (syncserver/src/web/extractors/bso_bodies.rs, bso_body.rs, utils.rs
      # check_content_length, 0.25.1). The other routes read no body.
      traefik.http.routers.firefox-sync.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync.service: firefox-sync
      # The tokenserver (one request per Firefox per hour or so): the
      # stricter auth rate limit, against token replay and load inflation.
      traefik.http.routers.firefox-sync-token.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}`) && PathPrefix(`/1.0/`)
      traefik.http.routers.firefox-sync-token.entrypoints: websecure
      traefik.http.routers.firefox-sync-token.tls.options: public@file
      traefik.http.routers.firefox-sync-token.middlewares: rate-limit-auth@file,security-headers@file
      traefik.http.routers.firefox-sync-token.service: firefox-sync
      traefik.http.services.firefox-sync.loadbalancer.server.port: "8000"
    restart: unless-stopped

  # One-shot, every start: the database migrations and the sync node for this
  # hostname (syncstorage-rs runs them when it starts), without being
  # reachable: default network only, stopped as soon as its heartbeat answers.
  # The allowlist trigger needs the users table, so it comes after this.
  firefox-sync-migrate:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.1@sha256:e67e05fab539e94c81ce6991d01309c2996db1178dcad8c5cd7640eca48c7e95
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    environment:
      # The owner (database superuser): only this job and firefox-sync-init.
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_MASTER_SECRET:?FIREFOX_SYNC_MASTER_SECRET must be set}
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_DB_PASSWORD:?FIREFOX_SYNC_DB_PASSWORD must be set}@firefox-sync-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_DB_PASSWORD:?FIREFOX_SYNC_DB_PASSWORD must be set}@firefox-sync-db:5432/firefoxsync
      # The storage node Firefox is sent to: this instance's own hostname.
      SYNC_TOKENSERVER__INIT_NODE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}
      # Mozilla accounts: Firefox signs in at accounts.firefox.com; the
      # tokenserver verifies its OAuth token there and knows the account
      # only as <uid>@api.accounts.firefox.com.
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: api.accounts.firefox.com
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: https://oauth.accounts.firefox.com/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_METRICS_SECRET:?FIREFOX_SYNC_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      # No account-events webhook (default off; kept explicit).
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      # No FxA delete-data endpoint (0.25: DELETE /1.0/users/<uid>/storage,
      # default off; kept explicit).
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pid=
        for i in $$(seq 1 120); do
          if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
            /app/bin/syncserver &
            pid=$$!
          fi
          if curl -sf -o /dev/null http://localhost:8000/__heartbeat__; then
            kill $$pid
            # as porelli/firefox-sync: killed if still up 30 s after SIGTERM
            (sleep 30; kill -0 $$pid 2> /dev/null && echo "portcullis: syncstorage-rs still running 30 s after SIGTERM, killed" && kill -9 $$pid) &
            wait $$pid
            kill $$! 2> /dev/null
            echo "portcullis: migrations done"
            exit 0
          fi
          sleep 1
        done
        echo "portcullis: syncstorage-rs did not start" >&2
        kill $$pid
        exit 1
    depends_on:
      firefox-sync-db:
        condition: service_healthy
    restart: "no"

  # One-shot, every start: the allowlist (the Hub's data file allowlist.json:
  # uids access-group members entered + Other allowed accounts) and its
  # trigger, the node of this hostname (guard.sql), in one transaction. Fails
  # closed: on any error (a missing or unparsable allowlist.json included)
  # the Sync server does not start. The Hub bind-mounts the data file's
  # directory read-only at /portcullis (manifest files[]); the file is 0640
  # group 10001, hence group_add. Other values reach psql through the
  # environment (\getenv), never argv. Then, outside that transaction
  # (CREATE DATABASE can't run in one), admin-db.sql: the admin UI's own
  # database, owned by its role and closed to every other.
  firefox-sync-init:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    group_add: ["10001"]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -X -q -t -v ON_ERROR_STOP=1 --single-transaction -f /etc/portcullis/guard.sql
        psql -X -q -t -v ON_ERROR_STOP=1 -f /etc/portcullis/admin-db.sql
        echo "portcullis: admin UI $$FIREFOX_SYNC_ADMIN_UI (setup choice; the admin profile runs it)"
    environment:
      PGHOST: firefox-sync-db
      PGUSER: firefoxsync
      PGDATABASE: firefoxsync
      PGPASSWORD: ${FIREFOX_SYNC_DB_PASSWORD:?FIREFOX_SYNC_DB_PASSWORD must be set}
      FIREFOX_SYNC_APP_DB_PASSWORD: ${FIREFOX_SYNC_APP_DB_PASSWORD:?FIREFOX_SYNC_APP_DB_PASSWORD must be set}
      FIREFOX_SYNC_ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_ADMIN_DB_PASSWORD must be set}
      FIREFOX_SYNC_NODE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}
      PORTCULLIS_INSTANCE: ${PORTCULLIS_INSTANCE:-firefox-sync}
      # The setup choice Admin UI (off / preview), for the log only: the
      # Hub starts firefox-sync-admin through its compose profile.
      FIREFOX_SYNC_ADMIN_UI: ${FIREFOX_SYNC_ADMIN_UI:-off}
    volumes:
      - ./templates/firefox-sync/guard.sql:/etc/portcullis/guard.sql:ro
      - ./templates/firefox-sync/admin-db.sql:/etc/portcullis/admin-db.sql:ro
    depends_on:
      firefox-sync-migrate:
        condition: service_completed_successfully
    restart: "no"

  # The admin UI of porelli/firefox-sync (docs/admin/README.md there):
  # monitoring, storage, alerts, per-account tools. On a host of its own
  # (${PORTCULLIS_HOST_FIREFOX_SYNC_ADMIN}), behind Portcullis sign-in and
  # the instance's admin group (group-gate, auth.admin_paths "/"), then
  # its own OpenID Connect sign-in with Portcullis's Keycloak, which again
  # admits only the admin group (ADMIN_ALLOWED_GROUPS, the groups claim).
  # No password sign-in (ADMIN_PASSWORD empty: no form, POST /login 403),
  # no trusted header, no published port.
  #
  # PREVIEW, NOT READY: started only by the setup choice admin_ui = preview
  # (profile admin). This image predates upstream's externally managed
  # access mode, so its pages still offer the controls of who may sync
  # (invite-only Sync, max users), which Portcullis owns (the allowlist,
  # guard.sql). Its database role can't use them (no grant on the
  # allowlist, the user limit or the node rows), but the pages would
  # mislead. TODO(upstream): set the access mode below and pin the admin
  # image that has it.
  firefox-sync-admin:
    image: ghcr.io/porelli/firefox-sync:admin-51ff94cf7c1d@sha256:708f31e41ba150c60cdff94d91a9f58570812a9dfbbc34265c8a3284f5dce660
    profiles: [admin]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    environment:
      # TODO(upstream): the externally managed access mode (one ADMIN_*
      # setting, name pending): who may sync is Portcullis's, the admin
      # UI's account approval, invite-only Sync, max users and sign-up
      # settings off or read-only. Until then MAX_USERS and
      # SYNC_ALLOWED_ACCOUNTS stay empty (read-only, "set in .env").
      MAX_USERS: ""
      SYNC_ALLOWED_ACCOUNTS: ""
      # Sign-in: OpenID Connect only, with Portcullis's Keycloak (the
      # Hub-registered client keycloak_clients firefox-sync-admin; the
      # realm's groups scope sends the LLDAP groups by name). Admins by
      # group only: no ADMIN_ALLOWED_USERS, and the user-editable,
      # unverified LLDAP email is never trusted.
      ADMIN_PASSWORD: ""
      ADMIN_OIDC_ISSUER: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
      ADMIN_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID_FIREFOX_SYNC_ADMIN:-firefox-sync-admin}
      ADMIN_OIDC_CLIENT_SECRET: ${FIREFOX_SYNC_ADMIN_OIDC_SECRET:?FIREFOX_SYNC_ADMIN_OIDC_SECRET must be set}
      ADMIN_OIDC_REDIRECT_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_ADMIN:-firefox-sync-admin.portcullis.local}/auth/callback
      ADMIN_OIDC_SCOPES: openid email profile
      ADMIN_OIDC_NAME: Portcullis
      ADMIN_OIDC_GROUPS_CLAIM: groups
      ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL: "false"
      ADMIN_ALLOWED_USERS: ""
      ADMIN_ALLOWED_GROUPS: ${PORTCULLIS_ADMIN_GROUP:-admin_firefox-sync}
      ADMIN_AUTH_HEADER: ""
      # Discovery, JWKS and the token exchange go to auth.<domain> through
      # Traefik: trust Portcullis's CA bundle (Go reads SSL_CERT_FILE).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Its own database (admin-db.sql) and a reader of the Sync data
      # (guard.sql), both with this password; never the Sync roles'.
      TOKENSERVER_DB_TYPE: postgres
      TOKENSERVER_DB_HOST: firefox-sync-db
      TOKENSERVER_DB_PORT: "5432"
      TOKENSERVER_DB_NAME: firefoxsync
      TOKENSERVER_DB_USER: firefoxsync_admin_sync
      ADMIN_DB_USER: firefoxsync_admin
      ADMIN_DB_SYNC_USER: firefoxsync_admin_sync
      ADMIN_DB_NAME: firefoxsync_admin
      ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_ADMIN_DB_PASSWORD must be set}
      SYNCSTORAGE_URL: http://firefox-sync-internal:8000
      SYNCSTORAGE_DOMAIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}
      FXA_OAUTH_SERVER_URL: https://oauth.accounts.firefox.com/v1
      FXA_EMAIL_DOMAIN: api.accounts.firefox.com
      # No mail (no outbound SMTP unless an admin configures it), no
      # notifications, no update check against GitHub (the template pins
      # the image), no hourly fetch of the public URLs (Portcullis checks
      # its certificates itself).
      ALERT_EMAIL: ""
      ADMIN_NOTIFY: ""
      SMTP_HOST: ""
      ADMIN_UPDATE_CHECK: "false"
      ADMIN_PUBLIC_CHECK: "false"
      # Not published (Traefik only).
      ADMIN_EXPORT_PORT: ""
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # The image's own check: /healthz (no shell in the image).
    healthcheck:
      test: ["CMD", "/ffs-admin", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      firefox-sync-init:
        condition: service_completed_successfully
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      # The admin host: Portcullis sign-in, then group-gate requires the
      # instance's admin group on every path (auth.admin_paths "/").
      traefik.http.routers.firefox-sync-admin.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_ADMIN:-firefox-sync-admin.portcullis.local}`)
      traefik.http.routers.firefox-sync-admin.entrypoints: websecure
      traefik.http.routers.firefox-sync-admin.tls.options: default
      traefik.http.routers.firefox-sync-admin.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.firefox-sync-admin.service: firefox-sync-admin
      traefik.http.services.firefox-sync-admin.loadbalancer.server.port: "8080"
      # Exactly / on the (public) sync host: a redirect to the admin host,
      # instead of syncstorage-rs' redirect to Mozilla's docs. Defined here,
      # so it exists only while the admin UI runs. Nothing else of the sync
      # host changes; the redirect reaches no backend.
      traefik.http.routers.firefox-sync-root.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC:-firefox-sync.portcullis.local}`) && Path(`/`)
      traefik.http.routers.firefox-sync-root.priority: "1000"
      traefik.http.routers.firefox-sync-root.entrypoints: websecure
      traefik.http.routers.firefox-sync-root.tls.options: public@file
      traefik.http.routers.firefox-sync-root.middlewares: rate-limit@file,firefox-sync-root-redirect@docker,security-headers@file
      traefik.http.routers.firefox-sync-root.service: firefox-sync-admin
      traefik.http.middlewares.firefox-sync-root-redirect.redirectregex.regex: ^.*$$
      traefik.http.middlewares.firefox-sync-root-redirect.redirectregex.replacement: https://${PORTCULLIS_HOST_FIREFOX_SYNC_ADMIN:-firefox-sync-admin.portcullis.local}/
      traefik.http.middlewares.firefox-sync-root-redirect.redirectregex.permanent: "false"
    restart: unless-stopped

  firefox-sync-db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128mb
    environment:
      POSTGRES_USER: firefoxsync
      POSTGRES_PASSWORD: ${FIREFOX_SYNC_DB_PASSWORD:?FIREFOX_SYNC_DB_PASSWORD must be set}
      POSTGRES_DB: firefoxsync
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - firefox-sync-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefoxsync -d firefoxsync"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  firefox-sync-db-data: {}

networks:
  portcullis-proxy:
    external: true
