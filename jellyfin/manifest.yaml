name: Jellyfin
description: Free and open-source media server — movies, TV, music, live TV
icon: "\U0001F4FA"
category: media
tags: [media, movies, tv, music, streaming, opensource]
links:
  website: https://jellyfin.org/
  source: https://github.com/jellyfin/jellyfin
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  group_admin: true
  access_group: users_jellyfin
  admin_group: admin_jellyfin
  notes: >
    SSO-Auth plugin with group enforcement. Users must be in access_group to
    log in. Members of admin_group get Jellyfin admin. The plugin is pinned
    (version + SHA-256, jellyfin/plugin.py) and installed by the
    jellyfin-plugin one-shot before Jellyfin starts (Jellyfin doesn't start
    if the download doesn't match); the plugin catalog is not used. The
    jellyfin-setup sidecar configures it at every start. Jellyfin's own
    login form stays on the ungated router (the Jellyfin apps use it), but
    no account set up by Portcullis can sign in with a password: SSO-created
    accounts get a random password and the plugin's authentication
    provider, and setup moves the local admin it creates to that provider
    too (setup then authenticates with its own API key, kept in the config
    volume). Break-glass: admin_jellyfin members are Jellyfin
    administrators through SSO. Local users an administrator creates by
    hand do get a password login there; avoid them, or use strong
    passwords. TV and mobile apps sign in with Quick Connect from a signed-in
    browser session. Identity: the plugin creates and matches
    Jellyfin users by preferred_username (the immutable LLDAP username;
    DefaultUsernameClaim) and never sees the email (no email scope). An SSO
    login whose username equals an existing local Jellyfin user (e.g. the
    LLDAP "admin" and the local admin created by setup) is linked to it.
    Shared folders: the jellyfin image runs as root (no USER, no compose
    user:), so the library settings declare runs_as uid 0 / gid 0, read-
    only; on a shared folder Jellyfin joins the folder's group through
    group_add.

settings:
  sections: [Libraries]
  options:
    - key: movies_path
      label: Movies folder
      description: Host path to your movies library
      section: Libraries
      type: path
      folder:
        access: read                  # always mounted read-only
        runs_as: {uid: 0, gid: 0}     # the image runs as root (no compose user:)
        joins_group: group_add        # the default
      target:
        service: jellyfin
        mount: /data/movies
      applies: restart
    - key: tv_path
      label: TV Shows folder
      description: Host path to your TV shows library
      section: Libraries
      type: path
      folder:
        access: read                  # always mounted read-only
        runs_as: {uid: 0, gid: 0}     # the image runs as root (no compose user:)
        joins_group: group_add        # the default
      target:
        service: jellyfin
        mount: /data/tv
      applies: restart
    - key: music_path
      label: Music folder
      description: Host path to your music library
      section: Libraries
      type: path
      folder:
        access: read                  # always mounted read-only
        runs_as: {uid: 0, gid: 0}     # the image runs as root (no compose user:)
        joins_group: group_add        # the default
      target:
        service: jellyfin
        mount: /data/music
      applies: restart

env:
  - key: JELLYFIN_ADMIN_PASSWORD
    description: Jellyfin admin password
    generate: random
  - key: JELLYFIN_OIDC_SECRET
    description: Jellyfin OIDC client secret
    generate: random

keycloak_clients:
  - client_id: jellyfin
    secret_env: JELLYFIN_OIDC_SECRET
    redirect_uris:
      - "https://{{HOST_JELLYFIN}}/sso/OID/redirect/keycloak"
      - "http://{{HOST_JELLYFIN}}/sso/OID/redirect/keycloak"
    name: Jellyfin

config_files: []

urls:
  - label: Jellyfin
    url: "https://{{HOST_JELLYFIN}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /web/
    login: ["button:has-text('Sign in with SSO')"]
    password: "Jellyfin's own login form stays next to the SSO button (the Jellyfin apps use it); no Portcullis-set-up account has a password login (auth.notes)"
    signed_in:
      js: >-
        (async () => { const c = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}');
        const s = (c.Servers || [])[0]; if (!s || !s.AccessToken) return null;
        const r = await fetch('/Users/Me', {headers: {Authorization: 'MediaBrowser Token="' + s.AccessToken + '"'}});
        return r.ok ? (await r.json()).Name : null; })()
      wait: 20
    admin:
      js: >-
        (async () => { const s = JSON.parse(localStorage.getItem('jellyfin_credentials')).Servers[0];
        const r = await fetch('/Users/Me', {headers: {Authorization: 'MediaBrowser Token="' + s.AccessToken + '"'}});
        return (await r.json()).Policy.IsAdministrator; })()
      equals: true
