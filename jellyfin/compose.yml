services:
  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    environment:
      JELLYFIN_ADMIN_PASSWORD: ${JELLYFIN_ADMIN_PASSWORD:?JELLYFIN_ADMIN_PASSWORD must be set}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: Host(`${PORTCULLIS_HOST_JELLYFIN:-media.portcullis.local}`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls.options: authaware@file
      traefik.http.routers.jellyfin.middlewares: client-headers@file,security-headers@file
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
    restart: unless-stopped

  jellyfin-setup:
    image: python:3.15.2-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --quiet requests && python3 /setup.py
    environment:
      JELLYFIN_ADMIN_PASSWORD: ${JELLYFIN_ADMIN_PASSWORD:?JELLYFIN_ADMIN_PASSWORD must be set}
      JELLYFIN_OIDC_SECRET: ${JELLYFIN_OIDC_SECRET:-}
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      JELLYFIN_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-jellyfin}
      JELLYFIN_ACCESS_GROUP: ${PORTCULLIS_ACCESS_GROUP:-users_jellyfin}
      JELLYFIN_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_jellyfin}
    volumes:
      - ./templates/jellyfin/setup.py:/setup.py:ro
    depends_on:
      - jellyfin
    restart: "no"

volumes:
  jellyfin-config: {}
  jellyfin-cache: {}

networks:
  portcullis-proxy:
    external: true
