name: Plex
description: Media server for movies, TV, music with transcoding and client apps
icon: "\U0001F3AC"
category: media
tags: [media, movies, tv, music, streaming]
links:
  website: https://www.plex.tv/personal-media-server/
  source: null
  source_note: Plex Media Server is proprietary; Plex publishes no source code for it
instances: multi

auth:
  method: custom
  sso: false
  # Enforced only while Portcullis sign-in is in front of Plex (the Hub's
  # Sign-in setting, default); with "App's own login only" anyone reaches
  # Plex's login.
  group_access: true
  access_group: users_plex
  group_admin: false
  native_login:
    supported: true
    allow_without_gateway: true
    note: >-
      Plex signs users in with plex.tv accounts. Behind Portcullis sign-in only the web app in a browser works;
      Plex's TV, mobile and desktop apps can't pass forward-auth and need "App's own login only".
  notes: >-
    Plex uses its own plex.tv account system; no SSO is possible. By default the Hub puts Portcullis sign-in
    (users_plex) in front of Plex's own login; the Hub's Sign-in setting can switch to Plex's own login only
    (no Portcullis, TLS tier public), which Plex's native apps need. Claim token required for initial setup.

settings:
  sections: [Libraries, Server]
  options:
    - key: movies_path
      label: Movies folder
      description: Host path to your movies library
      section: Libraries
      type: path
      mode: ro
      needs: read
      writes_as: {uid: puid, gid: pgid}
      target:
        service: plex
        mount: /data/movies
      applies: restart
    - key: tv_path
      label: TV Shows folder
      description: Host path to your TV shows library
      section: Libraries
      type: path
      mode: ro
      needs: read
      writes_as: {uid: puid, gid: pgid}
      target:
        service: plex
        mount: /data/tv
      applies: restart
    - key: music_path
      label: Music folder
      description: Host path to your music library
      section: Libraries
      type: path
      mode: ro
      needs: read
      writes_as: {uid: puid, gid: pgid}
      target:
        service: plex
        mount: /data/music
      applies: restart
    - key: puid
      label: Plex user id
      description: >
        User id Plex Media Server runs as inside the container (PLEX_UID; default 1001,
        the image's own plex user); it needs read access to the library folders.
      section: Server
      type: int
      min: 1
      max: 65534
      default: 1001
      applies: restart
      delivery: [{env: PLEX_UID}]
    - key: pgid
      label: Plex group id
      description: Group id Plex Media Server runs as inside the container (PLEX_GID; default 1001).
      section: Server
      type: int
      min: 1
      max: 65534
      default: 1001
      applies: restart
      delivery: [{env: PLEX_GID}]
    - key: claim
      label: Claim token
      description: >
        Plex claim token from https://plex.tv/claim, needed for the initial
        setup only (it expires a few minutes after it is issued).
      section: Server
      type: secret
      applies: restart
      delivery: [{env: PLEX_CLAIM}]

env: []

keycloak_clients: []
config_files: []

urls:
  - label: Plex
    url: "https://{{HOST_PLEX}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    skip: "custom: Plex signs in through plex.tv (an account and a claim token from plex.tv), not possible headlessly in CI"
