name: Plex
description: Media server for movies, TV, music with transcoding and client apps
icon: "\U0001F3AC"
category: media
tags: [media, movies, tv, music, streaming]
links:
  website: https://www.plex.tv/personal-media-server/
  source: null
  source_note: Plex Media Server is proprietary; Plex publishes no source code for it
instances: multi

auth:
  method: custom
  sso: false
  # Enforced only while Portcullis sign-in is in front of Plex (the Hub's
  # Sign-in setting, default); with "App's own login only" anyone reaches
  # Plex's login.
  group_access: true
  access_group: users_plex
  group_admin: false
  native_login:
    supported: true
    allow_without_gateway: true
    note: >-
      Plex signs users in with plex.tv accounts. Behind Portcullis sign-in only the web app in a browser works;
      Plex's TV, mobile and desktop apps can't pass forward-auth and need "App's own login only".
  notes: >-
    Plex uses its own plex.tv account system; no SSO is possible. By default the Hub puts Portcullis sign-in
    (users_plex) in front of Plex's own login; the Hub's Sign-in setting can switch to Plex's own login only
    (no Portcullis, TLS tier public), which Plex's native apps need. Claim token required for initial setup.

settings:
  - key: PLEX_MOVIES_PATH
    label: Movies folder
    description: Host path to your movies library
    type: path
    target:
      service: plex
      mount: /data/movies
  - key: PLEX_TV_PATH
    label: TV Shows folder
    description: Host path to your TV shows library
    type: path
    target:
      service: plex
      mount: /data/tv
  - key: PLEX_MUSIC_PATH
    label: Music folder
    description: Host path to your music library
    type: path
    target:
      service: plex
      mount: /data/music

env:
  - key: PLEX_CLAIM
    description: Plex claim token (get from https://plex.tv/claim)
    generate: none
    required: false

keycloak_clients: []
config_files: []

urls:
  - label: Plex
    url: "https://{{HOST_PLEX}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    skip: "custom: Plex signs in through plex.tv (an account and a claim token from plex.tv), not possible headlessly in CI"
