name: LiteLLM
description: Unified LLM proxy — OpenAI-compatible API for 100+ models with auth and rate limits
icon: "\U0001F916"
category: ai
tags: [llm, ai, openai, proxy, api]

auth:
  method: native-oidc
  sso: true
  group_access: true
  group_admin: false
  access_group: users_litellm
  admin_group: admin_litellm
  notes: >
    OIDC login for the admin UI. The OpenAI-compatible API (and the management
    API the UI calls) has no forward-auth, so it is reachable with the master
    key or virtual API keys. The admin UI and all interactive login paths
    (/ui, /sso, /login, /v2/login, /fallback/login, /onboarding) sit behind
    forward-auth + group-gate: only members of users_litellm can sign in.
    SSO users default to the read-only internal_user_viewer role; LLDAP groups
    are mapped to roles (admin_litellm -> proxy_admin, users_litellm ->
    internal_user), but that mapping needs the Keycloak
    "groups" claim in the LiteLLM client's tokens; until the client has the
    groups scope, SSO users get internal_user_viewer and an admin (logged in
    with the master key) promotes them in the UI. Users created before this
    change keep their existing role; review them under Internal Users.

env:
  - key: LITELLM_MASTER_KEY
    description: LiteLLM admin API key
    generate: random
  - key: LITELLM_OIDC_SECRET
    description: LiteLLM OIDC client secret
    generate: random
  - key: LITELLM_DB_PASSWORD
    description: LiteLLM PostgreSQL password
    generate: random

keycloak_clients:
  - client_id: litellm
    secret_env: LITELLM_OIDC_SECRET
    redirect_uri: "https://llm.{{DOMAIN}}/sso/callback"
    name: LiteLLM
config_files: []

urls:
  - label: LiteLLM Proxy
    url: "https://llm.{{DOMAIN}}"
  - label: Admin UI
    url: "https://llm.{{DOMAIN}}/ui"
