services:
  litellm:
    image: ghcr.io/berriai/litellm:1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}@litellm-db:5432/litellm
      GENERIC_CLIENT_ID: litellm
      GENERIC_CLIENT_SECRET: ${LITELLM_OIDC_SECRET:?LITELLM_OIDC_SECRET must be set}
      GENERIC_AUTHORIZATION_ENDPOINT: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/auth
      GENERIC_TOKEN_ENDPOINT: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/token
      GENERIC_USERINFO_ENDPOINT: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/userinfo
      GENERIC_SCOPE: "openid profile email"
      # Identity = preferred_username (immutable LLDAP username). LiteLLM
      # falls back to matching an existing user by email when the id is
      # unknown (auth_checks._get_fuzzy_user_object), and LLDAP emails are
      # user-editable, so the email attribute points at a claim Keycloak never
      # sends: SSO users get no email and can never be matched by one.
      GENERIC_USER_ID_ATTRIBUTE: preferred_username
      GENERIC_USER_EMAIL_ATTRIBUTE: portcullis_no_email_linking
      PROXY_BASE_URL: https://llm.${PORTCULLIS_DOMAIN:-portcullis.local}
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
      # Least privilege for SSO users: map LLDAP groups (Keycloak "groups"
      # claim) to LiteLLM roles; everyone else gets the read-only
      # internal_user_viewer role. Users who signed in before keep their role.
      GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
      GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user_viewer
      GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['admin_litellm'], 'internal_user': ['users_litellm']}"
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      - litellm-db
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      # OpenAI-compatible API and management endpoints: no forward-auth, so
      # clients authenticate with the master key or virtual API keys.
      traefik.http.routers.litellm.rule: Host(`llm.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.litellm.entrypoints: websecure
      traefik.http.routers.litellm.tls.options: authaware@file
      traefik.http.routers.litellm.middlewares: client-headers@file,security-headers@file
      traefik.http.routers.litellm.service: litellm
      # Admin UI and every interactive login path (SSO, username/password,
      # invitation links) behind forward-auth + group-gate, so only members of
      # users_litellm can sign in. Without this any Keycloak realm user could
      # create a LiteLLM account via SSO.
      traefik.http.routers.litellm-ui.rule: Host(`llm.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (PathPrefix(`/ui`) || PathPrefix(`/sso`) || PathPrefix(`/login`) || PathPrefix(`/v2/login`) || PathPrefix(`/fallback/login`) || PathPrefix(`/onboarding`))
      traefik.http.routers.litellm-ui.priority: "100"
      traefik.http.routers.litellm-ui.entrypoints: websecure
      traefik.http.routers.litellm-ui.tls.options: authaware@file
      traefik.http.routers.litellm-ui.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.litellm-ui.service: litellm
      traefik.http.services.litellm.loadbalancer.server.port: "4000"
    restart: unless-stopped

  litellm-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

volumes:
  litellm-db-data:
    name: portcullis_litellm-db-data

networks:
  portcullis-proxy:
    external: true
