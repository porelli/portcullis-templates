services:
  samba:
    image: ghcr.io/servercontainers/samba:smbd-only-a3.24.3-s4.23.8-r0@sha256:04fb3bd3da742ddb988f621e8c38b0dcbc26e7b4c438c9836abb43d937bc27e6
    # ServerContainers' entrypoint never runs (contract §13.17, F59):
    # portcullis-sync renders everything, then runit runs smbd alone.
    entrypoint: ["/portcullis/bin/start"]
    command: []
    environment:
      PORTCULLIS_FLAVOUR: samba
      PORTCULLIS_INSTANCE: ${PORTCULLIS_INSTANCE:-samba}
      PORTCULLIS_LOCAL_NETWORKS: ${PORTCULLIS_LOCAL_NETWORKS}
      PORTCULLIS_SMB_PORT: ${SAMBA_SMB:-445}
      # = settings share_password.username (tests/validate.py checks both).
      PORTCULLIS_USERNAME_PATTERN: '^[a-z_][a-z0-9_.-]{0,31}$$'
      PORTCULLIS_USERNAME_RESERVED: >-
        root bin daemon sys adm tty disk lp kmem wheel floppy mail news uucp cron
        audio cdrom dialout ftp sshd input tape video netdev kvm games shadow
        www-data users ntp abuild utmp ping nogroup nobody sync shutdown halt guest
      # Finder's icon for the server (fruit:model).
      MIMIC_MODEL: MacSamba
      # Each slot's folder gid, for force group (§13.15: this exact form).
      PORTCULLIS_FOLDER_GID_SHARE1_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE1_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE2_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE2_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE3_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE3_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE4_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE4_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE5_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE5_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE6_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE6_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE7_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE7_FOLDER}
      PORTCULLIS_FOLDER_GID_SHARE8_FOLDER: ${PORTCULLIS_FOLDER_GID_SHARE8_FOLDER}
    volumes:
      - ./templates/samba/bin:/portcullis/bin:ro
      # The homes setting replaces this with its host path.
      - samba-homes:/homes
    # Passdb and Samba's state on tmpfs: no hash reaches a volume or a backup.
    # /shares (the image's VOLUME) is a small tmpfs: only a slot's assigned
    # shared folder, mounted at /shares/<n>, is ever served.
    tmpfs:
      - /run/portcullis:mode=0700
      - /run/samba:mode=0755
      - /var/lib/samba:mode=0755
      - /var/cache/samba:mode=0755
      - /var/log/samba:mode=0755
      - /shares:mode=0755,size=64k
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    cap_drop: [ALL]
    # Why each one: auth.notes.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # Replaces the image's own healthcheck. Unhealthy while the installed
    # smb.conf no longer verifies or smbd isn't running (the runit run
    # script refuses to start it then).
    healthcheck:
      test: ["CMD-SHELL", "/portcullis/bin/portcullis-sync --check && pidof smbd > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 2
      start_period: 20s
    # The stop removes the Bonjour file, then waits for smbd: inside 30 s.
    stop_grace_period: 30s
    networks: [default]
    restart: unless-stopped

volumes:
  samba-homes: {}
