    - key: avahi_services_dir
      label: Host Avahi services directory (Bonjour)
      description: >-
        For Bonjour advertising: the host's Avahi services directory (usually
        /etc/avahi/services, writable by root). Empty = no advertising. Turn
        Advertise off before clearing this setting, or the file stays there.
      type: path
      target: {service: samba, mount: /portcullis/avahi}
      folder:
        access: write
        runs_as: {uid: 0, gid: 0}   # portcullis-sync writes the file as the container's root
      section: Network
      applies: restart
    - key: advertise
      label: Advertise with Bonjour
      description: >-
        Writes portcullis-<instance>.service into the Avahi directory above so
        Macs see the server in Finder. Advertising shows the server to everyone
        on the local network. Turn it off before clearing the directory.
      type: bool
      default: false
      section: Network
      applies: live
      delivery: [{file: {name: people}}]
