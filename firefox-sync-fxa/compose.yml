  # porelli/firefox-sync's admin UI (:8080) and the sign-up gate (:8081, POST
  # /v1/account/create of the API host). Access managed elsewhere: who may
  # sign up is Portcullis's access group (fxa-access-sync). No password
  # sign-in, no mail of its own, no published port.
  ffs-admin:
    image: ghcr.io/porelli/firefox-sync:admin-37a15d0a5ba2@sha256:fb1c3d96136d8367f131f99fefbd81d39f47c338902fb8de5530c778c7030dc5
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    environment:
      ADMIN_ACCESS_EXTERNAL: "1"
      ADMIN_PASSWORD: ""
      ADMIN_OIDC_GROUPS_CLAIM: groups
      ADMIN_ALLOWED_GROUPS: ${PORTCULLIS_ADMIN_GROUP:-admin_firefox-sync-fxa}
      ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL: "false"
      ADMIN_ALLOWED_USERS: ""
      ADMIN_AUTH_HEADER: ""
      # Go reads SSL_CERT_FILE: Portcullis's CA bundle.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # The accounts (ffs_admin, made by fxa-policy).
      FXA_DB: mysql
      FXA_DB_HOST: fxa-db
      FXA_DB_PORT: "3306"
      FXA_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:?FXA_ADMIN_DB_PASSWORD must be set}
      FXA_MAX_ACCOUNTS: unlimited
      FXA_AUTH_UPSTREAM: http://fxa-auth:9000
      FXA_ACCOUNT_EVENTS: "false"
      FXA_CLIENT_ADDRESS_DEPTH: "2"
      FXA_ACCESS_TOKEN_LIFETIME: 60 minutes
      FXA_CONTENT_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      FXA_AUTH_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      FXA_PROFILE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PROFILE:-firefox-sync-fxa-profile.portcullis.local}
      FXA_PAIRING_URL: wss://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PAIRING:-firefox-sync-fxa-pairing.portcullis.local}
      # Sync (its own roles on the Sync database, as in firefox-sync/).
      MAX_USERS: unlimited
      SYNC_ALLOWED_ACCOUNTS: ""
      TOKENSERVER_DB_TYPE: postgres
      TOKENSERVER_DB_HOST: firefox-sync-fxa-db
      TOKENSERVER_DB_PORT: "5432"
      TOKENSERVER_DB_NAME: firefoxsync
      TOKENSERVER_DB_USER: firefoxsync_admin_sync
      ADMIN_DB_USER: firefoxsync_admin
      ADMIN_DB_SYNC_USER: firefoxsync_admin_sync
      ADMIN_DB_NAME: firefoxsync_admin
      ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD must be set}
      SYNCSTORAGE_URL: http://firefox-sync-fxa-internal:8000
      SYNCSTORAGE_DOMAIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      # No mail, notifications, update check, public checks or published ports.
      ALERT_EMAIL: ""
      ADMIN_NOTIFY: ""
      SMTP_HOST: ""
      ADMIN_UPDATE_CHECK: "false"
      ADMIN_PUBLIC_CHECK: "false"
      ADMIN_EXPORT_PORT: ""
      ADMIN_GATE_EXPORT_PORT: ""
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "/ffs-admin", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
        restart: true
      firefox-sync-fxa-db-init:
        condition: service_completed_successfully
        restart: true
      firefox-sync-fxa-init:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped

  # Portcullis's access group to the sign-up allowlist (ffs_access); the
  # hook runs the sync in here.
  fxa-access-sync:
    image: mysql:9.7.4@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    user: "10001:10001"
    group_add: ["10001"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: []
    command: [sleep, infinity]
    volumes:
      - fxa-access-state:/state
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped

  # Mozilla's syncstorage-rs (Sync storage + tokenserver), PostgreSQL build of
  # porelli/firefox-sync. Its tokenserver verifies Firefox's OAuth tokens with
  # this instance's own auth server, internally, and knows the accounts as
  # <uid>@<API host>.
  firefox-sync-fxa:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.1@sha256:e67e05fab539e94c81ce6991d01309c2996db1178dcad8c5cd7640eca48c7e95
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_FXA_MASTER_SECRET:?FIREFOX_SYNC_FXA_MASTER_SECRET must be set}
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_FXA_APP_DB_PASSWORD:?FIREFOX_SYNC_FXA_APP_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      # Migrations run in firefox-sync-fxa-migrate (as the owner), never here.
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "false"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_FXA_APP_DB_PASSWORD:?FIREFOX_SYNC_FXA_APP_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_FXA_METRICS_SECRET:?FIREFOX_SYNC_FXA_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      firefox-sync-fxa-init:
        condition: service_completed_successfully
    # The port its alias serves (the alias Service on Kubernetes carries it).
    expose: ["8000"]
    networks:
      # fxa-gate and the admin UI reach it as firefox-sync-fxa-internal, a
      # name only this instance's default network has.
      default:
        aliases: [firefox-sync-fxa-internal]
    restart: unless-stopped

  # One-shot, every start: the Sync migrations and this host's node, as in
  # firefox-sync/ (stopped as soon as its heartbeat answers).
  firefox-sync-fxa-migrate:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.1@sha256:e67e05fab539e94c81ce6991d01309c2996db1178dcad8c5cd7640eca48c7e95
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_FXA_MASTER_SECRET:?FIREFOX_SYNC_FXA_MASTER_SECRET must be set}
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__INIT_NODE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_FXA_METRICS_SECRET:?FIREFOX_SYNC_FXA_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pid=
        for i in $$(seq 1 120); do
          if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
            /app/bin/syncserver &
            pid=$$!
          fi
          if curl -sf -o /dev/null http://localhost:8000/__heartbeat__; then
            kill $$pid
            # as porelli/firefox-sync: killed if still up 30 s after SIGTERM
            (sleep 30; kill -0 $$pid 2> /dev/null && echo "portcullis: syncstorage-rs still running 30 s after SIGTERM, killed" && kill -9 $$pid) &
            wait $$pid
            kill $$! 2> /dev/null
            echo "portcullis: migrations done"
            exit 0
          fi
          sleep 1
        done
        echo "portcullis: syncstorage-rs did not start" >&2
        kill $$pid
        exit 1
    depends_on:
      firefox-sync-fxa-db:
        condition: service_healthy
    restart: "no"

  # One-shot, every start: porelli/firefox-sync's own init (tokenserver_db_init)
  # with access managed elsewhere, as in firefox-sync/: the config table, the
  # ffs_* functions, the admin UI's roles and database. As the owner.
  firefox-sync-fxa-db-init:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-init-0.25.1-20261124T171959@sha256:a43d7e844d66fa6cc48d7de027038b3f9029bf46c8740cbb445a7b2cab96f8d8
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    environment:
      POSTGRES_SERVER: firefox-sync-fxa-db
      POSTGRES_SERVER_PORT: "5432"
      POSTGRES_DATABASE: firefoxsync
      POSTGRES_USER: firefoxsync
      POSTGRES_PASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
      POSTGRES_SYNC_USER: ""
      DOMAIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      ADMIN_ACCESS_EXTERNAL: "1"
      SYNC_ALLOWED_ACCOUNTS: ""
      MAX_USERS: unlimited
      SYNC_DB_CONTAINERS: "1"
      ADMIN_DB_USER: firefoxsync_admin
      ADMIN_DB_SYNC_USER: firefoxsync_admin_sync
      ADMIN_DB_NAME: firefoxsync_admin
      ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD must be set}
    depends_on:
      firefox-sync-fxa-migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot, every start: Portcullis's guard on the Sync database (the
  # roles and grants; guard.sql, revoke.sql, admin-db.sql). Until those land
  # it only checks the database answers, so the Sync server never starts
  # before it.
  firefox-sync-fxa-init:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -X -q -t -v ON_ERROR_STOP=1 -c 'SELECT 1'
    environment:
      PGHOST: firefox-sync-fxa-db
      PGUSER: firefoxsync
      PGDATABASE: firefoxsync
      PGPASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
    depends_on:
      firefox-sync-fxa-db-init:
        condition: service_completed_successfully
    restart: "no"

  firefox-sync-fxa-db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128mb
    environment:
      POSTGRES_USER: firefoxsync
      POSTGRES_PASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
      POSTGRES_DB: firefoxsync
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - firefox-sync-fxa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefoxsync -d firefoxsync"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The only service on portcullis-proxy: a Traefik-only nginx (the
  # esphome/gate.sh pattern) in front of every host. Until its gate.sh lands
  # nothing listens on 8080, so Traefik routes nothing (fail closed), and
  # every host router carries the Portcullis sign-in.
  fxa-gate:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    mem_limit: 64m
    pids_limit: 64
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.firefox-sync-fxa.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa.tls.options: default
      traefik.http.routers.firefox-sync-fxa.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.firefox-sync-fxa.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-accounts.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-accounts.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-api.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-api.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-api.tls.options: default
