# Firefox Sync with its own Mozilla accounts (porelli/firefox-sync's
# compose/fxa.yml + compose/fxa-mysql.yml, and the Sync side of
# firefox-sync/compose.yml on PostgreSQL). No ports:, no env_file: the
# settings of upstream's config/fxa/no-telemetry.env are written inline on
# every running accounts service.
#
# Network: every service is on the instance's own default network only.
# fxa-gate (a Traefik-only nginx, fxa-gate.sh) is the only service on
# portcullis-proxy and carries every router, so no other app can reach
# fxa-auth:9000 and skip the sign-up gate (ffs-admin:8081). It calls each
# service by a default-only -internal alias.
#
# Start order: fxa-db -> fxa-migrations -> fxa-db-guard -> fxa-policy -> fxa-auth (with
# fxa-keys-owner and fxa-redis) -> fxa-profile -> fxa-content; Sync:
# firefox-sync-fxa-db -> -migrate -> -db-init -> -init -> firefox-sync-fxa.
services:
  # Accounts' cache: last use of sessions, revoked tokens, rate limits. No
  # volume (lost on a recreate anyway): no RDB/AOF, /data a tmpfs over the
  # image's VOLUME.
  fxa-redis:
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:size=64m
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The accounts database (mysql:lts, MySQL 9.7; upstream's accounts code has
  # no PostgreSQL). The event scheduler as upstream's fxa-mysql.yml.
  fxa-db:
    image: mysql:9.7.4@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    user: "999:999"
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    environment:
      MYSQL_ROOT_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
    command: [mysqld, --event-scheduler=ON]
    volumes:
      - fxa-db-data:/var/lib/mysql
    healthcheck:
      # Over TCP: the first start runs a temporary server on the socket only.
      # The password in mysqladmin's environment, never its argv.
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot --silent"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot, every start: the least-privilege database users of the
  # internet-facing accounts services (db-users.sh): fxa_auth and
  # fxa_profile; then ffs_access (fxa-policy's) narrowed to what
  # fxa-access-sync needs, so it runs after fxa-policy. Root stays with this
  # job, fxa-migrations and fxa-policy, none of them reachable.
  fxa-db-users:
    image: mysql:9.7.4@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["/bin/sh", "/portcullis-bin/db-users.sh"]
    environment:
      MYSQL_HOST: fxa-db
      MYSQL_PWD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
      FXA_AUTH_DB_PASSWORD: ${FXA_AUTH_DB_PASSWORD:?FXA_AUTH_DB_PASSWORD must be set}
      FXA_PROFILE_DB_PASSWORD: ${FXA_PROFILE_DB_PASSWORD:?FXA_PROFILE_DB_PASSWORD must be set}
    volumes:
      - ./templates/firefox-sync-fxa/db-users.sh:/portcullis-bin/db-users.sh:ro
    depends_on:
      fxa-db:
        condition: service_healthy
      fxa-policy:
        condition: service_completed_successfully
    restart: "no"

  # One-shot: the accounts image and fxa-access-sync run as 10001; a new
  # volume is root's (fxa-keys, and fxa-access-state: the access sync's
  # state).
  fxa-keys-owner:
    image: ghcr.io/porelli/firefox-sync:fxa-mono-v1.350.0@sha256:0ec0804fe9a021496faffd78d64ae90c014ee4fa1b0ed228451e84df30a77d73
    user: "0:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    mem_limit: 64m
    pids_limit: 16
    command: [chown, "10001:10001", /fxa-keys, /fxa-access-state]
    volumes:
      - fxa-keys:/fxa-keys
      - fxa-access-state:/fxa-access-state
    restart: "no"

  # One-shot, every start: the accounts' database migrations (auth, oauth,
  # profile, pushbox).
  fxa-migrations:
    image: ghcr.io/porelli/firefox-sync:fxa-mono-v1.350.0@sha256:0ec0804fe9a021496faffd78d64ae90c014ee4fa1b0ed228451e84df30a77d73
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    working_dir: /fxa/packages/db-migrations
    # As upstream: retried while the server doesn't answer yet; a refused
    # sign-in stops at once.
    command: [sh, -c, 'for i in $$(seq 1 60); do out=$$(node bin/patcher.mjs 2>&1) && { echo "$$out"; exit 0; }; echo "$$out"; case "$$out" in *"Access denied for user"*) echo "the accounts database refused the user or its grants: not retried" >&2; exit 1 ;; esac; sleep 5; done; exit 1']
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/portcullis-ca-bundle.crt
      AUTH_MYSQL_HOST: fxa-db
      AUTH_MYSQL_PORT: "3306"
      AUTH_MYSQL_USERNAME: root
      AUTH_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
      OAUTH_MYSQL_HOST: fxa-db
      OAUTH_MYSQL_PORT: "3306"
      OAUTH_MYSQL_USERNAME: root
      OAUTH_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
      PROFILE_MYSQL_HOST: fxa-db
      PROFILE_MYSQL_PORT: "3306"
      PROFILE_MYSQL_USERNAME: root
      PROFILE_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
      PUSHBOX_MYSQL_HOST: fxa-db
      PUSHBOX_MYSQL_PORT: "3306"
      PUSHBOX_MYSQL_USERNAME: root
      PUSHBOX_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/portcullis-ca-bundle.crt:ro
    depends_on:
      fxa-db:
        condition: service_healthy
    restart: "no"

  # One-shot, every start, after the migrations and before fxa-policy
  # (db-guard.sh): the accounts database compares emails byte for byte. The
  # ffs database and the allowlist's column utf8mb4_bin (fxa-policy then
  # makes its routines under it), and triggers on fxa.accounts / fxa.emails
  # that refuse an email that isn't plain ASCII, so no look-alike of a
  # member's address (alice@exámple.org) can pass the allowlist. Root, like
  # fxa-db-users; not reachable.
  fxa-db-guard:
    image: mysql:9.7.4@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["/bin/sh", "/portcullis-bin/db-guard.sh"]
    environment:
      MYSQL_HOST: fxa-db
      MYSQL_PWD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
    volumes:
      - ./templates/firefox-sync-fxa/db-guard.sh:/portcullis-bin/db-guard.sh:ro
    depends_on:
      fxa-migrations:
        condition: service_completed_successfully
    restart: "no"

  # One-shot, every start (porelli's fxa-init): the sign-up policy, enforced
  # by the accounts database itself, and the database users of the admin UI
  # (ffs_admin) and of Portcullis's access sync (ffs_access; fxa-db-users
  # then takes its EXECUTE on ffs.delete_account_by_email away). Access
  # managed elsewhere: with ADMIN_ACCESS_EXTERNAL and FXA_ACCESS_DB_PASSWORD
  # it forces FXA_SIGNUPS=allowlist, and the admin UI's procedures leave who
  # has access alone (enable refuses an account whose current primary email
  # is off the list, delete keeps the list); the list is fxa-access-sync's
  # alone, so FXA_SIGNUP_ALLOWLIST is never set. With the mode it also makes
  # ffs.disable_accounts_not_allowed(p_max), ffs_access's sweep (by the
  # current primary email, with a brake: more than p_max refuses with
  # SQLSTATE 45001 and changes nothing), and makes the allowlist's column
  # utf8mb4_bin itself (fxa-db-guard did it first: then nothing to convert).
  fxa-policy:
    image: ghcr.io/porelli/firefox-sync:admin-68ea7b80db3a@sha256:bab736d6a61e74221a44ca6f23ced3457f901dd67a8bf584a29ccdd25846c717
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    command: [fxa-init]
    environment:
      FXA_DB_CONTAINERS: "1"
      FXA_DB_HOST: fxa-db
      FXA_DB_PORT: "3306"
      # Empty: installs the policy as FXA_MYSQL_USER.
      FXA_DB_ROOT_USER: ""
      FXA_DB_ROOT_PASSWORD: ""
      FXA_MYSQL_USER: root
      FXA_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD:?FXA_MYSQL_PASSWORD must be set}
      FXA_ADMIN_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:?FXA_ADMIN_DB_PASSWORD must be set}
      FXA_ACCESS_DB_PASSWORD: ${FXA_ACCESS_DB_PASSWORD:?FXA_ACCESS_DB_PASSWORD must be set}
      ADMIN_ACCESS_EXTERNAL: "1"
      FXA_SIGNUPS: allowlist
      # No account cap by default: the access group decides (setting
      # max_accounts: at most that many accounts).
      FXA_MAX_ACCOUNTS: ${MAX_ACCOUNTS:-unlimited}
    depends_on:
      fxa-migrations:
        condition: service_completed_successfully
      fxa-db-guard:
        condition: service_completed_successfully
    restart: "no"

  # One-shot, every start, validate only (no network): the mail settings,
  # with the mail-select.sh fxa-auth sources. Without a mail server (no
  # provider wired, mail off, or an incomplete external server) it exits 1
  # and the auth server doesn't start: it can't send a sign-up code.
  fxa-mail-check:
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    user: "10001:10001"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=1m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 32m
    pids_limit: 16
    entrypoint: ["/bin/sh", "/portcullis-bin/mail-check.sh"]
    environment:
      # The source (setting mail_source): provider (default) or external.
      MAIL_SOURCE: ${MAIL_SOURCE:-provider}
      # The Hub's app mail sender (contracts §19.14; empty: no provider).
      PORTCULLIS_MAIL_SENDER_HOST: ${PORTCULLIS_MAIL_SENDER_HOST:-}
      PORTCULLIS_MAIL_SENDER_PORT: ${PORTCULLIS_MAIL_SENDER_PORT:-}
      PORTCULLIS_MAIL_SENDER_USER: ${PORTCULLIS_MAIL_SENDER_USER:-}
      PORTCULLIS_MAIL_SENDER_PASSWORD: ${PORTCULLIS_MAIL_SENDER_PASSWORD:-}
      PORTCULLIS_MAIL_SENDER_FROM: ${PORTCULLIS_MAIL_SENDER_FROM:-}
      # Another SMTP server (settings smtp_*).
      EXT_SMTP_HOST: ${EXT_SMTP_HOST:-}
      EXT_SMTP_PORT: ${EXT_SMTP_PORT:-587}
      EXT_SMTP_SECURITY: ${EXT_SMTP_SECURITY:-starttls}
      EXT_SMTP_USER: ${EXT_SMTP_USER:-}
      EXT_SMTP_PASSWORD: ${EXT_SMTP_PASSWORD:-}
      EXT_SMTP_SENDER: ${EXT_SMTP_SENDER:-}
      # The requireTLS overlay (mail-select.sh: STARTTLS required).
      FXA_SMTP_REQUIRE_TLS_FILE: /fxa-config/smtp-require-tls.json
    volumes:
      - ./templates/firefox-sync-fxa/mail-check.sh:/portcullis-bin/mail-check.sh:ro
      - ./templates/firefox-sync-fxa/mail-select.sh:/portcullis-bin/mail-select.sh:ro
      - ./templates/firefox-sync-fxa/fxa-config/smtp-require-tls.json:/fxa-config/smtp-require-tls.json:ro
    restart: "no"

  # The accounts API and OAuth server (FXA_AUTH_URL = the API host). Its keys
  # are generated once into fxa-keys (in the instance backup).
  fxa-auth:
    image: ghcr.io/porelli/firefox-sync:fxa-mono-v1.350.0@sha256:0ec0804fe9a021496faffd78d64ae90c014ee4fa1b0ed228451e84df30a77d73
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    pids_limit: 256
    working_dir: /fxa/packages/fxa-auth-server/dist/packages/fxa-auth-server
    # As upstream: oauth-clients.js first (the key scripts load the config,
    # which needs mfa.jwt.secretKey, derived from OAUTH_SERVER_SECRET_KEY).
    # mail-select.sh first: the SMTP_* of the mail source (fxa-mail-check
    # validated them), the passwords from the environment, never argv.
    command:
      - sh
      - -c
      - >-
        . /portcullis-bin/mail-select.sh &&
        node /fxa-config/oauth-clients.js /fxa-keys/oauth-clients.json &&
        node scripts/gen_keys.js &&
        node scripts/oauth_gen_keys.js &&
        node scripts/gen_vapid_keys.js &&
        exec node bin/key_server.js
    environment:
      # no-telemetry.env (porelli/firefox-sync config/fxa), inline
      SENTRY_DSN: ""
      GLEAN_ENABLED: "false"
      GLEAN_UPLOAD_ENABLED: "false"
      CONTENT_SERVER_GLEAN_ENABLED: "false"
      AUTH_GLEAN_ENABLED: "false"
      AMPLITUDE_ENABLED: "false"
      AMPLITUDE_DISABLED: "true"
      FLOW_METRICS_DISABLED: "true"
      STATSD_ENABLE: "false"
      METRIC_ENABLED: "false"
      PAIR_STATSD_HOST: ""
      TRACING_GCP_EXPORTER_ENABLED: "false"
      TRACING_OTEL_EXPORTER_ENABLED: "false"
      TRACING_SAMPLE_RATE: "0"
      NIMBUS_ENABLED: "false"
      PAIR_IP_REPUTATION_SERVER: ""
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/portcullis-ca-bundle.crt
      NODE_ENV: prod
      CONFIG_FILES: /fxa-keys/oauth-clients.json
      IP_ADDRESS: 0.0.0.0
      PUBLIC_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      OAUTH_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      CONTENT_SERVER_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      FXA_OPENID_ISSUER: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      # The API host: it signs and checks the OAuth assertions.
      ISSUER: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      PROFILE_SERVER_URL: http://fxa-profile:1111
      SYNC_TOKENSERVER_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      CORS_ORIGIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      # The client IP of the rate limits: 2 = Traefik alone (fxa-gate
      # forwards Traefik's X-Forwarded-For unchanged and adds nothing).
      CLIENT_ADDRESS_DEPTH: "2"
      # Firefox's access tokens live 60 minutes (Mozilla's default: 365).
      FXA_EXPIRATION_ACCESS_TOKEN: 60 minutes
      LASTACCESSTIME_UPDATES_SAMPLE_RATE: "1"
      # Clients that never skip the sign-in code (Mozilla's defaults).
      SERVICES_WITH_EMAIL_VERIFICATION: 32aaeb6f1c21316a,98e6508e88680e1a
      OAUTH_SERVER_SECRET_KEY: ${FXA_OAUTH_SECRET:?FXA_OAUTH_SECRET must be set}
      OAUTH_SERVER_SECRETS: ${FXA_OAUTH_SECRET:?FXA_OAUTH_SECRET must be set}
      AUTH_SERVER_SECRETS: ${FXA_OAUTH_SECRET:?FXA_OAUTH_SECRET must be set}
      AUTH_SERVER_SHARED_SECRET: ${FXA_AUTH_SECRET:?FXA_AUTH_SECRET must be set}
      PROFILE_SERVER_AUTH_SECRET_BEARER_TOKEN: ${FXA_PROFILE_SECRET:?FXA_PROFILE_SECRET must be set}
      FLOW_ID_KEY: ${FXA_FLOW_ID_KEY:?FXA_FLOW_ID_KEY must be set}
      SESSION_TOKEN_HANDLE_KEY: ${FXA_SESSION_TOKEN_HANDLE_KEY:?FXA_SESSION_TOKEN_HANDLE_KEY must be set}
      SECRET_KEY_FILE: /fxa-keys/secret-key.json
      PUBLIC_KEY_FILE: /fxa-keys/public-key.json
      VAPID_KEYS_FILE: /fxa-keys/vapid-keys.json
      FXA_OPENID_KEYFILE: /fxa-keys/openid-key.json
      FXA_OPENID_NEWKEYFILE: /fxa-keys/openid-newKey.json
      FXA_OPENID_OLDKEYFILE: /fxa-keys/openid-oldKey.json
      DB: mysql
      AUTH_MYSQL_HOST: fxa-db
      AUTH_MYSQL_PORT: "3306"
      # fxa_auth (db-users.sh): DML and EXECUTE on fxa, fxa_oauth and
      # pushbox only, nothing on ffs.
      AUTH_MYSQL_USERNAME: fxa_auth
      AUTH_MYSQL_PASSWORD: ${FXA_AUTH_DB_PASSWORD:?FXA_AUTH_DB_PASSWORD must be set}
      MYSQL_HOST: fxa-db
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: fxa_auth
      MYSQL_PASSWORD: ${FXA_AUTH_DB_PASSWORD:?FXA_AUTH_DB_PASSWORD must be set}
      PUSHBOX_ENABLED: "true"
      PUSHBOX_MYSQL_HOST: fxa-db
      PUSHBOX_MYSQL_PORT: "3306"
      PUSHBOX_MYSQL_USERNAME: fxa_auth
      PUSHBOX_MYSQL_PASSWORD: ${FXA_AUTH_DB_PASSWORD:?FXA_AUTH_DB_PASSWORD must be set}
      DB_AUTO_UPDATE_CLIENTS: "true"
      REDIS_HOST: fxa-redis
      ACCESS_TOKEN_REDIS_HOST: fxa-redis
      REFRESH_TOKEN_REDIS_HOST: fxa-redis
      CUSTOMS_REDIS_HOST: fxa-redis
      RATELIMIT_REDIS_HOST: fxa-redis
      METRICS_REDIS_HOST: fxa-redis
      AUTH_CACHE_REDIS_HOST: fxa-redis
      RECOVERY_PHONE_REDIS_HOST: fxa-redis
      PASSKEY_REDIS_HOST: fxa-redis
      # Mozilla/Google cloud services this deployment doesn't have.
      FIRESTORE_ENABLED: "false"
      SNS_TOPIC_ARN: disabled
      GEODB_ENABLED: "false"
      CUSTOMS_SERVER_URL: none
      RECOVERY_PHONE__ENABLED: "false"
      RECOVERY_PHONE__TWILIO__CREDENTIAL_MODE: ""
      # No security history: it stores IP addresses.
      ACCOUNT_EVENTS_ENABLED: "false"
      # Never skip the sign-in code for a known IP address.
      IP_PROFILING_RECENCY: 0
      LOG_LEVEL: INFO
      # Mail: mail-select.sh exports SMTP_HOST, SMTP_PORT, SMTP_USER,
      # SMTP_PASS, SMTP_SECURE and SMTP_SENDER from these (as fxa-mail-check
      # read them). STARTTLS required, never opportunistic: with SMTP_SECURE
      # false mail-select.sh appends FXA_SMTP_REQUIRE_TLS_FILE (nodemailer's
      # requireTLS, which the auth server has no setting for) to CONFIG_FILES.
      SMTP_IGNORE_TLS: "false"
      FXA_SMTP_REQUIRE_TLS_FILE: /fxa-config/smtp-require-tls.json
      MAIL_SOURCE: ${MAIL_SOURCE:-provider}
      PORTCULLIS_MAIL_SENDER_HOST: ${PORTCULLIS_MAIL_SENDER_HOST:-}
      PORTCULLIS_MAIL_SENDER_PORT: ${PORTCULLIS_MAIL_SENDER_PORT:-}
      PORTCULLIS_MAIL_SENDER_USER: ${PORTCULLIS_MAIL_SENDER_USER:-}
      PORTCULLIS_MAIL_SENDER_PASSWORD: ${PORTCULLIS_MAIL_SENDER_PASSWORD:-}
      PORTCULLIS_MAIL_SENDER_FROM: ${PORTCULLIS_MAIL_SENDER_FROM:-}
      EXT_SMTP_HOST: ${EXT_SMTP_HOST:-}
      EXT_SMTP_PORT: ${EXT_SMTP_PORT:-587}
      EXT_SMTP_SECURITY: ${EXT_SMTP_SECURITY:-starttls}
      EXT_SMTP_USER: ${EXT_SMTP_USER:-}
      EXT_SMTP_PASSWORD: ${EXT_SMTP_PASSWORD:-}
      EXT_SMTP_SENDER: ${EXT_SMTP_SENDER:-}
    volumes:
      - fxa-keys:/fxa-keys
      - ./templates/firefox-sync-fxa/mail-select.sh:/portcullis-bin/mail-select.sh:ro
      - ./templates/firefox-sync-fxa/fxa-config:/fxa-config:ro
      - ./certs/ca-bundle.crt:/etc/ssl/certs/portcullis-ca-bundle.crt:ro
    depends_on:
      fxa-db-users:
        condition: service_completed_successfully
      fxa-keys-owner:
        condition: service_completed_successfully
      fxa-mail-check:
        condition: service_completed_successfully
      fxa-policy:
        condition: service_completed_successfully
      fxa-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/__heartbeat__').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5
    # fxa-gate calls it as fxa-auth-internal (a name only this instance's
    # default network has); the alias Service on Kubernetes carries the port.
    expose: ["9000"]
    networks:
      default:
        aliases: [fxa-auth-internal]
    restart: unless-stopped

  # The accounts web pages (FXA_CONTENT_URL = the accounts host). Not
  # read-only: content-server.js points the built pages from Mozilla's CDN to
  # this host, in the image's own files.
  fxa-content:
