      # pages, which answer 404, never to Mozilla.
      GLEAN_SERVER_ENDPOINT: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
    volumes:
