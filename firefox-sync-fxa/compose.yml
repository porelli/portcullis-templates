  # The channel server for pairing a phone by QR code (a websocket relay; it
  # can't read what it relays). One worker: actix starts one per CPU it may
  # run on, each loading the 61 MB GeoIP database, so on a host with more
  # than 2 CPUs it outgrows its 128m and is killed (and fxa-gate, which waits
  # for it, never starts). The server has no setting for it, and compose's
  # cpus: isn't carried to Kubernetes: it runs pinned to the first CPU it
  # may use (taskset; Rust's available_parallelism counts the affinity
  # mask), on every runtime. No CPU found = no start.
  fxa-pairing:
    image: ghcr.io/porelli/firefox-sync:fxa-channelserver-1.6.0@sha256:cfc3319d79ba46bdc7b32922170bbfa5ea5eec3cb6549519ac0996309f320f74
    entrypoint:
      - /bin/bash
      - -c
      - 'cpu=$$(sed -n "s/^Cpus_allowed_list:[[:space:]]*\([0-9]*\).*/\1/p" /proc/self/status) && [ -n "$$cpu" ] && exec taskset -c "$$cpu" /app/bin/channelserver'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    environment:
      # no-telemetry.env (porelli/firefox-sync config/fxa), inline
      SENTRY_DSN: ""
      GLEAN_ENABLED: "false"
      GLEAN_UPLOAD_ENABLED: "false"
      CONTENT_SERVER_GLEAN_ENABLED: "false"
      AUTH_GLEAN_ENABLED: "false"
      AMPLITUDE_ENABLED: "false"
      AMPLITUDE_DISABLED: "true"
      FLOW_METRICS_DISABLED: "true"
      STATSD_ENABLE: "false"
      METRIC_ENABLED: "false"
      PAIR_STATSD_HOST: ""
      TRACING_GCP_EXPORTER_ENABLED: "false"
      TRACING_OTEL_EXPORTER_ENABLED: "false"
      TRACING_SAMPLE_RATE: "0"
      NIMBUS_ENABLED: "false"
      PAIR_IP_REPUTATION_SERVER: ""
      PAIR_HOSTNAME: 0.0.0.0
      PAIR_PORT: "8000"
      PAIR_HUMAN_LOGS: "true"
      PAIR_TRUSTED_PROXY_LIST: 127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    # The image (debian slim) has no curl or wget: bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /__heartbeat__ HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    expose: ["8000"]
    networks:
      default:
        aliases: [fxa-pairing-internal]
    restart: unless-stopped

  # porelli/firefox-sync's admin UI (:8080) and the sign-up gate (:8081, POST
  # /v1/account/create of the API host). The admin host
  # (${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ADMIN}) is behind Portcullis sign-in
  # and group-gate (fxa-gate's router); fxa-gate lets only the instance's
  # admin group through (group-gate's X-Auth-Request-Groups), and the admin
  # UI's own OpenID Connect sign-in with Portcullis's Keycloak admits only
  # that group again (ADMIN_ALLOWED_GROUPS, by the groups claim; never by
  # email).
  # No password sign-in (ADMIN_PASSWORD empty: no form, POST /login 403), no
  # trusted header, no mail of its own, no published port.
  #
  # Access managed elsewhere (ADMIN_ACCESS_EXTERNAL, here, in fxa-policy and
  # in firefox-sync-fxa-db-init): who may sign up is Portcullis's access group
  # (fxa-access-sync). The sign-up policy, its allowlist, the account cap and
  # Sync's max users are read-only here: the admin UI refuses its forms for
  # them, and its database user ffs_admin (fxa-policy) can't write them
  # directly. Its incident procedures (porelli's SECURITY DEFINER ones) don't
  # reach past it either: ffs.enable_account refuses an account whose current
  # primary email the sign-up policy refuses (SQLSTATE 45000 "not on the
  # access list managed elsewhere", a leaver's included: the sweep's rule),
  # and ffs.delete_account leaves the account's allowlist row alone. Its
  # Confirm email and Confirm this sign-in (ffs.confirm_email /
  # ffs.confirm_session) are refused at fxa-gate: an account's email is
  # proven only by the code sent to it.
  ffs-admin:
    image: ghcr.io/porelli/firefox-sync:admin-68ea7b80db3a@sha256:bab736d6a61e74221a44ca6f23ced3457f901dd67a8bf584a29ccdd25846c717
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    environment:
      # Who may sign up and sync is Portcullis's: read-only here.
      ADMIN_ACCESS_EXTERNAL: "1"
      # Sign-in: OpenID Connect only, with Portcullis's Keycloak (the
      # Hub-registered client keycloak_clients firefox-sync-fxa-admin; the
      # realm's groups scope sends the LLDAP groups by name). Admins by group
      # only: no ADMIN_ALLOWED_USERS, and the user-editable, unverified LLDAP
      # email is never trusted. The client secret by environment only.
      ADMIN_PASSWORD: ""
      ADMIN_OIDC_ISSUER: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
      ADMIN_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID_FIREFOX_SYNC_FXA_ADMIN:-firefox-sync-fxa-admin}
      ADMIN_OIDC_CLIENT_SECRET: ${FIREFOX_SYNC_FXA_ADMIN_OIDC_SECRET:?FIREFOX_SYNC_FXA_ADMIN_OIDC_SECRET must be set}
      ADMIN_OIDC_REDIRECT_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ADMIN:-firefox-sync-fxa-admin.portcullis.local}/auth/callback
      ADMIN_OIDC_SCOPES: openid email profile
      ADMIN_OIDC_NAME: Portcullis
      ADMIN_OIDC_GROUPS_CLAIM: groups
      ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL: "false"
      ADMIN_ALLOWED_USERS: ""
      ADMIN_ALLOWED_GROUPS: ${PORTCULLIS_ADMIN_GROUP:-admin_firefox-sync-fxa}
      ADMIN_AUTH_HEADER: ""
      # Discovery, JWKS and the token exchange go to auth.<domain> through
      # Traefik: trust Portcullis's CA bundle (Go reads SSL_CERT_FILE).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # The accounts as ffs_admin, its own database user (fxa-policy, porelli's
      # fxa-init): it reads the accounts (some columns of fxa.accounts, ffs's
      # views) and changes them only through ffs's procedures; with access
      # managed elsewhere no write of the sign-up policy or allowlist, direct
      # or through a procedure (above).
      FXA_DB: mysql
      FXA_DB_HOST: fxa-db
      FXA_DB_PORT: "3306"
      FXA_DB_USER: ffs_admin
      FXA_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:?FXA_ADMIN_DB_PASSWORD must be set}
      # As fxa-policy set it (shown on the overview).
      FXA_MAX_ACCOUNTS: ${MAX_ACCOUNTS:-unlimited}
      FXA_AUTH_UPSTREAM: http://fxa-auth:9000
      FXA_ACCOUNT_EVENTS: "false"
      FXA_CLIENT_ADDRESS_DEPTH: "2"
      FXA_ACCESS_TOKEN_LIFETIME: 60 minutes
      FXA_CONTENT_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      FXA_AUTH_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      FXA_PROFILE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PROFILE:-firefox-sync-fxa-profile.portcullis.local}
      FXA_PAIRING_URL: wss://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PAIRING:-firefox-sync-fxa-pairing.portcullis.local}
      # Sync (its own roles on the Sync database, as in firefox-sync/).
      MAX_USERS: unlimited
      SYNC_ALLOWED_ACCOUNTS: ""
      TOKENSERVER_DB_TYPE: postgres
      TOKENSERVER_DB_HOST: firefox-sync-fxa-db
      TOKENSERVER_DB_PORT: "5432"
      TOKENSERVER_DB_NAME: firefoxsync
      TOKENSERVER_DB_USER: firefoxsync_admin_sync
      ADMIN_DB_USER: firefoxsync_admin
      ADMIN_DB_SYNC_USER: firefoxsync_admin_sync
      ADMIN_DB_NAME: firefoxsync_admin
      ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD must be set}
      SYNCSTORAGE_URL: http://firefox-sync-fxa-internal:8000
      SYNCSTORAGE_DOMAIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      # No mail, notifications, update check, public checks or published ports.
      ALERT_EMAIL: ""
      ADMIN_NOTIFY: ""
      SMTP_HOST: ""
      ADMIN_UPDATE_CHECK: "false"
      ADMIN_PUBLIC_CHECK: "false"
      ADMIN_EXPORT_PORT: ""
      ADMIN_GATE_EXPORT_PORT: ""
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "/ffs-admin", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
        restart: true
      firefox-sync-fxa-db-init:
        condition: service_completed_successfully
        restart: true
      firefox-sync-fxa-init:
        condition: service_completed_successfully
        restart: true
    # The admin UI (8080) and the sign-up gate (8081), called by fxa-gate as
    # ffs-admin-internal.
    expose: ["8080", "8081"]
    networks:
      default:
        aliases: [ffs-admin-internal]
    restart: unless-stopped

  # Portcullis's access group to the sign-up allowlist: the hook access-sync
  # (manifest hooks[], start and membership_change) runs access-sync.sh in
  # here, as ffs_access (SELECT, INSERT, DELETE on ffs.signup_allowlist,
  # EXECUTE on ffs.disable_account_by_email / enable_account_by_email,
  # nothing else). The data file access.json (the access group's verified
  # emails) is mounted read-only at /portcullis by the Hub; the state of the
  # last applied run in fxa-access-state. The password only in MYSQL_PWD.
  fxa-access-sync:
    image: mysql:9.7.4@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    user: "10001:10001"
    group_add: ["10001"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: []
    command: [sleep, infinity]
    environment:
      MYSQL_HOST: fxa-db
      MYSQL_PWD: ${FXA_ACCESS_DB_PASSWORD:?FXA_ACCESS_DB_PASSWORD must be set}
      # The data file must name this instance.
      PORTCULLIS_INSTANCE: ${PORTCULLIS_INSTANCE:-firefox-sync-fxa}
    volumes:
      - fxa-access-state:/state
      - ./templates/firefox-sync-fxa/access-sync.sh:/portcullis-bin/access-sync.sh:ro
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
        restart: true
      fxa-db-users:
        condition: service_completed_successfully
        restart: true
      fxa-keys-owner:
        condition: service_completed_successfully
    restart: unless-stopped

  # Mozilla's syncstorage-rs (Sync storage + tokenserver), PostgreSQL build of
  # porelli/firefox-sync. Its tokenserver verifies Firefox's OAuth tokens with
  # this instance's own auth server, internally, and knows the accounts as
  # <uid>@<API host>.
  firefox-sync-fxa:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.2@sha256:e31d2d17d136f5e87ccd1c88ba6e53270c3c11d1c321d22d7d31c9ed5e3d623d
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_FXA_MASTER_SECRET:?FIREFOX_SYNC_FXA_MASTER_SECRET must be set}
      # Connects as firefoxsync_app (guard.sql): owns no table, no superuser,
      # may create no database object. No SYNC_TOKENSERVER__INIT_NODE_URL:
      # firefox-sync-fxa-migrate creates the node row; this role may only
      # update a node's load.
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_FXA_APP_DB_PASSWORD:?FIREFOX_SYNC_FXA_APP_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      # Migrations run in firefox-sync-fxa-migrate (as the owner), never here.
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "false"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync_app:${FIREFOX_SYNC_FXA_APP_DB_PASSWORD:?FIREFOX_SYNC_FXA_APP_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_FXA_METRICS_SECRET:?FIREFOX_SYNC_FXA_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      firefox-sync-fxa-init:
        condition: service_completed_successfully
    # The port its alias serves (the alias Service on Kubernetes carries it).
    expose: ["8000"]
    networks:
      # fxa-gate and the admin UI reach it as firefox-sync-fxa-internal, a
      # name only this instance's default network has.
      default:
        aliases: [firefox-sync-fxa-internal]
    restart: unless-stopped

  # One-shot, every start: the Sync migrations and this host's node, as in
  # firefox-sync/ (stopped as soon as its heartbeat answers).
  firefox-sync-fxa-migrate:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-0.25.2@sha256:e31d2d17d136f5e87ccd1c88ba6e53270c3c11d1c321d22d7d31c9ed5e3d623d
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8000"
      SYNC_HUMAN_LOGS: "1"
      RUST_LOG: info
      SYNC_MASTER_SECRET: ${FIREFOX_SYNC_FXA_MASTER_SECRET:?FIREFOX_SYNC_FXA_MASTER_SECRET must be set}
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__DATABASE_URL: postgres://firefoxsync:${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}@firefox-sync-fxa-db:5432/firefoxsync
      SYNC_TOKENSERVER__INIT_NODE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${FIREFOX_SYNC_FXA_METRICS_SECRET:?FIREFOX_SYNC_FXA_METRICS_SECRET must be set}
      SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: "2"
      SYNC_TOKENSERVER__FXA_WEBHOOK_ENABLED: "false"
      SYNC_TOKENSERVER__FXA_DELETE_DATA_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pid=
        for i in $$(seq 1 120); do
          if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
            /app/bin/syncserver &
            pid=$$!
          fi
          if curl -sf -o /dev/null http://localhost:8000/__heartbeat__; then
            kill $$pid
            # as porelli/firefox-sync: killed if still up 30 s after SIGTERM
            (sleep 30; kill -0 $$pid 2> /dev/null && echo "portcullis: syncstorage-rs still running 30 s after SIGTERM, killed" && kill -9 $$pid) &
            wait $$pid
            kill $$! 2> /dev/null
            echo "portcullis: migrations done"
            exit 0
          fi
          sleep 1
        done
        echo "portcullis: syncstorage-rs did not start" >&2
        kill $$pid
        exit 1
    depends_on:
      firefox-sync-fxa-db:
        condition: service_healthy
    restart: "no"

  # One-shot, every start: porelli/firefox-sync's own init (tokenserver_db_init)
  # with access managed elsewhere, as in firefox-sync/: the config table, the
  # ffs_* functions, the admin UI's roles and database. As the owner.
  firefox-sync-fxa-db-init:
    image: ghcr.io/porelli/firefox-sync:syncstorage-rs-postgres-init-0.25.1-20261124T171959@sha256:a43d7e844d66fa6cc48d7de027038b3f9029bf46c8740cbb445a7b2cab96f8d8
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    environment:
      POSTGRES_SERVER: firefox-sync-fxa-db
      POSTGRES_SERVER_PORT: "5432"
      POSTGRES_DATABASE: firefoxsync
      POSTGRES_USER: firefoxsync
      POSTGRES_PASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
      POSTGRES_SYNC_USER: ""
      DOMAIN: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      ADMIN_ACCESS_EXTERNAL: "1"
      SYNC_ALLOWED_ACCOUNTS: ""
      MAX_USERS: unlimited
      SYNC_DB_CONTAINERS: "1"
      ADMIN_DB_USER: firefoxsync_admin
      ADMIN_DB_SYNC_USER: firefoxsync_admin_sync
      ADMIN_DB_NAME: firefoxsync_admin
      ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD must be set}
    depends_on:
      firefox-sync-fxa-migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot, every start: Portcullis's guard on the Sync database, as in
  # firefox-sync/ without its allowlist (who may have an account is decided
  # on the accounts side): the roles and grants, this hostname's node
  # (guard.sql, one transaction). Fails closed: on any error the Sync server
  # does not start. First, in a transaction of its own that guard.sql's
  # rollback can't undo, revoke.sql: no role but the owner may run porelli's
  # SECURITY DEFINER functions. Then, outside guard.sql's transaction
  # (CREATE DATABASE can't run in one), admin-db.sql: the admin UI's own
  # database, owned by its role and closed to every other. Passwords reach
  # psql through the environment (\getenv), never argv.
  firefox-sync-fxa-init:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -X -q -t -v ON_ERROR_STOP=1 --single-transaction -f /etc/portcullis/revoke.sql
        psql -X -q -t -v ON_ERROR_STOP=1 --single-transaction -f /etc/portcullis/guard.sql
        psql -X -q -t -v ON_ERROR_STOP=1 -f /etc/portcullis/admin-db.sql
    environment:
      PGHOST: firefox-sync-fxa-db
      PGUSER: firefoxsync
      PGDATABASE: firefoxsync
      PGPASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
      FIREFOX_SYNC_APP_DB_PASSWORD: ${FIREFOX_SYNC_FXA_APP_DB_PASSWORD:?FIREFOX_SYNC_FXA_APP_DB_PASSWORD must be set}
      FIREFOX_SYNC_ADMIN_DB_PASSWORD: ${FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD:?FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD must be set}
      FIREFOX_SYNC_NODE_URL: https://${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
    volumes:
      - ./templates/firefox-sync-fxa/revoke.sql:/etc/portcullis/revoke.sql:ro
      - ./templates/firefox-sync-fxa/guard.sql:/etc/portcullis/guard.sql:ro
      - ./templates/firefox-sync-fxa/admin-db.sql:/etc/portcullis/admin-db.sql:ro
    depends_on:
      firefox-sync-fxa-db-init:
        condition: service_completed_successfully
    restart: "no"

  firefox-sync-fxa-db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    tmpfs:
      - /tmp:size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128mb
    environment:
      POSTGRES_USER: firefoxsync
      POSTGRES_PASSWORD: ${FIREFOX_SYNC_FXA_DB_PASSWORD:?FIREFOX_SYNC_FXA_DB_PASSWORD must be set}
      POSTGRES_DB: firefoxsync
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - firefox-sync-fxa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefoxsync -d firefoxsync"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The only service on portcullis-proxy: a Traefik-only nginx (the
  # esphome/gate.sh pattern, fxa-gate.sh) in front of every host, each to
  # its service under a default-only -internal name; Traefik's address range
  # alone (any other peer: 403). The admin host only for the admin group
  # (group-gate's X-Auth-Request-Groups), the sign-up endpoint only through
  # the sign-up gate. Unprivileged nginx (the image's nginx user), read-only,
  # no capabilities; it writes only its /tmp. It starts once every one-shot
  # has finished and the services behind it answer.
  fxa-gate:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    environment:
      PORTCULLIS_TRAEFIK_SOURCE: ${PORTCULLIS_TRAEFIK_SOURCE:-172.31.250.2/32}
      GATE_LISTEN: "8080"
      GATE_HOST_SYNC: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}
      GATE_HOST_ACCOUNTS: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}
      GATE_HOST_API: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}
      GATE_HOST_PROFILE: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PROFILE:-firefox-sync-fxa-profile.portcullis.local}
      GATE_HOST_ADMIN: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ADMIN:-firefox-sync-fxa-admin.portcullis.local}
      GATE_HOST_PAIRING: ${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PAIRING:-firefox-sync-fxa-pairing.portcullis.local}
      # The admin host's group (as ffs-admin's ADMIN_ALLOWED_GROUPS).
      GATE_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_firefox-sync-fxa}
    entrypoint: ["/bin/sh", "/portcullis/fxa-gate.sh"]
    volumes:
      - ./templates/firefox-sync-fxa/fxa-gate.sh:/portcullis/fxa-gate.sh:ro
    depends_on:
      fxa-db-users:
        condition: service_completed_successfully
      fxa-keys-owner:
        condition: service_completed_successfully
      fxa-migrations:
        condition: service_completed_successfully
      fxa-db-guard:
        condition: service_completed_successfully
      fxa-policy:
        condition: service_completed_successfully
      fxa-mail-check:
        condition: service_completed_successfully
      firefox-sync-fxa-migrate:
        condition: service_completed_successfully
      firefox-sync-fxa-db-init:
        condition: service_completed_successfully
      firefox-sync-fxa-init:
        condition: service_completed_successfully
      fxa-auth:
        condition: service_healthy
      fxa-content:
        condition: service_healthy
      fxa-profile:
        condition: service_healthy
      fxa-profile-static:
        condition: service_healthy
      fxa-pairing:
        condition: service_healthy
      ffs-admin:
        condition: service_healthy
      firefox-sync-fxa:
        condition: service_healthy
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      # Open host routers: Sync, API, profile, pairing (Firefox calls them in
      # the background, without cookies; no Portcullis sign-in).
      traefik.http.routers.firefox-sync-fxa.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-api.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-api.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-api.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa-api.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-api.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-profile.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PROFILE:-firefox-sync-fxa-profile.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-profile.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-profile.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa-profile.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-profile.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-pairing.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_PAIRING:-firefox-sync-fxa-pairing.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-pairing.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-pairing.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa-pairing.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-pairing.service: firefox-sync-fxa-gate
      # Gated host routers: accounts, admin (Portcullis sign-in + group-gate).
      traefik.http.routers.firefox-sync-fxa-accounts.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-accounts.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-admin.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ADMIN:-firefox-sync-fxa-admin.portcullis.local}`)
      traefik.http.routers.firefox-sync-fxa-admin.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-admin.tls.options: default
      traefik.http.routers.firefox-sync-fxa-admin.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.firefox-sync-fxa-admin.service: firefox-sync-fxa-gate
      # Path routers: open paths of the accounts host, the sign-up endpoint,
      # the tokenserver (all priority 990, above any Host() rule length).
      traefik.http.routers.firefox-sync-fxa-accounts-root.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`) && Path(`/`)
      traefik.http.routers.firefox-sync-fxa-accounts-root.priority: "990"
      traefik.http.routers.firefox-sync-fxa-accounts-root.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts-root.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts-root.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts-root.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`) && Path(`/.well-known/change-password`)
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.priority: "990"
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts-change-password.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-accounts-config.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`) && Path(`/.well-known/fxa-client-configuration`)
      traefik.http.routers.firefox-sync-fxa-accounts-config.priority: "990"
      traefik.http.routers.firefox-sync-fxa-accounts-config.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts-config.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts-config.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts-config.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_ACCOUNTS:-firefox-sync-fxa-accounts.portcullis.local}`) && Path(`/metrics-flow`)
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.priority: "990"
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.tls.options: default
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-accounts-metrics.service: firefox-sync-fxa-gate
      traefik.http.routers.firefox-sync-fxa-signup.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA_API:-firefox-sync-fxa-api.portcullis.local}`) && Path(`/v1/account/create`)
      traefik.http.routers.firefox-sync-fxa-signup.priority: "990"
      traefik.http.routers.firefox-sync-fxa-signup.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-signup.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa-signup.middlewares: rate-limit-auth@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-signup.service: firefox-sync-fxa-gate
      # The tokenserver: a stricter rate limit against token replay.
      traefik.http.routers.firefox-sync-fxa-token.rule: Host(`${PORTCULLIS_HOST_FIREFOX_SYNC_FXA:-firefox-sync-fxa.portcullis.local}`) && PathPrefix(`/1.0/`)
      traefik.http.routers.firefox-sync-fxa-token.priority: "990"
      traefik.http.routers.firefox-sync-fxa-token.entrypoints: websecure
      traefik.http.routers.firefox-sync-fxa-token.tls.options: public@file
      traefik.http.routers.firefox-sync-fxa-token.middlewares: rate-limit-auth@file,security-headers@file
      traefik.http.routers.firefox-sync-fxa-token.service: firefox-sync-fxa-gate
      traefik.http.services.firefox-sync-fxa-gate.loadbalancer.server.port: "8080"
    restart: unless-stopped

volumes:
  fxa-keys: {}
