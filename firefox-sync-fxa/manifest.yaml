# yaml-language-server: $schema=../schema/manifest.schema.json
name: Firefox Sync + own accounts
description: Firefox Sync with self-hosted Mozilla accounts (accounts, API, profile, Sync storage, admin UI); nothing depends on Mozilla
icon: "\U0001F98A"
category: productivity
tags: [firefox, sync, bookmarks, browser, mozilla, accounts]
links:
  website: https://mozilla-services.github.io/syncstorage-rs/
  source: https://github.com/porelli/firefox-sync
long_description: |
  Firefox Sync keeps bookmarks, passwords, history, open tabs and add-ons in step across a person's Firefox browsers. This template runs the whole stack on your server, Mozilla's account service included, so nothing depends on Mozilla.

  Who may have an account is the instance's access group, matched by each person's verified Portcullis email. The account pages and the admin UI sit behind Portcullis sign-in; only what Firefox needs stays open.

  The stack needs about 4 GB of RAM, and its accounts image is about 5 GB.
instances: multi

# Upstream's figures (porelli/firefox-sync docs/accounts.md#requirements and
# its chart's PVC sizes): 3-4 GB of RAM for the whole stack; accounts DB
# 8 GiB + keys 1 GiB + avatars 1 GiB + one Sync database 8 GiB. The about
# 5 GB accounts image comes on top.
resources:
  min_memory_mib: 4096
  min_disk_gib: 18

auth:
  method: forward-auth
  sso: false
  group_access: true
  # true once the admin UI admits the admin group (its OIDC sign-in), with
  # tests.signin.admin.
  group_admin: false
  access_group: users_firefox-sync-fxa
  admin_group: admin_firefox-sync-fxa
  notes: |
    Firefox Sync with its own, self-hosted Mozilla accounts (porelli/firefox-sync's fxa-mono stack). The account pages and the admin UI are behind Portcullis sign-in.

    **Mail:** the sign-up and sign-in codes go through the server's mail provider (Settings, Mail) by default, or through another SMTP server (the Mail settings). Without one the accounts server doesn't start: `fxa-mail-check` stops it and says why. STARTTLS is required, never opportunistic: a server that doesn't offer it gets no mail and no password.

    **What runs:** Mozilla's accounts (auth, content, profile servers, v1.350.0) on MySQL with Redis, the pairing channel server, syncstorage-rs 0.25.1 on PostgreSQL and porelli/firefox-sync's admin UI and sign-up gate, as built by porelli/firefox-sync (`links.source`; upstream <https://github.com/mozilla/fxa> and <https://github.com/mozilla-services/syncstorage-rs>).

# The accounts' mail (sign-up and sign-in codes, notices): the server's mail
# provider by default (the Hub's PORTCULLIS_MAIL_SENDER_*, contracts §19.14).
mail_sender:
  label: Firefox accounts

hosts:
  reasons:
    firefox-sync-fxa: "Firefox syncs in the background, without cookies; each request is signed with the account's own keys."
    firefox-sync-fxa-api: "Firefox and the account pages call the accounts API in the background, without cookies; the sign-up list decides who may create an account."
    firefox-sync-fxa-profile: "Firefox loads account profiles and avatars in the background, without cookies."
    firefox-sync-fxa-pairing: "An encrypted relay for pairing a phone by QR code; it can't read what it relays."
    firefox-sync-fxa-accounts: "Firefox reads the accounts configuration and opens the start and change-password pages without cookies; everything else on this host is behind sign-in."

settings:
  sections: [Mail, Accounts]
  options:
    - key: mail_source
      label: Send mail through
      description: >-
        Where the sign-up and sign-in codes go out. The server's mail provider
        needs one wired (Settings, Mail); without a working mail server the
        accounts server doesn't start.
      section: Mail
      type: enum
      options:
        - {value: provider, label: "The server's mail provider"}
        - {value: external, label: Another SMTP server}
      default: provider
      applies: restart
      delivery: [{env: MAIL_SOURCE}]
    - key: smtp_host
      label: SMTP server
      description: Another SMTP server only. Its host name.
      section: Mail
      type: string
      format: hostname
      applies: restart
      delivery: [{env: EXT_SMTP_HOST}]
    - key: smtp_port
      label: SMTP port
      description: Another SMTP server only. 587 for STARTTLS, 465 for TLS.
      section: Mail
      type: int
      min: 1
      max: 65535
      default: 587
      applies: restart
      delivery: [{env: EXT_SMTP_PORT}]
    - key: smtp_security
      label: SMTP security
      description: Another SMTP server only. STARTTLS on 587 or TLS from the start on 465.
      section: Mail
      type: enum
      options:
        - {value: starttls, label: STARTTLS (587)}
        - {value: tls, label: TLS (465)}
      default: starttls
      applies: restart
      delivery: [{env: EXT_SMTP_SECURITY}]
    - key: smtp_user
      label: SMTP user
      description: Another SMTP server only. Empty when it takes mail without signing in.
      section: Mail
      type: string
      requires: [smtp_host, smtp_sender]
      applies: restart
      delivery: [{env: EXT_SMTP_USER}]
    - key: smtp_password
      label: SMTP password
      description: Another SMTP server only. The password of the SMTP user.
      section: Mail
      type: secret
      applies: restart
      delivery: [{env: EXT_SMTP_PASSWORD}]
    - key: smtp_sender
      label: Sender address
      description: Another SMTP server only. The address the mail comes from, shown as Firefox accounts.
      section: Mail
      type: string
      format: email
      applies: restart
      delivery: [{env: EXT_SMTP_SENDER}]
    - key: max_accounts
      label: Maximum accounts
      description: >-
        At most this many accounts; sign-ups are refused once they exist.
        Empty: no limit, the access group decides.
      section: Accounts
      type: int
      min: 1
      applies: restart
      delivery: [{env: MAX_ACCOUNTS}]

env:
  - key: FXA_MYSQL_PASSWORD
    description: Accounts database (MySQL) root password, for the one-shots only (migrations, policy, database users)
    generate: random
  - key: FXA_AUTH_DB_PASSWORD
    description: Accounts database password of the auth server (fxa_auth; not root, nothing on ffs)
    generate: random
  - key: FXA_PROFILE_DB_PASSWORD
    description: Accounts database password of the profile server (fxa_profile; its own database only)
    generate: random
  - key: FXA_ADMIN_DB_PASSWORD
    description: Accounts database password of the admin UI (ffs_admin)
    generate: random
  - key: FXA_ACCESS_DB_PASSWORD
    description: Accounts database password of Portcullis's access sync (ffs_access, the sign-up allowlist)
    generate: random
  - key: FXA_OAUTH_SECRET
    description: Accounts OAuth server secret (also the key the MFA JWT key is derived from)
    generate: random
  - key: FXA_AUTH_SECRET
    description: Accounts auth server shared secret
    generate: random
  - key: FXA_PROFILE_SECRET
    description: Accounts profile server bearer token
    generate: random
  - key: FXA_FLOW_ID_KEY
    description: Accounts flow id key
    generate: random
  - key: FXA_SESSION_TOKEN_HANDLE_KEY
    description: Accounts session token handle key
    generate: random
  - key: FXA_CONTENT_SESSION_SECRET
    description: Account pages' session cookie secret
    generate: random
  - key: FIREFOX_SYNC_FXA_DB_PASSWORD
    description: Sync database owner password (migrations, init)
    generate: random
  - key: FIREFOX_SYNC_FXA_APP_DB_PASSWORD
    description: Sync database password of the server's own role (no owner rights)
    generate: random
  - key: FIREFOX_SYNC_FXA_ADMIN_DB_PASSWORD
    description: Sync database password of the admin UI's own roles (its database, its reader of the Sync data)
    generate: random
  - key: FIREFOX_SYNC_FXA_MASTER_SECRET
    description: syncstorage-rs master secret (signs the storage tokens)
    generate: random
  - key: FIREFOX_SYNC_FXA_METRICS_SECRET
    description: tokenserver metrics hash secret
    generate: random
  - key: FIREFOX_SYNC_FXA_ADMIN_OIDC_SECRET
    description: OpenID Connect client secret of the admin UI
    generate: random

urls:
  - label: Accounts (identity.fxaccounts.autoconfig.uri)
    url: "https://{{HOST_FIREFOX_SYNC_FXA_ACCOUNTS}}"
  - label: Admin UI
    url: "https://{{HOST_FIREFOX_SYNC_FXA_ADMIN}}/"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test"):
# the account pages behind Portcullis sign-in.
tests:
  signin:
    host: "{{HOST_FIREFOX_SYNC_FXA_ACCOUNTS}}"
    path: /settings
    signed_in:
      html: "Mozilla accounts"
      wait: 60
    boot_timeout: 900

ai:
  unsupported: "Signs people in with its own Mozilla accounts, not Portcullis identities; no MCP server known"
