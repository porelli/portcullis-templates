name: Immich
description: Self-hosted photo and video backup with AI-powered search
icon: "\U0001F4F7"
category: media
tags: [photos, videos, backup, ai, gallery]
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  keycloak_access_role: true
  group_admin: false
  access_group: users_immich
  admin_group: admin_immich
  # Shared links (Immich v3.3.5): the share pages plus the API routes the
  # server allows for shared-link sessions (SHARED_LINK_ROUTES in
  # server/src/controllers/index.spec.ts; ?key= / ?slug= query auth), so
  # only mode all exists. Immich is native-OIDC: its main router has no
  # forward-auth, so the exception matters for the TLS tier only. Off by
  # default: with an mTLS-only policy, turning it on drops the handshake
  # client-cert requirement for the whole host.
  public_access:
    enabled_by_default: false
    description: >-
      Shared links (/share/<key>, /s/<slug>) for visitors without a client
      certificate. Immich's shared-link key, password and expiry still apply.
    # Logins are not honoured on public paths: core's public guard refuses
    # requests carrying Authorization, these API-key / session headers, the
    # session cookie or an apiKey / sessionKey parameter (server/src/enum.ts ImmichCookie, ImmichHeader,
    # ImmichQuery).
    credential_headers: [x-api-key, x-immich-user-token, x-immich-session-token]
    credential_cookies: [immich_access_token, immich_maintenance_token]
    credential_query: [apiKey, sessionKey]
    paths:
      - prefix: /share
        description: Shared-link page by key (server-rendered OpenGraph, SPA)
      - prefix: /s
        description: Shared-link page by custom slug
      - prefix: /_app
        description: SvelteKit JS, CSS and fonts
        supporting: true
      - prefix: /custom.css
        description: Admin custom CSS loaded by every page
        supporting: true
        exact: true
        justification: Single public route serving the admin's custom CSS (server/src/app.common.ts)
      - prefix: /favicon.ico
        description: Favicon
        supporting: true
        exact: true
        justification: Single static file
      - prefix: /api/server/config
        description: Server config fetched at web app boot
        supporting: true
        exact: true
        justification: Public route (no auth) with the login/branding config the web app needs to start
      - prefix: /api/server/features
        description: Feature flags fetched at web app boot
        supporting: true
        exact: true
        justification: Public route (no auth) with the feature flags the web app needs to start
      - prefix: /api/server/media-types
        description: Accepted media types (upload into a shared album)
        supporting: true
        exact: true
        justification: Public route (no auth), list of accepted file types
      - prefix: /api/shared-links/me
        description: Resolves the shared link of the key / slug
        exact: true
        justification: Shared-link route (sharedLink auth)
      - prefix: /api/shared-links/login
        description: Password check of protected shared links
        exact: true
        justification: Shared-link route (sharedLink auth)
      - prefix: /api/assets
        description: Asset info, thumbnails, originals, video playback and upload (Immich checks the shared-link key)
      - prefix: /api/albums
        description: Shared album and its map markers
      - prefix: /api/timeline
        description: Album timeline buckets
      - prefix: /api/download/info
        description: Download size / archive plan
        exact: true
        justification: Shared-link route (sharedLink auth)
      - prefix: /api/download/archive
        description: Zip download
        exact: true
        justification: Shared-link route (sharedLink auth)
  notes: >
    Full OIDC with auto-register and auto-launch; password login is disabled
    while OIDC is configured. Promote an SSO user to admin with
    `docker exec <immich-server container> immich-admin grant-admin`.
    roleClaim available but not yet mapped to groups.
    Identity: OAuth users are keyed on the OIDC sub. Immich also links a login
    to an existing user with the same email and cannot be told not to, while
    LLDAP emails are user-editable; so on every start a one-shot job
    (immich-lock-local-users) gives local, unlinked users (such as the initial
    admin@portcullis.local) a placeholder OAuth id, and Immich then refuses
    the email link. Do not create local users in the Immich UI (they are only
    locked at the next restart); let users sign in with SSO instead. A user
    who unlinks OAuth in their settings is locked out of SSO until an admin
    clears the placeholder.
    Public exceptions (Hub, off by default): shared links still work for
    signed-in users; turning them on only matters when the policy requires a
    client certificate at the TLS handshake, which it then no longer does for
    any path of photos.<domain> (mTLS stays enforced at login via the
    Keycloak acr).
    Upgrades: immich-server and immich-machine-learning are pinned to the same
    release and must always move together; read the upstream release notes for
    breaking changes and keep immich-db on the image upstream specifies.

settings:
  - key: IMMICH_EXTERNAL_PATH
    label: External photo library
    description: Host path to existing photos to import (mounted read-only)
    type: path
    target:
      service: immich-server
      mount: /usr/src/app/external

env:
  - key: IMMICH_DB_PASSWORD
    description: Immich database password
    generate: random
  - key: IMMICH_OIDC_SECRET
    description: Immich OIDC client secret
    generate: random
  - key: IMMICH_ADMIN_PASSWORD
    description: Password for the initial Immich admin (admin@portcullis.local)
    generate: random

keycloak_clients:
  - client_id: immich
    secret_env: IMMICH_OIDC_SECRET
    redirect_uris:
      - "https://{{HOST_IMMICH}}/auth/login"
      - "https://{{HOST_IMMICH}}/user-settings"
      - "app.immich:///oauth-callback"
    name: Immich

config_files: []

urls:
  - label: Photos
    url: "https://{{HOST_IMMICH}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /auth/login
    login: ["button:has-text('Login with SSO')"]
    signed_in:
      json: {url: /api/users/me, field: storageLabel}
    expected_fail:
      outsider:
        reason: "group_access: false: Immich has no OIDC group restriction, every Portcullis user can sign in until the Hub's per-app Keycloak client access (Task 4b) lands"
        match: "e2eoutsider signed in"
