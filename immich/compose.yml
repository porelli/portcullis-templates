# immich-server and immich-machine-learning: keep on the same release (lockstep).
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_CONFIG_FILE: /etc/immich/config.json
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.crt
    volumes:
      - immich-upload:/usr/src/app/upload
      - immich-config:/etc/immich:ro
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    depends_on:
      immich-init:
        condition: service_completed_successfully
      immich-db:
        condition: service_started
      immich-redis:
        condition: service_started
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: Host(`${PORTCULLIS_HOST_IMMICH:-photos.portcullis.local}`)
      traefik.http.routers.immich.entrypoints: websecure
      traefik.http.routers.immich.tls.options: authaware@file
      traefik.http.routers.immich.middlewares: client-headers@file,security-headers@file
      traefik.http.services.immich.loadbalancer.server.port: "2283"
    restart: unless-stopped

  immich-init:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    entrypoint: ["/bin/sh", "-c"]
    # Regenerated on every start: the config is fully derived from the
    # template + env (and Immich treats a config file as read-only anyway).
    # $$VAR is expanded by the container shell, not by compose; the template
    # placeholders are the literal text ${VAR}. Never print the result —
    # it contains the OIDC client secret.
    command:
      - |
        set -eu
        echo "Generating Immich config..."
        if [ -n "$${IMMICH_OIDC_SECRET}" ]; then
          PASSWORD_LOGIN=false
        else
          echo "IMMICH_OIDC_SECRET empty: keeping password login enabled."
          PASSWORD_LOGIN=true
        fi
        # Instance settings (Hub-validated; checked again so a bad value
        # can't break the JSON): trash days and machine learning on/off.
        case "$${IMMICH_TRASH_DAYS}" in
          ''|*[!0-9]*) echo "IMMICH_TRASH_DAYS must be a whole number of days" >&2; exit 1 ;;
        esac
        case "$${IMMICH_MACHINE_LEARNING}" in
          true|false) ;;
          *) echo "IMMICH_MACHINE_LEARNING must be true or false" >&2; exit 1 ;;
        esac
        sed \
          -e "s|\$${PORTCULLIS_DOMAIN}|$${PORTCULLIS_DOMAIN}|g" \
          -e "s|\$${IMMICH_OIDC_CLIENT_ID}|$${IMMICH_OIDC_CLIENT_ID}|g" \
          -e "s|\$${IMMICH_OIDC_SECRET}|$${IMMICH_OIDC_SECRET}|g" \
          -e "s|\$${IMMICH_PASSWORD_LOGIN}|$${PASSWORD_LOGIN}|g" \
          -e "s|\$${IMMICH_TRASH_DAYS}|$${IMMICH_TRASH_DAYS}|g" \
          -e "s|\$${IMMICH_MACHINE_LEARNING}|$${IMMICH_MACHINE_LEARNING}|g" \
          /tmp/config.json.tmpl > /etc/immich/config.json.new
        mv /etc/immich/config.json.new /etc/immich/config.json
        echo "Config generated."
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      IMMICH_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-immich}
      IMMICH_OIDC_SECRET: ${IMMICH_OIDC_SECRET:-}
      IMMICH_TRASH_DAYS: ${IMMICH_TRASH_DAYS:-30}
      IMMICH_MACHINE_LEARNING: ${IMMICH_MACHINE_LEARNING:-true}
    volumes:
      - immich-config:/etc/immich
      - ./templates/immich/immich-config.json.tmpl:/tmp/config.json.tmpl:ro

  immich-setup:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    entrypoint: ["/bin/sh", "/setup.sh"]
    environment:
      IMMICH_ADMIN_PASSWORD: ${IMMICH_ADMIN_PASSWORD:?IMMICH_ADMIN_PASSWORD must be set}
    volumes:
      - ./templates/immich/setup.sh:/setup.sh:ro
    depends_on:
      - immich-server
    restart: "no"

  # Immich links an OAuth login to an existing user with the same email
  # (AuthService.callback: "link by email") and has no setting to turn that
  # off. LLDAP emails are user-editable, so anyone could claim a local
  # account (e.g. the initial admin) by setting its email. This one-shot job
  # gives every local, unlinked user a placeholder oauthId after setup, which
  # makes Immich refuse the email link ("email already linked") instead.
  immich-lock-local-users:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h immich-db -U immich -d immich -v ON_ERROR_STOP=1 -q <<'SQL'
        UPDATE "user" SET "oauthId" = 'portcullis-local:' || id
          WHERE "oauthId" IS NULL OR "oauthId" = '';
        SQL
        echo "Local Immich users locked against OAuth email linking."
    environment:
      PGPASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set}
    depends_on:
      immich-setup:
        condition: service_completed_successfully
    restart: "no"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    volumes:
      - immich-ml-cache:/cache

  immich-redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f

  immich-db:
    # Immich's own Postgres image (VectorChord + pgvecto.rs for migration from
    # the old tensorchord/pgvecto-rs image). Kept on PG 16 to match existing
    # data volumes; tag/digest per upstream docker-compose.yml (v3.3.5).
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    volumes:
      - immich-db-data:/var/lib/postgresql/data

volumes:
  immich-upload: {}
  immich-ml-cache: {}
  immich-db-data: {}
  immich-config: {}

networks:
  portcullis-proxy:
    external: true
