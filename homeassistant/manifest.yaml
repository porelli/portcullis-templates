# yaml-language-server: $schema=../schema/manifest.schema.json
name: Home Assistant
description: Open-source home automation hub with dashboards, automations and integrations
icon: "\U0001F3E0"
category: home-automation
tags: [home-automation, smart-home, iot, dashboards, automations]
links:
  website: https://www.home-assistant.io/
  source: https://github.com/home-assistant/core
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  group_admin: true
  keycloak_access_role: true
  access_group: users_homeassistant
  admin_group: admin_homeassistant
  notes: >
    Home Assistant 2026.10 has no OpenID Connect of its own; sign-in goes
    through the OpenID Connect custom integration auth_oidc
    (christiaangoossens/hass-oidc-auth, the integration HACS lists, here
    pinned to release 1.2.1 and installed by the homeassistant-init one-shot
    from the release asset after its SHA-256 matched; a mismatch stops the
    start. Its Python requirements ship in the Home Assistant image). It is the only auth
    provider: configuration.yaml (shipped read-only) sets auth_providers: []
    so Home Assistant's own username/password login doesn't exist, and
    homeassistant-init marks onboarding done before the first start, so the
    onboarding wizard (which creates a password owner) never opens. The app
    is routed only while /auth/providers lists auth_oidc alone and
    onboarding is closed. Who can sign in: auth_oidc admits users in
    users_homeassistant (roles.user) and also users in admin_homeassistant
    alone (roles.admin implies access upstream), so the Hub's Keycloak
    access role (keycloak_access_role) restricts the client to
    users_homeassistant as well: in production only that group gets a
    token at all. admin_homeassistant members become Home Assistant
    administrators. Upstream sets roles only when the account is created
    (first login): change an existing user's administrator flag
    in Settings > People. Accounts are keyed on the OIDC issuer + sub, the
    display name is the LLDAP username (preferred_username), and SSO logins
    are never linked to existing accounts (automatic_user_linking off). No
    one is the instance owner; administrators can do everything an owner
    can except owner-only operations. Break-glass: there is no local login;
    an operator temporarily mounts a modified configuration.yaml (with a
    local provider) over the template's through the Hub's custom override.
    What works: the web UI and its websocket API (straight to Home
    Assistant, no forward-auth on the host), long-lived access tokens
    created by a signed-in user, and the Companion apps: upstream signs
    mobile apps in with a device code shown in the app and confirmed in a
    browser (Chrome/Safari or another computer) where the user signs in to
    Portcullis. That device-code step is phishable: a member can be tricked
    into entering a code an outsider's app shows, which signs that app in
    as the member (enter only codes from your own device). Limits: removing
    a user from the groups blocks new sign-ins only. Home Assistant refresh
    tokens stay valid until unused for 90 days and long-lived access tokens
    are effectively permanent (upstream has no session management or
    back-channel logout yet): deactivate the user in Home Assistant
    (Settings > People) to revoke them. Networking: the container is
    on Docker bridge networks only (never host networking, which would
    publish port 8123 past the gateway), so mDNS/SSDP/DHCP discovery,
    Bluetooth and USB radios are not available; use IP-based integrations
    (or MQTT / a network radio bridge). The HTTP server settings (Traefik
    as the only trusted proxy) are rewritten by homeassistant-init at every
    start; changes made in the UI don't persist. That is also why several instances
    can run side by side (instances: multi). Upgrades: read the Home
    Assistant and hass-oidc-auth release notes; bump auth_oidc (version and
    SHA-256 in init.py) together with Home Assistant when upstream requires
    it. AI support: the built-in MCP Server integration, with Home Assistant
    as its own OAuth server (people sign in through Portcullis); Home
    Assistant applies its own rules (only Assist-exposed entities, the
    person's own account), Portcullis doesn't log or confirm its AI actions.
    Turning AI support on adds the integration with administrators-only off
    and the Assist API only (an administrator may change both in Home
    Assistant); turning it off removes it, and the homeassistant
    service's entrypoint (portcullis/prestart.py) removes it again before
    every start while AI support is off. The AI hooks act as "Portcullis
    hooks", a system user prestart.py provisions with a new token at every
    start (hidden from Settings > People, local only, no credential of any
    sign-in provider, so it can't sign in). When a person leaves while AI
    support is on, every Home Assistant refresh token of theirs ends (web
    sessions, Companion apps, long-lived tokens, AI clients); the account
    stays. The person is matched by the OIDC sub auth_oidc stored when they
    first signed in (the Hub sends their Keycloak id), never by name: people
    can rename themselves. An authorization code Home Assistant issued just
    before someone left stays usable for its 10 minutes. Switching AI
    support on or off ends every OAuth client token except Home
    Assistant's own web frontend and Companion apps; long-lived tokens are
    kept.

env:
  - key: HOMEASSISTANT_OIDC_SECRET
    description: Home Assistant OIDC client secret
    generate: random

keycloak_clients:
  - client_id: homeassistant
    secret_env: HOMEASSISTANT_OIDC_SECRET
    redirect_uri: "https://{{HOST_HOMEASSISTANT}}/auth/oidc/callback"
    name: Home Assistant

config_files: []

urls:
  - label: Home
    url: "https://{{HOST_HOMEASSISTANT}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    # / -> /auth/authorize -> (injected) /auth/oidc/welcome -> Keycloak; the
    # web client stores its tokens (storeToken), read by the checks below
    # through the websocket API (auth/current_user).
    path: /
    # auth_oidc's finish page: continue in this browser (the other option
    # approves a Companion app's device code).
    login: ["#continue-on-this-device"]
    signed_in:
      js: >-
        new Promise((resolve) => {
          let t = null; try { t = JSON.parse(localStorage.getItem('hassTokens') || 'null'); } catch (e) {}
          if (!t || !t.access_token) { resolve(null); return; }
          const ws = new WebSocket('wss://' + location.host + '/api/websocket');
          const done = (v) => { try { ws.close(); } catch (e) {} resolve(v); };
          setTimeout(() => done(null), 8000);
          ws.onerror = () => done(null);
          ws.onmessage = (ev) => {
            const m = JSON.parse(ev.data);
            if (m.type === 'auth_required') ws.send(JSON.stringify({type: 'auth', access_token: t.access_token}));
            else if (m.type === 'auth_ok') ws.send(JSON.stringify({id: 1, type: 'auth/current_user'}));
            else if (m.type === 'auth_invalid') done(null);
            else if (m.id === 1) done(m.success && m.result ? m.result.name : null);
          };
        })
      wait: 60
    admin:
      js: >-
        new Promise((resolve) => {
          let t = null; try { t = JSON.parse(localStorage.getItem('hassTokens') || 'null'); } catch (e) {}
          if (!t || !t.access_token) { resolve(null); return; }
          const ws = new WebSocket('wss://' + location.host + '/api/websocket');
          const done = (v) => { try { ws.close(); } catch (e) {} resolve(v); };
          setTimeout(() => done(null), 8000);
          ws.onerror = () => done(null);
          ws.onmessage = (ev) => {
            const m = JSON.parse(ev.data);
            if (m.type === 'auth_required') ws.send(JSON.stringify({type: 'auth', access_token: t.access_token}));
            else if (m.type === 'auth_ok') ws.send(JSON.stringify({id: 1, type: 'auth/current_user'}));
            else if (m.type === 'auth_invalid') done(null);
            else if (m.id === 1) done(m.success && m.result ? m.result.is_admin : null);
          };
        })
      equals: true
      wait: 20
    boot_timeout: 900

# AI support (contracts §3.2, §15.5): Home Assistant's built-in MCP Server
# integration at https://<host>/api/mcp, with Home Assistant as its own
# OAuth authorization server (IndieAuth / client id metadata documents,
# PKCE, no client secret); people sign in to it through Keycloak
# (auth_oidc), so every tool call runs as that person's Home Assistant
# account and sees only Assist-exposed entities. The gate is not in the
# path. portcullis/mcp-hook.py (calls verified against 2026.10.4 in its
# header) turns the integration on with "Require an administrator account"
# off and the Assist API only, removes it when AI support is off, and ends
# a person's Home Assistant refresh tokens when they leave.
ai:
  on_change: mcp-integration
  mcp:
    - name: homeassistant
      label: Home Assistant
      kind: builtin
      service: homeassistant
      port: 8123
      path: /api/mcp
      router: homeassistant          # people connect to https://<host>/api/mcp
      upstream: official
      source: https://www.home-assistant.io/integrations/mcp_server/
      protocol: ["2025-11-25", "2025-06-18"]
      modes: [read_write]
      identity:
        mode: app_oauth
        revoke: mcp-revoke
      aggregate: false

# Hooks of the ai: block, in the homeassistant service (root, as the image
# runs): REST and websocket calls to 127.0.0.1:8123 as the hook admin that
# prestart.py provisions. Nothing they print is used.
hooks:
  - name: mcp-integration
    service: homeassistant
    user: root
    command: [python3, -I, /portcullis/mcp-hook.py, on_change]
    when: [ai]
    timeout: 60s
  - name: mcp-revoke
    service: homeassistant
    user: root
    command: [python3, -I, /portcullis/mcp-hook.py, revoke]
    when: [ai]
    timeout: 120s
