services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 1024
    # prestart.py provisions the AI hooks' admin and, with AI support off,
    # removes the MCP Server config entry, then execs the image's /init.
    entrypoint: ["python3", "-I", "/portcullis/prestart.py"]
    environment:
      HA_AI_ENABLED: ${PORTCULLIS_AI_ENABLED:-false}
      HA_EXTERNAL_URL: https://${PORTCULLIS_HOST_HOMEASSISTANT:-home.portcullis.local}
      HA_OIDC_DISCOVERY_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/.well-known/openid-configuration
      HA_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-homeassistant}
      HA_OIDC_CLIENT_SECRET: ${HOMEASSISTANT_OIDC_SECRET:?HOMEASSISTANT_OIDC_SECRET must be set}
      HA_ACCESS_GROUP: ${PORTCULLIS_ACCESS_GROUP:-users_homeassistant}
      HA_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_homeassistant}
    volumes:
      - homeassistant-config:/config
      - ./templates/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./templates/homeassistant/healthcheck.py:/portcullis/healthcheck.py:ro
      - ./templates/homeassistant/portcullis/prestart.py:/portcullis/prestart.py:ro
      - ./templates/homeassistant/portcullis/mcp-hook.py:/portcullis/mcp-hook.py:ro
      - ./certs/ca-bundle.crt:/portcullis/ca-bundle.crt:ro
    # Healthy (= routed by Traefik) only while auth_oidc is the only auth
    # provider and onboarding is closed.
    healthcheck:
      test: ["CMD", "python3", "/portcullis/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      homeassistant-init:
        condition: service_completed_successfully
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.homeassistant.rule: Host(`${PORTCULLIS_HOST_HOMEASSISTANT:-home.portcullis.local}`)
      traefik.http.routers.homeassistant.entrypoints: websecure
      traefik.http.routers.homeassistant.tls.options: authaware@file
      traefik.http.routers.homeassistant.middlewares: client-headers@file,security-headers@file
      traefik.http.routers.homeassistant.service: homeassistant
      traefik.http.services.homeassistant.loadbalancer.server.port: "8123"
    restart: unless-stopped

  # One-shot, every start, before Home Assistant: onboarding marked done (no
  # local owner account), the pinned auth_oidc integration and its joserfc
  # wheel installed after their SHA-256 matched. Fails closed.
  homeassistant-init:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    mem_limit: 256m
    pids_limit: 64
    entrypoint: ["python3", "/portcullis/init.py"]
    environment:
      HA_TRUSTED_PROXY: ${PORTCULLIS_TRAEFIK_SOURCE:-172.31.250.2/32}
    volumes:
      - homeassistant-config:/config
      - ./templates/homeassistant/init.py:/portcullis/init.py:ro
    restart: "no"

volumes:
  homeassistant-config: {}

networks:
  portcullis-proxy:
    external: true
