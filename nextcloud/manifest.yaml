name: Nextcloud
description: Self-hosted productivity platform — files, calendar, contacts, office
icon: "\u2601"
category: productivity
tags: [files, calendar, office, collaboration]
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  group_admin: true
  access_group: users_nextcloud
  admin_group: admin_nextcloud
  # Public share links (Nextcloud 34.0.5, pretty URLs on in the apache
  # image). Listed mode by default: nothing is public until an admin lists
  # a share in the Hub. Paths researched in nextcloud/server v34.0.5
  # (apps/files_sharing/appinfo/routes.php, apps/dav/appinfo/v2/publicremote.php,
  # apps/dav/lib/Connector/Sabre/PublicAuth.php, core/Listener/
  # BeforeTemplateRenderedListener.php); see the app page in the docs.
  public_access:
    enabled_by_default: true
    default_mode: listed
    description: >-
      Public share links (/s/<token>) for visitors without a client
      certificate. Nextcloud's share password, expiry and download limits
      still apply.
    # Share tokens: 6-32 chars of Nextcloud's human-readable alphabet, or
    # custom tokens of letters, digits and '-' (ShareAPIController.php).
    token_pattern: '^[A-Za-z0-9-]{1,32}$'
    # Remember-me login cookies (lib/private/User/Session.php): core's
    # public guard refuses requests carrying them (403). Authorization (Basic login with a
    # password / app password, base.php tryBasicAuthLogin) is always
    # stripped; public WebDAV only uses Basic optionally (PublicAuth.php),
    # the browser uses the share session. The PHP session cookie stays:
    # password-protected shares and CSRF tokens need it, and the routes
    # below are share-scoped or static files only.
    credential_cookies: [nc_username, nc_token, nc_session_id]
    paths:
      - prefix: "/s/{token}"
        description: Share page, password form, download and direct preview
      - prefix: "/index.php/s/{token}"
        description: Same share routes for links created without pretty URLs
      - prefix: "/public.php/dav/files/{token}"
        description: Public WebDAV of the share (listing, downloads, zip, uploads to editable shares)
      - prefix: "/public.php/dav/uploads/{token}"
        description: Chunked uploads to file-drop / editable shares
      - prefix: "/apps/files_sharing/publicpreview/{token}"
        description: Thumbnails of the shared files
      # Supporting paths serve static files only (css, js, images, fonts):
      # the Hub matches them by extension, so no PHP route under them.
      - prefix: /dist
        description: Compiled JS/CSS of core, files, files_sharing and systemtags
        supporting: true
      - prefix: /core/css
        description: Core stylesheets
        supporting: true
      - prefix: /core/img
        description: Core images
        supporting: true
      - prefix: /core/js
        description: mimetypelist.js (and the oc.js config fallback, same data the page inlines)
        supporting: true
      - prefix: /core/l10n
        description: Core translations
        supporting: true
      - prefix: /core/mimeicon
        description: File-type icon for files without a preview
        supporting: true
        exact: true
        justification: "#[PublicPage] PreviewController::getMimeIconUrl, only redirects to a static icon (core/Controller/PreviewController.php)"
      - prefix: /apps/theming
        description: Theme stylesheets and icons (*.css / *.svg / *.png; its admin routes have no file extension)
        supporting: true
      - prefix: /apps/viewer
        description: In-browser image/video/audio viewer (static app, no routes)
        supporting: true
      - prefix: /apps/files/l10n
        description: Files UI translations
        supporting: true
      - prefix: /apps/systemtags/l10n
        description: System tags translations
        supporting: true
      - prefix: /apps/files_sharing/css
        description: Share page styles
        supporting: true
      - prefix: /apps/files_sharing/img
        description: Share page images
        supporting: true
      - prefix: /apps/files_sharing/l10n
        description: Share page translations
        supporting: true
      - prefix: /apps/text/js
        description: Markdown / README viewer scripts
        supporting: true
      - prefix: /apps/text/public
        description: Markdown / README viewer public sessions (token in the request body, so only in mode all)
  notes: >
    Native OIDC through Nextcloud's official user_oidc app (pinned
    v8.11.0, installed and configured by setup.sh at every start; upgrade it
    there). Sign-in is one Portcullis login: the login page redirects to
    Keycloak. Accounts are created on the first SSO login and keyed on the
    LLDAP username (preferred_username, unique-uid off, so the Nextcloud user
    id is the username); soft auto-provisioning is off, so an SSO login is
    never attached to an existing local account and nothing is matched by
    email (the user-editable email only fills the profile). A local account
    with the same name as an LLDAP user (e.g. the break-glass "admin") makes
    that user's SSO login fail with "User conflict" until it is renamed or
    removed (occ files:transfer-ownership moves its files). Only members of
    users_nextcloud or admin_nextcloud may sign in (user_oidc group
    whitelist + login restriction); both groups are synced into Nextcloud at
    each login, and members of admin_nextcloud become Nextcloud admins
    within a minute (nextcloud-cron maps them into Nextcloud's "admin"
    group and removes SSO accounts that left it; local accounts are never
    touched). Desktop/mobile clients use Login Flow v2 and get app passwords;
    WebDAV/OCS accept only app passwords or tokens (token_auth_enforced), never
    an account password. Break-glass: the local "admin" account
    (NEXTCLOUD_ADMIN_PASSWORD) signs in at /login?direct=1; /login sits behind
    forward-auth + group-gate (users_nextcloud), so its password form never
    faces the internet. Last resort: occ inside the container. Removing a
    user from the groups blocks new SSO logins and drops the groups at their
    next login, not sessions or app passwords already issued (disable the
    user in Nextcloud for that); single logout is off because the Keycloak
    client has no post-logout redirect URI. Hostname: setup.sh re-applies
    trusted_domains, overwrite.cli.url, overwritehost and overwriteprotocol
    from the instance's hostname at every start, so a hostname change only
    needs a restart. Existing installs: the first start installs user_oidc;
    local accounts created by hand keep working with their passwords only
    through /login?direct=1 (behind the gateway) and app passwords.
    Public exceptions: with native OIDC the host is not behind forward-auth,
    so share links work like on any Nextcloud (share token, password, expiry
    and Nextcloud's brute-force protection, which sees the client IP via
    TRUSTED_PROXIES = Traefik). The Hub exception matters when the host's
    policy requires a client certificate: then only the listed share links
    (or all, in mode all) and the static files their page needs skip it, and
    logins (Basic auth, remember-me cookies) are refused there. The PDF
    viewer page (a PHP route) is not in the list, so on such hosts PDFs on a
    share download instead of opening inline; Markdown renders only in mode
    all. Apps installed under /custom_apps that hook the share page are not
    covered.
    Upgrades: the image is pinned; Nextcloud only upgrades one major version at
    a time, so step through every major (e.g. 33 -> 34 -> 35) and never skip one.
    Keep nextcloud and nextcloud-cron on the same image.
env:
  - key: NEXTCLOUD_ADMIN_PASSWORD
    description: Password of the break-glass local Nextcloud admin (sign in at /login?direct=1)
    generate: random
  - key: NEXTCLOUD_OIDC_SECRET
    description: Nextcloud OIDC client secret
    generate: random

keycloak_clients:
  - client_id: nextcloud
    secret_env: NEXTCLOUD_OIDC_SECRET
    redirect_uris:
      - "https://{{HOST_NEXTCLOUD}}/apps/user_oidc/code"
      - "https://{{HOST_NEXTCLOUD}}/index.php/apps/user_oidc/code"
    name: Nextcloud

config_files: []

urls:
  - label: Nextcloud
    url: "https://{{HOST_NEXTCLOUD}}"
