services:
  nextcloud:
    image: nextcloud:34.0.5-apache@sha256:515c072ea1cf82ece3503f301fdf75dd5a7148abcc8fa10aaefd5ec56643b703
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD must be set}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${PORTCULLIS_DOMAIN:-portcullis.local}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: cloud.${PORTCULLIS_DOMAIN:-portcullis.local}
      # Only Traefik (static IP on portcullis-proxy, set by core) may supply
      # X-Forwarded-For.
      TRUSTED_PROXIES: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: Host(`cloud.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.tls.options: authaware@file
      traefik.http.routers.nextcloud.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.nextcloud.loadbalancer.server.port: "80"
    restart: unless-stopped

volumes:
  nextcloud-data:
    name: portcullis_nextcloud-data

networks:
  portcullis-proxy:
    external: true
