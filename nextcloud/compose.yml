services:
  nextcloud:
    image: nextcloud:34.0.5-apache@sha256:515c072ea1cf82ece3503f301fdf75dd5a7148abcc8fa10aaefd5ec56643b703
    # The image runs executable *.sh files in
    # /docker-entrypoint-hooks.d/before-starting as www-data after its
    # install/upgrade step, at every start. Install a 0755 copy of the
    # read-only template file there (template file modes are not guaranteed)
    # and hand over to the image's own entrypoint and command.
    # Database (setup choice "database", fixed after the first start): the
    # image installs on first start only with a database selected (without
    # one Apache would serve the web installer), and it picks the first of
    # SQLITE_DATABASE / MYSQL_* / POSTGRES_* that is set at all, so only the
    # chosen one's variables are exported here. SQLite (in the data volume)
    # is what installs of earlier template versions use. A database server
    # runs only under its compose profile, so nextcloud can't depends_on it:
    # wait here until it accepts connections (its image listens on TCP only
    # once its own init is done), at every start, failing closed after 5 min.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${NEXTCLOUD_DATABASE:-sqlite}" in
          sqlite) export SQLITE_DATABASE=nextcloud; db_host= ;;
          mysql) export MYSQL_HOST=nextcloud-mariadb MYSQL_DATABASE=nextcloud MYSQL_USER=nextcloud MYSQL_PASSWORD="$$NEXTCLOUD_DB_PASSWORD"; db_host=nextcloud-mariadb db_port=3306 ;;
          postgres) export POSTGRES_HOST=nextcloud-postgres POSTGRES_DB=nextcloud POSTGRES_USER=nextcloud POSTGRES_PASSWORD="$$NEXTCLOUD_DB_PASSWORD"; db_host=nextcloud-postgres db_port=5432 ;;
          *) echo "portcullis: unknown database '$$NEXTCLOUD_DATABASE'" >&2; exit 1 ;;
        esac
        if [ -n "$$db_host" ]; then
          i=0
          until php -r 'exit(@fsockopen($$argv[1], (int) $$argv[2], $$n, $$e, 2) ? 0 : 1);' "$$db_host" "$$db_port"; do
            i=$$((i + 1))
            [ "$$i" -lt 60 ] || { echo "portcullis: database $$db_host:$$db_port not reachable" >&2; exit 1; }
            echo "portcullis: waiting for the database ($$db_host:$$db_port)"
            sleep 5
          done
        fi
        install -D -m 0755 /portcullis/setup.sh /docker-entrypoint-hooks.d/before-starting/50-portcullis.sh
        exec /entrypoint.sh "$$@"
      - sh
    command: ["apache2-foreground"]
    environment:
      # Local admin the image creates at install. setup.sh disables it (and
      # every other local account) at every start: there is no password
      # login; break-glass is occ on the server (manifest notes).
      NEXTCLOUD_ADMIN_USER: nc-breakglass
      # sqlite | mysql | postgres (manifest setting database); the
      # entrypoint above exports the chosen database's variables.
      NEXTCLOUD_DATABASE: ${NEXTCLOUD_DATABASE:-sqlite}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD must be set}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD must be set}
      NEXTCLOUD_TRUSTED_DOMAINS: ${PORTCULLIS_HOST_NEXTCLOUD:-cloud.portcullis.local}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${PORTCULLIS_HOST_NEXTCLOUD:-cloud.portcullis.local}
      # Only Traefik (static IP on portcullis-proxy, set by core) may supply
      # X-Forwarded-For.
      TRUSTED_PROXIES: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      # Read by setup.sh at every start (hostname, OIDC client, groups).
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      PORTCULLIS_HOST_NEXTCLOUD: ${PORTCULLIS_HOST_NEXTCLOUD:-cloud.portcullis.local}
      PORTCULLIS_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-nextcloud}
      PORTCULLIS_ACCESS_GROUP: ${PORTCULLIS_ACCESS_GROUP:-users_nextcloud}
      PORTCULLIS_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_nextcloud}
      NEXTCLOUD_OIDC_SECRET: ${NEXTCLOUD_OIDC_SECRET:?NEXTCLOUD_OIDC_SECRET must be set}
    volumes:
      - nextcloud-data:/var/www/html
      - ./templates/nextcloud/setup.sh:/portcullis/setup.sh:ro
      # The Hub's apply-settings hook (manifest hooks[]): occ from stdin JSON.
      - ./templates/nextcloud/apply-settings.php:/portcullis/apply-settings.php:ro
      - ./certs/ca-bundle.crt:/portcullis/ca-bundle.crt:ro
      # AI support: the mcp-mint / mcp-revoke hooks (manifest hooks).
      - ./templates/nextcloud/portcullis/mcp-token.php:/portcullis/mcp-token.php:ro
    networks:
      # nextcloud-mcp calls Nextcloud under a default-only name: the
      # service name is also an alias on portcullis-proxy, shared by every
      # instance (and nextcloud-mcp is on portcullis-proxy while AI
      # support is on).
      default:
        aliases: [nextcloud-internal]
      portcullis-proxy: {}
    labels:
      traefik.enable: "true"
      # Native OIDC (user_oidc): the host is not behind forward-auth, so sync
      # clients, WebDAV, OCS and share links work.
      traefik.http.routers.nextcloud.rule: Host(`${PORTCULLIS_HOST_NEXTCLOUD:-cloud.portcullis.local}`)
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.tls.options: authaware@file
      traefik.http.routers.nextcloud.middlewares: client-headers@file,security-headers@file
      traefik.http.services.nextcloud.loadbalancer.server.port: "80"
    restart: unless-stopped

  # AI support (manifest ai.mcp, contracts §3.2): the community Nextcloud
  # MCP server (github.com/cbcoutinho/nextcloud-mcp-server), in its
  # multi-user Basic pass-through mode: no Nextcloud credential of its own
  # (NEXTCLOUD_USERNAME / NEXTCLOUD_PASSWORD are refused in that mode), a
  # Nextcloud client per request from the caller's Authorization: Basic
  # header, checked against Nextcloud first. The Hub's override runs it
  # (scale 1) only while the companion is on, puts it on portcullis-proxy
  # under its alias and routes https://<host>/mcp to mcp-gate, which sends
  # "Basic <username>:<the person's own app password>" (minted by
  # portcullis/mcp-token.php). Only the apps a stock install serves:
  # Files (WebDAV), sharing, calendar (CalDAV) and contacts (CardDAV).
  # The server has no read-only switch: read-only mode is the gate's
  # (writes hidden and refused). No metrics listener, no semantic search,
  # no OAuth / Login Flow, no background sync.
  nextcloud-mcp:
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:0.205.3@sha256:c8b613f9f1c68db2997cbb2844a2d59839dab004b3f1714ef5fd81a43ee0b21a
    command: ["--port", "8000", "--transport", "streamable-http",
              "--enable-app", "webdav", "--enable-app", "sharing",
              "--enable-app", "calendar", "--enable-app", "contacts"]
    environment:
      MCP_DEPLOYMENT_MODE: multi_user_basic
      NEXTCLOUD_HOST: http://nextcloud-internal
      METRICS_ENABLED: "false"
      ENABLE_SEMANTIC_SEARCH: "false"
      ENABLE_OFFLINE_ACCESS: "false"
    read_only: true
    # Ephemeral token database (unused in this mode) and document spool.
    tmpfs:
      - /tmp
      - /app/data
      - /home/appuser
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [default]
    restart: unless-stopped

  nextcloud-cron:
    image: nextcloud:34.0.5-apache@sha256:515c072ea1cf82ece3503f301fdf75dd5a7148abcc8fa10aaefd5ec56643b703
    # Background jobs + admin group mapping (see cron.sh).
    user: www-data
    entrypoint: ["/bin/sh", "/portcullis/cron.sh"]
    environment:
      PORTCULLIS_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_nextcloud}
    volumes:
      - nextcloud-data:/var/www/html
      - ./templates/nextcloud/cron.sh:/portcullis/cron.sh:ro
    depends_on:
      - nextcloud
    restart: unless-stopped

  # The database servers of the setup choice "database" (manifest): each
  # runs only under its compose profile; SQLite needs none. Default network
  # only. Never bump their major versions (dump and restore instead).
  nextcloud-mariadb:
    image: mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    profiles: [db-mysql]
    user: "999:999"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    # Nextcloud's recommended isolation level for MySQL / MariaDB.
    command: ["--transaction-isolation=READ-COMMITTED"]
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD must be set}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - nextcloud-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  nextcloud-postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    profiles: [db-postgres]
    user: "70:70"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128mb
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD must be set}
      POSTGRES_DB: nextcloud
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - nextcloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  nextcloud-data: {}
  nextcloud-mariadb-data: {}
  nextcloud-postgres-data: {}

networks:
  portcullis-proxy:
    external: true
