name: NetBird
description: Mesh VPN + zero-trust networking with TURN relay
icon: "\U0001F426"
category: vpn
tags: [vpn, wireguard, mesh, zero-trust]
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: false
  group_admin: false
  access_group: users_netbird
  admin_group: admin_netbird
  notes: >
    Dashboard uses OIDC. Management API validates JWT audience. No group-based
    access restriction — all OIDC users can access dashboard. Identity:
    management keys users on the token's sub (AuthUserIDClaim; no IdP
    manager, so nothing is matched by email). The dashboard sends the ID token to the management API (NETBIRD_TOKEN_SOURCE=idToken): its audience is the client id management checks; Keycloak access tokens would carry aud "account".
    Upgrades: netbird-management and netbird-signal are pinned to the same
    release and must move together (the dashboard has its own version line);
    follow the upstream upgrade notes and do not skip releases with migrations.
    Instances: coturn runs with host networking (a TURN relay advertises its
    relay ports to peers, so they must be the host's own ports) and binds the
    STUN/TURN and TURNS ports and the UDP media relay range itself. All three
    are per-instance port settings; the defaults (3478, 5349, 49152-65535)
    are taken by the first instance, so the Hub's port collision check
    refuses to start another instance until it is given free ports and a
    range that doesn't overlap (e.g. 3479, 5350, 40000-40999).
    management.json is generated once (it holds NetBird's
    DataStoreEncryptionKey); a later hostname, STUN port or
    COTURN_EXTERNAL_IP change is applied to it in place on the next start.

ports:
  - key: COTURN_STUN_PORT
    label: STUN/TURN
    description: NAT traversal endpoint for NetBird peers
    container: 3478
    protocol: udp
    default: 3478
    required: true
    service: coturn
    network_mode_host: true
  - key: COTURN_TURNS_PORT
    label: TURNS (TLS)
    description: TLS-protected TURN relay
    container: 5349
    protocol: tcp
    default: 5349
    required: true
    service: coturn
    network_mode_host: true
  - key: COTURN_MEDIA_RANGE
    label: TURN media relays
    description: UDP port range used for relayed peer traffic
    protocol: udp
    range: "49152-65535"
    required: true
    service: coturn
    network_mode_host: true

env:
  - key: NETBIRD_OIDC_CLIENT_SECRET
    description: OIDC client secret for NetBird dashboard
    generate: random
  - key: COTURN_EXTERNAL_IP
    description: Public IP for TURN relay (required for NAT traversal)
    generate: none
    required: false
  - key: COTURN_AUTH_SECRET
    description: Shared secret for TURN authentication
    generate: random

keycloak_clients:
  - client_id: netbird-dashboard
    secret_env: NETBIRD_OIDC_CLIENT_SECRET
    redirect_uri: "https://{{HOST_NETBIRD_DASH}}/*"
    name: NetBird Dashboard

config_files: []

urls:
  - label: Dashboard
    url: "https://{{HOST_NETBIRD_DASH}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    # e2eadmin signs in first and becomes the owner (onboarding first).
    login: ["text=Skip to Dashboard"]
    signed_in:
      # The dashboard's own session: its ID token (oidc-client storage)
      # accepted by the management API.
      js: >-
        (async () => { const tok = (v) => v && typeof v === 'object' ? (v.id_token || v.idToken ||
        tok(v.tokens) || null) : null;
        for (const s of [sessionStorage, localStorage]) for (let i = 0; i < s.length; i++) {
        let v; try { v = JSON.parse(s.getItem(s.key(i))); } catch (e) { continue; }
        const t = tok(v); if (!t) continue;
        const r = await fetch('/api/users/current', {headers: {Authorization: 'Bearer ' + t}});
        return r.ok ? (await r.json()).email : 'HTTP ' + r.status; } return null; })()
      equals: "{email}"
      wait: 30
    # NetBird holds every later user in "pending approval" until the owner
    # approves them, so the outsider is refused by NetBird itself.
    expected_fail:
      member: "NetBird puts every user after the owner in pending approval until the owner approves them in the dashboard; the test doesn't approve e2emember (outsiders get the same pending state, nothing restricts them by group until the Hub's per-app Keycloak client access, Task 4b)"
