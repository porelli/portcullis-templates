# netbird-management and netbird-signal: keep on the same release (lockstep).
# netbird-dashboard is versioned separately.
services:
  coturn:
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    # Host networking: a TURN relay allocates its relay ports dynamically
    # from the media range and advertises them to peers as
    # <external IP>:<port>, so they must be the host's own ports (no NAT
    # remapping), and publishing a range of thousands of ports through
    # Docker is impractical. The listening ports and the relay range are
    # per-instance port settings (manifest ports:, network_mode_host): the
    # Hub's port collision check refuses a second instance until it uses
    # free ones.
    network_mode: host
    volumes:
      - coturn-data:/var/lib/coturn
    # $$VAR: expanded by the container shell from the environment below.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        range="$${COTURN_MEDIA_RANGE}"
        case "$$range" in
          [0-9]*-[0-9]*) ;;
          *) echo "COTURN_MEDIA_RANGE must be low-high, got '$$range'" >&2; exit 1 ;;
        esac
        case "$$range" in
          *[!0-9-]*|*-*-*) echo "COTURN_MEDIA_RANGE must be low-high, got '$$range'" >&2; exit 1 ;;
        esac
        exec docker-entrypoint.sh \
          --listening-port="$${COTURN_STUN_PORT}" \
          --tls-listening-port="$${COTURN_TURNS_PORT}" \
          --min-port="$${range%-*}" \
          --max-port="$${range#*-}" \
          --realm="$${PORTCULLIS_DOMAIN}" \
          --external-ip="$${COTURN_EXTERNAL_IP}" \
          --use-auth-secret \
          --static-auth-secret="$${COTURN_AUTH_SECRET}" \
          --no-cli \
          --fingerprint \
          --log-file=stdout
    environment:
      COTURN_STUN_PORT: ${COTURN_STUN_PORT:-3478}
      COTURN_TURNS_PORT: ${COTURN_TURNS_PORT:-5349}
      COTURN_MEDIA_RANGE: ${COTURN_MEDIA_RANGE:-49152-65535}
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP:-}
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET:?COTURN_AUTH_SECRET must be set}

  netbird-management:
    image: netbirdio/management:0.82.0@sha256:07c8f979fcc980678cc64e584cf6b7b27204ceb4c871531b29e2dce39592e9ff
    entrypoint: ["/bin/sh", "/etc/netbird/management-entrypoint.sh"]
    command: >
      --port 8011
      --log-level info
      --log-file console
      --disable-anonymous-metrics
      --single-account-mode-domain ${PORTCULLIS_DOMAIN:-portcullis.local}
    volumes:
      - netbird-mgmt:/var/lib/netbird
      - netbird-config:/etc/netbird
      - ./templates/netbird/management.json.tmpl:/etc/netbird/management.json.tmpl:ro
      - ./templates/netbird/management-entrypoint.sh:/etc/netbird/management-entrypoint.sh:ro
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      NETBIRD_HOST: ${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}
      NETBIRD_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-netbird-dashboard}
      COTURN_STUN_PORT: ${COTURN_STUN_PORT:-3478}
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP:-}
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET:?COTURN_AUTH_SECRET must be set}
      NETBIRD_OIDC_CLIENT_SECRET: ${NETBIRD_OIDC_CLIENT_SECRET:-}
    depends_on:
      - coturn
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.netbird-api.rule: Host(`${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}`) && PathPrefix(`/api`)
      traefik.http.routers.netbird-api.priority: "30"
      traefik.http.routers.netbird-api.entrypoints: websecure
      traefik.http.routers.netbird-api.tls.options: public@file
      traefik.http.routers.netbird-api.middlewares: security-headers@file
      traefik.http.routers.netbird-api.service: netbird-api
      traefik.http.services.netbird-api.loadbalancer.server.port: "8011"
      traefik.http.routers.netbird-mgmt.rule: Host(`${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}`) && PathPrefix(`/management.ManagementService/`)
      traefik.http.routers.netbird-mgmt.priority: "30"
      traefik.http.routers.netbird-mgmt.entrypoints: websecure
      traefik.http.routers.netbird-mgmt.tls.options: public@file
      traefik.http.routers.netbird-mgmt.middlewares: security-headers@file
      traefik.http.routers.netbird-mgmt.service: netbird-mgmt
      traefik.http.services.netbird-mgmt.loadbalancer.server.port: "8011"
      traefik.http.services.netbird-mgmt.loadbalancer.server.scheme: h2c
    restart: unless-stopped

  netbird-signal:
    image: netbirdio/signal:0.82.0@sha256:0c0c38bbef7dcdfa1822b6d59844615db55dc7303b664e7aed498151edc0dbfb
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.netbird-signal.rule: Host(`${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}`) && PathPrefix(`/signalexchange.SignalExchange/`)
      traefik.http.routers.netbird-signal.priority: "30"
      traefik.http.routers.netbird-signal.entrypoints: websecure
      traefik.http.routers.netbird-signal.tls.options: public@file
      traefik.http.routers.netbird-signal.middlewares: security-headers@file
      traefik.http.services.netbird-signal.loadbalancer.server.port: "10000"
      traefik.http.services.netbird-signal.loadbalancer.server.scheme: h2c
    restart: unless-stopped

  netbird-dashboard:
    image: netbirdio/dashboard:v2.96.0@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
    environment:
      NETBIRD_MGMT_API_ENDPOINT: https://${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}
      AUTH_AUTHORITY: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis
      AUTH_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-netbird-dashboard}
      AUTH_CLIENT_SECRET: ${NETBIRD_OIDC_CLIENT_SECRET:-}
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email
      AUTH_AUDIENCE: ${PORTCULLIS_OIDC_CLIENT_ID:-netbird-dashboard}
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.netbird-dash.rule: Host(`${PORTCULLIS_HOST_NETBIRD_DASH:-netbird.portcullis.local}`)
      traefik.http.routers.netbird-dash.priority: "10"
      traefik.http.routers.netbird-dash.entrypoints: websecure
      traefik.http.routers.netbird-dash.tls.options: public@file
      traefik.http.routers.netbird-dash.middlewares: client-headers@file,security-headers@file
      traefik.http.services.netbird-dash.loadbalancer.server.port: "80"
    restart: unless-stopped

volumes:
  coturn-data: {}
  netbird-mgmt: {}
  netbird-config: {}

networks:
  portcullis-proxy:
    external: true
