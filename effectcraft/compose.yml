# EffectCraft (https://github.com/storytold/effectcraft): a static Rust/WebAssembly
# site that runs entirely in the browser. effectcraft-fetch puts the pinned web
# release into the effectcraft-site volume; effectcraft serves it read-only.
services:
  # One-shot before every start: download effectcraft-web-<version>.zip, verify its
  # SHA-256 before unpacking, unpack next to the live copy and swap it in by
  # rename (fetch.sh). Any error exits non-zero, so effectcraft doesn't start.
  # Version bumps: CRAFT_VERSION and CRAFT_SHA256 together (from the
  # release's SHA256SUMS.txt); Dependabot can't track release zips.
  effectcraft-fetch:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: ["/bin/sh", "/craft-fetch.sh"]
    environment:
      CRAFT_APP: effectcraft
      CRAFT_REPO: storytold/effectcraft
      CRAFT_VERSION: ${CRAFT_VERSION:-0.20.0}
      CRAFT_SHA256: ${CRAFT_SHA256:-24189ed0dc8e9b5ed893dbd65b27f4f130ce5294b4a4f6b4cd506746f916c13e}
    volumes:
      - effectcraft-site:/srv/craft
      - ./templates/effectcraft/fetch.sh:/craft-fetch.sh:ro
    # Root without capabilities: owner of the fresh volume, nothing more.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 32
    networks:
      - default
    restart: "no"

  effectcraft:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    # Writes the allowlist (Traefik + loopback) nginx.conf includes, then
    # runs nginx; without a valid Traefik IP nothing starts.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$PORTCULLIS_TRAEFIK_IP" in
          ""|*[!0-9.]*) echo "PORTCULLIS_TRAEFIK_IP must be an IPv4 address" >&2; exit 1 ;;
        esac
        printf 'allow %s;\nallow 127.0.0.1;\ndeny all;\n' "$$PORTCULLIS_TRAEFIK_IP" > /tmp/portcullis-allow.conf
        exec nginx -g 'daemon off;'
    environment:
      PORTCULLIS_TRAEFIK_IP: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
    volumes:
      - effectcraft-site:/srv/craft:ro
      - ./templates/effectcraft/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    depends_on:
      effectcraft-fetch:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.effectcraft.rule: Host(`${PORTCULLIS_HOST_EFFECTCRAFT:-effectcraft.portcullis.local}`)
      traefik.http.routers.effectcraft.entrypoints: websecure
      traefik.http.routers.effectcraft.tls.options: authaware@file
      traefik.http.routers.effectcraft.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.effectcraft.loadbalancer.server.port: "8080"
    restart: unless-stopped

volumes:
  effectcraft-site: {}

networks:
  portcullis-proxy:
    external: true
