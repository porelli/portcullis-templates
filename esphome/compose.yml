services:
  # ESPHome Device Builder (the dashboard of ESPHome >= 2026.7; the image's
  # default command "dashboard /config" starts esphome-device-builder).
  # No dashboard password: forward-auth + group-gate in front of the whole
  # host is the sign-in, and only esphome-gate (Traefik's address only) can
  # reach it. Default network only, never host networking: with host
  # networking the dashboard (port 6052) would answer on every host address
  # past the gateway, and two instances would collide on it.
  esphome:
    image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
    security_opt: [no-new-privileges:true]
    environment:
      # WebSocket handshake: Host must be this instance's hostname
      # (DNS-rebinding defence upstream; Origin equals Host through Traefik).
      ESPHOME_TRUSTED_DOMAINS: ${PORTCULLIS_HOST_ESPHOME:-esphome.portcullis.local}
    volumes:
      # Device YAML, secrets.yaml, build output.
      - esphome-config:/config
      # PlatformIO / ESP-IDF toolchains (docker_entrypoint.sh uses /cache
      # when it exists), so they survive restarts and stay out of /config.
      - esphome-cache:/cache
    # Optional USB serial port for flashing from the server (setting
    # ESPHOME_SERIAL_DEVICE). Empty: /dev/null under an unused name.
    devices:
      - "${ESPHOME_SERIAL_DEVICE:-/dev/null}:${ESPHOME_SERIAL_DEVICE:-/dev/portcullis-unused-1}"
    networks:
      default:
        # Called by esphome-gate under a default-only name: a service name
        # on portcullis-proxy would be shared by every app (contracts §3).
        aliases: [esphome-internal]
    # The image's HEALTHCHECK (curl http://localhost:6052/version) applies.
    restart: unless-stopped

  # The only service on portcullis-proxy: answers Traefik's address alone
  # (every other container on portcullis-proxy gets 403) and passes
  # everything, websockets included (logs, compile, install), to the
  # dashboard.
  esphome-gate:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    security_opt: [no-new-privileges:true]
    # nginx's master needs only these (worker user, cache dirs); no NET_RAW.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    environment:
      PORTCULLIS_TRAEFIK_IP: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      GATE_UPSTREAM: http://esphome-internal:6052
      GATE_LISTEN: "6052"
    entrypoint: ["/bin/sh", "/portcullis/gate.sh"]
    volumes:
      - ./templates/esphome/gate.sh:/portcullis/gate.sh:ro
    depends_on:
      - esphome
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.esphome.rule: Host(`${PORTCULLIS_HOST_ESPHOME:-esphome.portcullis.local}`)
      traefik.http.routers.esphome.entrypoints: websecure
      traefik.http.routers.esphome.tls.options: authaware@file
      traefik.http.routers.esphome.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.esphome.service: esphome
      traefik.http.services.esphome.loadbalancer.server.port: "6052"
    restart: unless-stopped

volumes:
  esphome-config: {}
  esphome-cache: {}

networks:
  portcullis-proxy:
    external: true
