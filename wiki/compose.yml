services:
  wiki:
    image: requarks/wiki:2.5.317@sha256:e4708eed80c014449c0c8426c8d466c7a52a62131555bb44372fa48378b448b8
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WIKI_DB_PASSWORD:?WIKI_DB_PASSWORD must be set}
      DB_NAME: wiki
    depends_on:
      - wiki-db
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.wiki.rule: Host(`${PORTCULLIS_HOST_WIKI:-wiki.portcullis.local}`)
      traefik.http.routers.wiki.entrypoints: websecure
      traefik.http.routers.wiki.tls.options: authaware@file
      traefik.http.routers.wiki.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.wiki.loadbalancer.server.port: "3000"
    restart: unless-stopped

  wiki-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:?WIKI_DB_PASSWORD must be set}
    volumes:
      - wiki-db-data:/var/lib/postgresql/data

volumes:
  wiki-db-data: {}

networks:
  portcullis-proxy:
    external: true
