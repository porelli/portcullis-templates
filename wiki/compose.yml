services:
  wiki:
    image: requarks/wiki:2.5.317@sha256:e4708eed80c014449c0c8426c8d466c7a52a62131555bb44372fa48378b448b8
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WIKI_DB_PASSWORD:?WIKI_DB_PASSWORD must be set}
      DB_NAME: wiki
      # Keycloak may use the internal PKI.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.crt
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    depends_on:
      wiki-init:
        condition: service_completed_successfully
    # Healthy only when the "portcullis" OIDC strategy is enabled and the
    # local (password) strategy is not, i.e. after wiki-setup has finished.
    # The setup wizard, a fresh install and a re-enabled local login are
    # unhealthy, so Traefik serves 404 for the host.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          out=$$(wget -qO- --header='Content-Type: application/json'
          --post-data='{"query":"{authentication{activeStrategies(enabledOnly:true){key}}}"}'
          http://127.0.0.1:3000/graphql) &&
          echo "$$out" | grep -q '"key":"portcullis"' &&
          ! echo "$$out" | grep -q '"key":"local"'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      # Native OIDC: the host is not behind forward-auth (the API and the
      # wiki's own sessions work as usual). Traefik only routes healthy
      # containers, so this router exists only in the OIDC-only state (see
      # healthcheck): the setup wizard and the local login are never
      # reachable from the internet.
      traefik.http.routers.wiki.rule: Host(`${PORTCULLIS_HOST_WIKI:-wiki.portcullis.local}`)
      traefik.http.routers.wiki.entrypoints: websecure
      traefik.http.routers.wiki.tls.options: authaware@file
      traefik.http.routers.wiki.middlewares: client-headers@file,security-headers@file
      traefik.http.services.wiki.loadbalancer.server.port: "3000"
    restart: unless-stopped

  # Before Wiki.js boots, at every start (existing installs only; a fresh
  # database has no tables yet): the site URL follows the instance's
  # hostname (Wiki.js reads it at boot, also for the OIDC callback URL), and
  # the Guests group has no permissions, so nothing is readable anonymously
  # even for a moment.
  wiki-init:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until pg_isready -q -h wiki-db -U wiki -d wiki; do sleep 2; done
        if [ "$$(psql -h wiki-db -U wiki -d wiki -tAc "SELECT to_regclass('public.settings') IS NOT NULL AND to_regclass('public.groups') IS NOT NULL")" != t ]; then
          echo "wiki-init: fresh database, nothing to do"
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 -q -h wiki-db -U wiki -d wiki -v host="https://$${PORTCULLIS_HOST_WIKI}" <<'SQL'
        UPDATE settings SET value = json_build_object('v', :'host'::text), "updatedAt" = now()::text WHERE key = 'host';
        UPDATE groups SET permissions = '[]', "pageRules" = '[]', "updatedAt" = now()::text WHERE id = 2;
        SQL
        echo "wiki-init: site URL https://$${PORTCULLIS_HOST_WIKI}, guests locked out"
    environment:
      PGPASSWORD: ${WIKI_DB_PASSWORD:?WIKI_DB_PASSWORD must be set}
      PORTCULLIS_HOST_WIKI: ${PORTCULLIS_HOST_WIKI:-wiki.portcullis.local}
    depends_on:
      - wiki-db
    restart: "no"

  wiki-setup:
    image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    entrypoint: ["python3", "/setup.py"]
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      PORTCULLIS_HOST_WIKI: ${PORTCULLIS_HOST_WIKI:-wiki.portcullis.local}
      PORTCULLIS_OIDC_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-wiki}
      PORTCULLIS_ACCESS_GROUP: ${PORTCULLIS_ACCESS_GROUP:-users_wiki}
      PORTCULLIS_ADMIN_GROUP: ${PORTCULLIS_ADMIN_GROUP:-admin_wiki}
      WIKI_OIDC_SECRET: ${WIKI_OIDC_SECRET:?WIKI_OIDC_SECRET must be set}
      # Local admin created by the wizard (Wiki.js signs local users in by
      # email); its login is off once OIDC is configured (break-glass: notes).
      WIKI_ADMIN_EMAIL: admin@wiki.invalid
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD:?WIKI_ADMIN_PASSWORD must be set}
    volumes:
      - ./templates/wiki/setup.py:/setup.py:ro
      # The sidecar's own Wiki.js API key (it can't log in once the local
      # strategy is off).
      - wiki-setup-data:/state
    depends_on:
      - wiki
    restart: "no"

  wiki-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:?WIKI_DB_PASSWORD must be set}
    volumes:
      - wiki-db-data:/var/lib/postgresql/data

volumes:
  wiki-db-data: {}
  wiki-setup-data: {}

networks:
  portcullis-proxy:
    external: true
