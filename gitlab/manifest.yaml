name: GitLab
description: Complete DevOps platform — Git, CI/CD, container registry, issue tracking
icon: "\U0001F98A"
category: devops
tags: [git, ci-cd, devops, registry, issues]

auth:
  method: native-oidc
  sso: true
  group_access: true
  group_admin: false
  access_group: users_gitlab
  admin_group: admin_gitlab
  notes: >
    Full OIDC with Keycloak. git-over-HTTPS, the API, the registry and CI
    runners are not behind forward-auth and work with personal access tokens.
    The sign-in, sign-up and OIDC paths (/users/...) are behind forward-auth +
    group-gate, so only members of users_gitlab can log in or have an account
    auto-created (GitLab CE has no OIDC group restriction; required_groups and
    admin_groups are Premium/Ultimate only). Existing GitLab sessions survive
    removal from the group until they expire; block the user in GitLab to cut
    access immediately. Admin rights are granted in GitLab (root account uses
    GITLAB_ROOT_PASSWORD); admin_gitlab is not mapped.
    Identity: OIDC identities are keyed on preferred_username (uid_field, the
    immutable LLDAP username) and omniauth_auto_link_user is false, so an
    email match never attaches an OIDC login to an existing GitLab account
    (GitLab instead asks for that account's password). The email is not
    synced from Keycloak after the account is created.
    Upgrades: the image is pinned; GitLab must be upgraded along its documented
    upgrade path (required stops between versions), never by jumping straight
    to the newest release.

env:
  - key: GITLAB_ROOT_PASSWORD
    description: GitLab root password
    generate: random
  - key: GITLAB_OIDC_SECRET
    description: GitLab OIDC client secret
    generate: random

keycloak_clients:
  - client_id: gitlab
    secret_env: GITLAB_OIDC_SECRET
    redirect_uri: "https://git.{{DOMAIN}}/users/auth/openid_connect/callback"
    name: GitLab

config_files: []

urls:
  - label: GitLab
    url: "https://git.{{DOMAIN}}"
