name: GitLab
description: Complete DevOps platform — Git, CI/CD, container registry, issue tracking
icon: "\U0001F98A"
category: devops
tags: [git, ci-cd, devops, registry, issues]

auth:
  method: native-oidc
  sso: true
  group_access: false
  group_admin: false
  access_group: users_gitlab
  admin_group: admin_gitlab
  notes: >
    Full OIDC with Keycloak. No forward-auth in front of GitLab so
    git-over-HTTPS, the API and CI runners work with personal access tokens.
    Any realm user can sign in (accounts auto-created); group restriction and
    role mapping via OIDC claims not yet configured.
    Upgrades: the image is pinned; GitLab must be upgraded along its documented
    upgrade path (required stops between versions), never by jumping straight
    to the newest release.

env:
  - key: GITLAB_ROOT_PASSWORD
    description: GitLab root password
    generate: random
  - key: GITLAB_OIDC_SECRET
    description: GitLab OIDC client secret
    generate: random

keycloak_clients:
  - client_id: gitlab
    secret_env: GITLAB_OIDC_SECRET
    redirect_uri: "https://git.{{DOMAIN}}/users/auth/openid_connect/callback"
    name: GitLab

config_files: []

urls:
  - label: GitLab
    url: "https://git.{{DOMAIN}}"
