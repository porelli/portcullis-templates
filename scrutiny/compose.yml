services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    # Not privileged: only the disks listed in this instance's settings
    # (SCRUTINY_DISK_1..8) are passed in, read-only in the device cgroup
    # (smartctl opens them O_RDONLY; SMART passthrough is gated by the
    # capabilities below, not by the write bit). An empty slot maps
    # /dev/null to an unused name, which smartctl --scan ignores.
    devices:
      - "${SCRUTINY_DISK_1:-/dev/null}:${SCRUTINY_DISK_1:-/dev/portcullis-unused-1}:r"
      - "${SCRUTINY_DISK_2:-/dev/null}:${SCRUTINY_DISK_2:-/dev/portcullis-unused-2}:r"
      - "${SCRUTINY_DISK_3:-/dev/null}:${SCRUTINY_DISK_3:-/dev/portcullis-unused-3}:r"
      - "${SCRUTINY_DISK_4:-/dev/null}:${SCRUTINY_DISK_4:-/dev/portcullis-unused-4}:r"
      - "${SCRUTINY_DISK_5:-/dev/null}:${SCRUTINY_DISK_5:-/dev/portcullis-unused-5}:r"
      - "${SCRUTINY_DISK_6:-/dev/null}:${SCRUTINY_DISK_6:-/dev/portcullis-unused-6}:r"
      - "${SCRUTINY_DISK_7:-/dev/null}:${SCRUTINY_DISK_7:-/dev/portcullis-unused-7}:r"
      - "${SCRUTINY_DISK_8:-/dev/null}:${SCRUTINY_DISK_8:-/dev/portcullis-unused-8}:r"
    # SYS_RAWIO: ATA/SCSI passthrough (SG_IO) for SATA/SAS disks.
    # SCRUTINY_NVME_CAPABILITY: SYS_ADMIN only if NVMe disks are listed (the
    # kernel's NVMe admin passthrough, used for SMART logs, requires it);
    # the default repeats SYS_RAWIO, i.e. adds nothing.
    cap_add:
      - SYS_RAWIO
      - ${SCRUTINY_NVME_CAPABILITY:-SYS_RAWIO}
    volumes:
      - scrutiny-config:/opt/scrutiny/config
      - scrutiny-db:/opt/scrutiny/influxdb
      # udev metadata (serial, WWN) for the listed disks; read-only.
      - /run/udev:/run/udev:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.scrutiny.rule: Host(`${PORTCULLIS_HOST_SCRUTINY:-disks.portcullis.local}`)
      traefik.http.routers.scrutiny.entrypoints: websecure
      traefik.http.routers.scrutiny.tls.options: authaware@file
      traefik.http.routers.scrutiny.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.scrutiny.loadbalancer.server.port: "8080"
    restart: unless-stopped

volumes:
  scrutiny-config: {}
  scrutiny-db: {}

networks:
  portcullis-proxy:
    external: true
