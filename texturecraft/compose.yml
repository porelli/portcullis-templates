# TextureCraft (https://github.com/storytold/texturecraft): a static Rust/WebAssembly
# site that runs entirely in the browser. texturecraft-fetch puts the pinned web
# release into the texturecraft-site volume; texturecraft serves it read-only.
services:
  # One-shot before every start: download texturecraft-web-<version>.zip, verify its
  # SHA-256 before unpacking, unpack next to the live copy and swap it in by
  # rename (fetch.sh). Any error exits non-zero, so texturecraft doesn't start.
  # Version bumps: CRAFT_VERSION and CRAFT_SHA256 together (from the
  # release's SHA256SUMS.txt); Dependabot can't track release zips.
  texturecraft-fetch:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: ["/bin/sh", "/craft-fetch.sh"]
    environment:
      CRAFT_APP: texturecraft
      CRAFT_REPO: storytold/texturecraft
      CRAFT_VERSION: ${CRAFT_VERSION:-0.2.0}
      CRAFT_SHA256: ${CRAFT_SHA256:-77866fb28e658709b08ab72e8b427d598b0f1e36bd86d3b35d996b16e7220f84}
    volumes:
      - texturecraft-site:/srv/craft
      - ./templates/texturecraft/fetch.sh:/craft-fetch.sh:ro
    # Root without capabilities: owner of the fresh volume, nothing more.
    # A non-zero gid (nginx-unprivileged's group (the site files are 0644/0755)): Kubernetes refuses root's group 0.
    user: "0:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 32
    networks:
      - default
    restart: "no"

  texturecraft:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    # Writes the allowlist (Traefik's range + loopback) nginx.conf includes,
    # then runs nginx; without a valid PORTCULLIS_TRAEFIK_SOURCE nothing starts.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cidr_ok() {
          case "$$1" in *[!0-9./]* | */*/* | .* | *./* | *..*) return 1 ;; */*) ;; *) return 1 ;; esac
          set -- "$${1%/*}" "$${1#*/}"
          case "$$2" in [0-9] | [12][0-9] | 3[0-2]) ;; *) return 1 ;; esac
          _cn=$$2 _cv=0 _ck=0 _cifs=$$IFS
          IFS=.
          for _co in $$1; do
            case "$$_co" in [0-9] | [1-9][0-9] | 1[0-9][0-9] | 2[0-4][0-9] | 25[0-5]) ;; *) IFS=$$_cifs; return 1 ;; esac
            _cv=$$((_cv * 256 + _co)) _ck=$$((_ck + 1))
          done
          IFS=$$_cifs
          [ "$$_ck" -eq 4 ] && [ $$((_cv % (1 << (32 - _cn)))) -eq 0 ]
        }
        cidr_ok "$$PORTCULLIS_TRAEFIK_SOURCE" || { echo "PORTCULLIS_TRAEFIK_SOURCE must be an IPv4 CIDR a.b.c.d/n" >&2; exit 1; }
        printf 'allow %s;\nallow 127.0.0.1;\ndeny all;\n' "$$PORTCULLIS_TRAEFIK_SOURCE" > /tmp/portcullis-allow.conf
        exec nginx -g 'daemon off;'
    environment:
      PORTCULLIS_TRAEFIK_SOURCE: ${PORTCULLIS_TRAEFIK_SOURCE:-172.31.250.2/32}
    volumes:
      - texturecraft-site:/srv/craft:ro
      - ./templates/texturecraft/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    depends_on:
      texturecraft-fetch:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.texturecraft.rule: Host(`${PORTCULLIS_HOST_TEXTURECRAFT:-texturecraft.portcullis.local}`)
      traefik.http.routers.texturecraft.entrypoints: websecure
      traefik.http.routers.texturecraft.tls.options: authaware@file
      traefik.http.routers.texturecraft.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.texturecraft.loadbalancer.server.port: "8080"
    restart: unless-stopped

volumes:
  texturecraft-site: {}

networks:
  portcullis-proxy:
    external: true
