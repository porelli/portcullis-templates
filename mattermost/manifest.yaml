# yaml-language-server: $schema=../schema/manifest.schema.json
name: Mattermost
description: Team chat with channels, threads, file sharing and integrations (Team Edition)
icon: "\U0001F4AC"
category: productivity
tags: [chat, messaging, team, collaboration, slack-alternative]
instances: multi

auth:
  method: forward-auth
  sso: false
  group_access: true
  group_admin: false
  access_group: users_mattermost
  notes: >
    Mattermost Team Edition 12.0 has no SSO that works with Portcullis:
    OpenID Connect (and Google / Entra ID / SAML / LDAP) need a paid
    license, and the free GitLab SSO provider reads a GitLab user API
    (numeric "id", "username"), which Keycloak's userinfo doesn't serve
    (the Hub creates clients without custom mappers, and LLDAP users have
    no numeric id) and which can't restrict sign-in to a group. So the
    whole host is behind Portcullis sign-in + group-gate (users_mattermost)
    and Mattermost keeps its own accounts behind it. Self sign-up is off
    (no email sign-up, which also closes the first-account and invite-link
    sign-ups; no open server; locked in the System Console). Team Edition's
    System Console can't create accounts; an admin creates them with
    mmctl in local mode, in the container (Hub exec or the server shell):
    `mmctl --local user create --username <LLDAP username> --email <email>
    --password <random placeholder>`, then `mmctl --local user
    change-password <username>`, which prompts for the real initial
    password on stdin (mmctl only takes the create password as an argument,
    so use a throwaway there), hands that password over out of band, and
    the user changes it after signing in. Local mode answers anyone who can
    run a process in the Mattermost container with full system-admin rights
    (no authentication); Hub exec into that container is admin access.
    Give each account the person's LLDAP username, since Mattermost doesn't
    know who passed the gateway. No admin group: Mattermost can't map one
    (no SSO), so admins are made in Mattermost (by a system admin, e.g.
    mmctl --local roles system-admin <username>). The bootstrap system admin
    is mmadmin-<first 12 characters of MATTERMOST_ADMIN_SUFFIX> with the
    generated password MATTERMOST_ADMIN_PASSWORD, created once by the
    mattermost-init one-shot over the local-mode socket and pinned by its
    user ID in the data volume: system_admin is granted only to the account
    that run created, never to an account found by name. If the bootstrap
    name later belongs to a different account (renamed and taken) or exists
    without the pinned ID, mattermost-init fails (the Hub reports the failed
    one-shot) and grants nothing; Mattermost itself keeps running (its
    image has no shell, so its healthcheck can't read the state file), and
    the account holding the name stays a plain user. Change the bootstrap
    password after the first sign-in. Team Edition can't lock usernames
    (LockProfileFieldsForEmailUsers is Enterprise-only), so users can
    rename themselves; Mattermost usernames are not an identity
    Portcullis vouches for. GitLab SSO, personal access tokens and the
    plugin marketplace are off, and so are plugin uploads (server-side code
    from any system-admin session). Plugins: a pinned list (plugins.py,
    each a GitHub release asset checked against its SHA-256): freemium
    2.0.0 (dy0gu/mattermost-plugin-freemium, hides Team Edition's upsell
    UI) and Matterpoll 1.9.2 (/poll). Mattermost requires plugin
    signatures, and upstream doesn't sign these, so before every start the
    mattermost-plugins one-shot checks a private copy of each bundle (in
    its root-only tmpfs; file-store copies are opened without following
    symlinks, regular files only) against its SHA-256 (a mismatch or a
    swapped file fails it before anything is signed, and Mattermost
    doesn't start), signs that private copy with an
    OpenPGP key it generates in tmpfs for that start only (the private key
    never reaches a volume), writes bundle + signature into Mattermost's
    file store (locked to the data volume) and only the public key to a
    volume Mattermost mounts read-only (SignaturePublicKeyFiles).
    Mattermost installs from the file store at startup, so any other
    bundle, unsigned or signed by another key, is refused; Mattermost-signed
    bundles still verify with its built-in key. mattermost-init enables the
    pinned plugins. Bump a plugin by editing its version, URL and SHA-256 in
    plugins.py (Dependabot doesn't see them). SSO, re-checked: the free
    GitLab provider can't use Keycloak today. Team Edition switches to the
    licensed OpenID provider whenever the GitLab scope contains "openid",
    while Keycloak's userinfo refuses tokens without the openid scope
    ("Missing openid scope"), and the provider needs a stable numeric "id"
    that no static Keycloak mapper can derive (LLDAP has no numeric
    attribute, Keycloak ids are UUIDs). It becomes possible once the Hub
    allocates a per-person numeric id (a user attribute mapped to "id"),
    plus mappers for username, which the Hub doesn't create yet. What doesn't work through the gateway: the Mattermost
    desktop and mobile apps and anything else that talks to the API
    directly (bots, incoming/outgoing webhooks, slash-command callbacks,
    personal or bot access tokens), because every request needs a
    Portcullis browser session first; use the web app. Mattermost takes the
    client address (logs, rate limits) from X-Real-Ip, which Traefik
    overwrites. Upgrades: follow
    Mattermost's upgrade path (extended support releases, one major at a
    time); don't bump the PostgreSQL major.

env:
  - key: MATTERMOST_DB_PASSWORD
    description: Mattermost database password
    generate: random
  - key: MATTERMOST_ADMIN_SUFFIX
    description: Random suffix of the bootstrap system admin's username (mmadmin-<first 12 characters>)
    generate: random
  - key: MATTERMOST_ADMIN_PASSWORD
    description: Password of the bootstrap system admin
    generate: random

config_files: []

urls:
  - label: Chat
    url: "https://{{HOST_MATTERMOST}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /login
    # Past the gateway the browser reaches Mattermost's own login page; no
    # identity reaches Mattermost (no SSO in Team Edition).
    signed_in:
      html: "<title>Mattermost</title>"
      wait: 30
    password: "Mattermost keeps its own account login behind the gateway (Team Edition has no usable SSO, see auth.notes)"
    boot_timeout: 900
