# yaml-language-server: $schema=../schema/manifest.schema.json
name: Mattermost
description: Team chat with channels, threads, file sharing and integrations (Team Edition)
icon: "\U0001F4AC"
category: productivity
tags: [chat, messaging, team, collaboration, slack-alternative]
instances: multi

auth:
  method: forward-auth
  sso: false
  group_access: true
  group_admin: false
  access_group: users_mattermost
  admin_group: admin_mattermost
  notes: >
    Mattermost Team Edition 12.0 has no SSO that works with Portcullis:
    OpenID Connect (and Google / Entra ID / SAML / LDAP) need a paid
    license, and the free GitLab SSO provider reads a GitLab user API
    (numeric "id", "username"), which Keycloak's userinfo doesn't serve
    (the Hub creates clients without custom mappers, and LLDAP users have
    no numeric id) and which can't restrict sign-in to a group. So the
    whole host is behind Portcullis sign-in + group-gate (users_mattermost)
    and Mattermost keeps its own accounts behind it. Self sign-up is off
    (no email sign-up, no open server, no invite-link sign-up; locked in
    the System Console): accounts are created by a system admin (System
    Console > Users, or mmctl --local user create inside the container).
    Give each account the person's LLDAP username, since Mattermost doesn't
    know who passed the gateway. The bootstrap system admin is
    mmadmin-<first 12 characters of MATTERMOST_ADMIN_SUFFIX> with the
    generated password MATTERMOST_ADMIN_PASSWORD, created once by the
    mattermost-init one-shot over the local-mode socket and pinned by its
    user ID in the data volume: system_admin is never granted to an account
    found by name, and if the bootstrap name later maps to another account
    the one-shot fails and the app doesn't start until that is resolved.
    Change its password after the first sign-in. Team Edition can't lock
    usernames (LockProfileFieldsForEmailUsers is Enterprise-only), so users
    can rename themselves; Mattermost usernames are not an identity
    Portcullis vouches for. GitLab SSO, personal access tokens and plugin
    uploads are off. What doesn't work through the gateway: the Mattermost
    desktop and mobile apps and anything else that talks to the API
    directly (bots, incoming/outgoing webhooks, slash-command callbacks,
    personal or bot access tokens), because every request needs a
    Portcullis browser session first; use the web app. Mattermost takes the
    client address (logs, rate limits) from X-Real-Ip, which Traefik
    overwrites. Upgrades: follow
    Mattermost's upgrade path (extended support releases, one major at a
    time); don't bump the PostgreSQL major.

env:
  - key: MATTERMOST_DB_PASSWORD
    description: Mattermost database password
    generate: random
  - key: MATTERMOST_ADMIN_SUFFIX
    description: Random suffix of the bootstrap system admin's username (mmadmin-<first 12 characters>)
    generate: random
  - key: MATTERMOST_ADMIN_PASSWORD
    description: Password of the bootstrap system admin
    generate: random

config_files: []

urls:
  - label: Chat
    url: "https://{{HOST_MATTERMOST}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /login
    # Past the gateway the browser reaches Mattermost's own login page; no
    # identity reaches Mattermost (no SSO in Team Edition).
    signed_in:
      html: "<title>Mattermost</title>"
      wait: 30
    password: "Mattermost keeps its own account login behind the gateway (Team Edition has no usable SSO, see auth.notes)"
    boot_timeout: 900
