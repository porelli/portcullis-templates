services:
  vault-ui:
    image: drakkan/sftpgo:v2.7.6@sha256:1edd28d80de2a008863fbfc58c8ff7db47b1b410bae48d4e6076192337809b11  # placeholder — replace with actual app
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.vault-ui.rule: Host(`${PORTCULLIS_HOST_VAULT_UI:-vault.portcullis.local}`)
      traefik.http.routers.vault-ui.entrypoints: websecure
      traefik.http.routers.vault-ui.tls.options: protected@file
      traefik.http.routers.vault-ui.middlewares: client-headers@file,security-headers@file
      traefik.http.services.vault-ui.loadbalancer.server.port: "8080"
    restart: unless-stopped

networks:
  portcullis-proxy:
    external: true
