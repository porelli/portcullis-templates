name: Vault UI
description: "PLACEHOLDER / EXPERIMENTAL: mTLS-only (protected tier) demo route; currently runs SFTPGo, not a Vault UI"
icon: "\U0001F512"
category: security
tags: [vault, secrets, pki]
instances: multi

auth:
  method: mtls
  sso: false
  group_access: false
  group_admin: false
  notes: mTLS only (protected TLS tier). Requires PIV client certificate. No SSO or group integration — access controlled at the TLS layer.

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Vault UI
    url: "https://{{HOST_VAULT_UI}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    skip: "mtls: no Portcullis sign-in (TLS client-certificate tier, then Vault's own token login); core's e2e covers the mtls tier"
