name: Apache Guacamole
description: Clientless remote desktop gateway — RDP, SSH, VNC in the browser
icon: "\U0001F5A5"
category: remote-access
tags: [rdp, ssh, vnc, remote-desktop, browser]
links:
  website: https://guacamole.apache.org/
  source: https://github.com/apache/guacamole-client
instances: multi

auth:
  method: header-auth
  sso: true
  group_access: true
  group_admin: false
  access_group: users_guacamole
  admin_group: admin_guacamole
  notes: >
    Forward-auth + group-gate, then Guacamole's header extension trusts
    X-Forwarded-User, the immutable LLDAP username (never the user-editable
    email); accounts are auto-created with no permissions. The extension has no proxy allowlist, so a Tomcat
    RewriteValve rejects (403) any request carrying X-Forwarded-User that
    does not come from Traefik (PORTCULLIS_TRAEFIK_IP). On first boot the
    built-in guacadmin account gets a random password (GUACAMOLE_ADMIN_PASSWORD)
    and a per-instance, non-guessable name, guacadmin-<GUACAMOLE_ADMIN_SUFFIX>
    (both generated; break-glass only). The header extension logs a user in as
    the account named like X-Forwarded-User, so the same valve refuses (403)
    any X-Forwarded-User starting with "guacadmin" (case-insensitive): no LLDAP
    user can become the local administrator (also on databases initialized
    before the suffix, where the account is still called guacadmin). Set the
    Administrator setting before first enable to make that LLDAP user (by
    username, not email; not guacadmin*) the administrator instead. Accounts
    created when the header carried the email
    are named after it; rename them in the Guacamole UI. Connection
    permissions are managed in the Guacamole UI. Changing either value after
    the database is initialized has no effect.
    Upgrades: guacamole, guacamole-init and guacd are pinned to the same
    release and must move together; apply the upstream database schema
    upgrade scripts for each release in between before starting the new one.

settings:
  options:
    - key: admin_user
      label: Administrator
      description: >
        The LLDAP user (username as sent in X-Forwarded-User, not the email)
        that becomes the Guacamole administrator. Applied only on first
        database initialization. Leave empty to keep a local
        guacadmin-<generated suffix> account with a random password. Must not
        start with guacadmin.
      type: user
      applies: restart
      delivery: [{env: GUACAMOLE_ADMIN_USER}]

env:
  - key: GUACAMOLE_DB_PASSWORD
    description: Guacamole database password
    generate: random
  - key: GUACAMOLE_ADMIN_PASSWORD
    description: Password for the built-in Guacamole administrator (replaces the default guacadmin/guacadmin)
    generate: random
  - key: GUACAMOLE_ADMIN_SUFFIX
    description: Generated suffix of the built-in administrator's name (guacadmin-<suffix>), so no LLDAP user can match it
    generate: random

keycloak_clients: []

config_files: []

urls:
  - label: Remote Desktop
    url: "https://{{HOST_GUACAMOLE}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    # The local administrator's name is reserved: a header login as
    # guacadmin-<anything> must be refused by the RewriteValve.
    refused_users: [guacadmin-x]
    signed_in:
      text: "{username}"
      wait: 20
