name: Apache Guacamole
description: Clientless remote desktop gateway — RDP, SSH, VNC in the browser
icon: "\U0001F5A5"
category: remote-access
tags: [rdp, ssh, vnc, remote-desktop, browser]
instances: multi

auth:
  method: header-auth
  sso: true
  group_access: true
  group_admin: false
  access_group: users_guacamole
  admin_group: admin_guacamole
  notes: >
    Forward-auth + group-gate, then Guacamole's header extension trusts
    X-Forwarded-User, the immutable LLDAP username (never the user-editable
    email); accounts are auto-created with no permissions. The extension has no proxy allowlist, so a Tomcat
    RewriteValve rejects (403) any request carrying X-Forwarded-User that
    does not come from Traefik (PORTCULLIS_TRAEFIK_IP). The built-in guacadmin account gets a random password
    (GUACAMOLE_ADMIN_PASSWORD) on first boot; set GUACAMOLE_ADMIN_USER before
    first enable to make that LLDAP user (by username, not email) the
    administrator instead. Accounts created when the header carried the email
    are named after it; rename them in the Guacamole UI. Connection
    permissions are managed in the Guacamole UI. Changing either value after
    the database is initialized has no effect.
    Upgrades: guacamole, guacamole-init and guacd are pinned to the same
    release and must move together; apply the upstream database schema
    upgrade scripts for each release in between before starting the new one.

settings:
  - key: GUACAMOLE_ADMIN_USER
    label: Administrator LLDAP username
    description: >
      LLDAP username (as sent in X-Forwarded-User; not the email) that becomes
      the Guacamole administrator. Applied only on first database initialization. Leave empty
      to keep a local guacadmin account with a random password.
    type: text

env:
  - key: GUACAMOLE_DB_PASSWORD
    description: Guacamole database password
    generate: random
  - key: GUACAMOLE_ADMIN_PASSWORD
    description: Password for the built-in Guacamole administrator (replaces the default guacadmin/guacadmin)
    generate: random

keycloak_clients: []

config_files: []

urls:
  - label: Remote Desktop
    url: "https://{{HOST_GUACAMOLE}}"
