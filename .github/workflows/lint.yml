name: Lint

# Static checks only: no secrets, no core checkout, read-only token. Safe for
# pull requests from forks, so every contributor gets this feedback.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      # Manifest JSON Schema + repo rules (networks, volumes, middlewares,
      # required vars, mounts, image pinning, header trust, ...).
      - name: Validate templates
        run: python tests/validate.py

      # validate.py's own rules (contract v2: hostname variables, instances).
      - name: Validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Runtime compatibility vectors (rootless Podman and Kubernetes) must
      # match the Hub's copy (shared contract §11.10). Fetch from the
      # same-named branch if it exists, else main.
      - name: Runtime vectors match the Hub
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads https://github.com/porelli/portcullis-hub.git "refs/heads/$REF" >/dev/null 2>&1; then
            hub_ref="$REF"
          else
            hub_ref="main"
          fi
          echo "Checking runtime_vectors.json against portcullis-hub branch: $hub_ref"
          curl -fsSL "https://raw.githubusercontent.com/porelli/portcullis-hub/$hub_ref/internal/templates/testdata/runtime_vectors.json" -o /tmp/hub_runtime_vectors.json
          cmp tests/runtime_vectors.json /tmp/hub_runtime_vectors.json

      # VPN vectors (the vpn: block refusals) must match the Hub's copy
      # (shared contract §3.3). Same-named branch if it exists, else main.
      - name: VPN vectors match the Hub
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads https://github.com/porelli/portcullis-hub.git "refs/heads/$REF" >/dev/null 2>&1; then
            hub_ref="$REF"
          else
            hub_ref="main"
          fi
          echo "Checking vpn_vectors.json against portcullis-hub branch: $hub_ref"
          curl -fsSL "https://raw.githubusercontent.com/porelli/portcullis-hub/$hub_ref/internal/templates/testdata/vpn_vectors.json" -o /tmp/hub_vpn_vectors.json
          cmp tests/vpn_vectors.json /tmp/hub_vpn_vectors.json

      # headscale/vpn/glue.py against a fake Headscale REST API (stdlib).
      - name: headscale VPN glue unit tests
        run: python -m unittest discover -s tests/vpn -p 'test_*.py'

      - name: docker compose config
        run: bash tests/compose-config.sh

      - name: shellcheck
        run: |
          shopt -s nullglob
          shellcheck --version
          shellcheck -S warning tests/apps/*.sh ./*/*.sh ./*/portcullis/*.sh .github/automerge/*.sh tests/sync/*.sh tests/trust/*.sh ./*/bin/* ./*/vpn/*.sh

      # portcullis-sync (the file-sharing templates' converge script) with
      # stubbed Samba / account tools: no root, no Docker.
      - name: portcullis-sync unit tests
        run: bash tests/sync/test_portcullis_sync.sh

      # grafana's trust.sh (Traefik's CIDR + the AI trust network allowlist)
      # with a stubbed ip.
      - name: grafana trust.sh unit tests
        run: bash tests/trust/test_grafana_trust.sh

      # Dependabot auto-merge decisions (fake gh + fixtures, no network).
      - name: auto-merge tests
        run: bash .github/automerge/test.sh

      # The actionlint image bundles shellcheck for run: blocks.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
