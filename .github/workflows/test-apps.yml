name: Test Apps

# Integration tests: boot core infra (Keycloak, LLDAP, Traefik, Vault, ...)
# and each changed template. Core (porelli/portcullis) is public and cloned
# anonymously, so the full integration tests also run for pull requests
# from forks. No job references a secret. Static checks live in lint.yml.
#
# Trust boundary: template / PR code only runs in the `test` job. Core is
# cloned in `fetch-core` (which checks out nothing from the PR; for PR runs
# .core-ref is read from the PR's base commit, so a PR can't choose the core
# version it is tested against) and handed over as an artifact verified by
# digest. Image caches are written only by `fetch-core` (infra) and
# `app-images` (per-app, push to main only), which run no template code;
# `test` treats every cached tarball as untrusted: it drops any name a
# tarball sets and binds every image ref by a registry pull of the pinned
# digest, which only reuses loaded content whose image ID matches.
#
# Never switch this to pull_request_target: it would run fork code with
# secrets and a write token.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to re-test (default: the selected branch)"
        required: false
        type: string
      ref:
        description: "Branch, tag or commit of this repo to test (ignored when pr is set; default: the selected branch)"
        required: false
        type: string
      apps:
        description: "Space-separated app ids to test, or 'all' (default: apps changed by the PR, or all apps). Each app runs its shell test, then its sign-in e2e"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-apps-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

# Core secrets are NOT set here: the shell environment wins over core's .env
# (in the CLI and in docker compose), so fixed values would override what
# `portcullis init --env-only` generates. The test job exports the generated
# credentials tests/lib.sh needs.
env:
  PORTCULLIS_DOMAIN: portcullis.local

jobs:
  # ── Decide whether this run may use secrets, and what to test ──
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      checkout_ref: ${{ steps.gate.outputs.checkout_ref }}
      expect_sha: ${{ steps.gate.outputs.expect_sha }}
      base: ${{ steps.gate.outputs.base }}
      trusted_ref: ${{ steps.gate.outputs.trusted_ref }}
    steps:
      - name: Check secrets availability and resolve target
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_REF: ${{ inputs.ref }}
        run: |

          # checkout_ref: code under test. trusted_ref: where .core-ref is
          # read from ("" = the event's default ref).
          checkout_ref="" expect_sha="" base="" trusted_ref=""
          case "$EVENT" in
            # Forks included: no secrets are involved. .core-ref comes from the
            # PR's base, never from the PR itself.
            pull_request) base="$PR_BASE_SHA"; trusted_ref="$PR_BASE_SHA"; [ "$HEAD_REPO" = "$REPO" ] || echo "Fork PR #$PR_NUMBER from $HEAD_REPO" >> "$GITHUB_STEP_SUMMARY" ;;
            push) base="$BEFORE"; trusted_ref="$SHA" ;;
            workflow_dispatch)
              if [ -n "$INPUT_PR" ]; then
                [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
                pr_json=$(gh api "repos/$REPO/pulls/$INPUT_PR")
                [ "$(jq -r .base.repo.full_name <<< "$pr_json")" = "$REPO" ] || { echo "::error::PR #$INPUT_PR does not target $REPO"; exit 1; }
                checkout_ref="refs/pull/$INPUT_PR/head"
                expect_sha=$(jq -r .head.sha <<< "$pr_json")
                base=$(jq -r .base.sha <<< "$pr_json")
                trusted_ref="$base"   # never take .core-ref from the PR itself
                echo "Testing PR #$INPUT_PR at $expect_sha (from $(jq -r .head.repo.full_name <<< "$pr_json")); core ref from base $base" | tee -a "$GITHUB_STEP_SUMMARY"
              elif [ -n "$INPUT_REF" ]; then
                [[ "$INPUT_REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$INPUT_REF" != *..* ]] || { echo "::error::invalid ref"; exit 1; }
                checkout_ref="$INPUT_REF"
                trusted_ref="$INPUT_REF"
              fi
              ;;
          esac
          {
            echo "run=true"
            echo "checkout_ref=$checkout_ref"
            echo "expect_sha=$expect_sha"
            echo "base=$base"
            echo "trusted_ref=$trusted_ref"
          } >> "$GITHUB_OUTPUT"

  # ── Detect which templates changed (no code executed, no secrets) ──
  changes:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      cache_apps: ${{ steps.cache-apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tested commit
        if: needs.gate.outputs.expect_sha != ''
        env:
          EXPECT: ${{ needs.gate.outputs.expect_sha }}
        run: |
          got=$(git rev-parse HEAD)
          [ "$got" = "$EXPECT" ] || { echo "::error::PR head moved ($got != $EXPECT); re-run after reviewing the new commits"; exit 1; }

      - name: Detect changed apps
        id: filter
        env:
          BASE: ${{ needs.gate.outputs.base }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          all_apps() { for f in */compose.yml; do echo "${f%/compose.yml}"; done; }
          emit() { APPS=$(jq -R . | jq -sc 'map(select(length > 0))'); echo "apps=$APPS"; echo "apps=$APPS" >> "$GITHUB_OUTPUT"; }

          if [ "$INPUT_APPS" = all ]; then
            echo "Dispatched for all apps"
            all_apps | emit
            exit 0
          fi
          if [ -n "$INPUT_APPS" ]; then
            for a in $INPUT_APPS; do
              [[ "$a" =~ ^[a-z0-9][a-z0-9_-]*$ ]] && [ -f "$a/compose.yml" ] || { echo "::error::unknown app '$a'"; exit 1; }
              echo "$a"
            done | sort -u | emit
            exit 0
          fi

          # No usable base (first push, force push, manual run) — test all apps
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base — testing all apps"
            all_apps | emit
            exit 0
          fi

          echo "Base: $BASE"
          echo "Changed files:"
          git diff --name-only "$BASE...HEAD"

          # Test infra (incl. the sign-in e2e and the image lists), workflows
          # or the core pin changed — test all apps
          if git diff --name-only "$BASE...HEAD" | grep -qE '^tests/lib\.sh$|^tests/app-images\.sh$|^tests/e2e/|^\.github/|^\.core-ref$'; then
            echo "Test infra or core ref changed — testing all apps"
            all_apps | emit
            exit 0
          fi

          # Changed app directories (those with compose.yml), plus apps whose
          # test script tests/apps/<app>.sh changed.
          git diff --name-only "$BASE...HEAD" | while read -r f; do
            case "$f" in
              tests/apps/*.sh) dir="${f#tests/apps/}"; dir="${dir%.sh}" ;;
              */*) dir="${f%%/*}" ;;
              *) continue ;;
            esac
            if [ -f "$dir/compose.yml" ]; then echo "$dir"; fi
          done | sort -u | emit

      # Push to main only: changed apps whose test boots the template (the
      # ones with images to cache, see tests/app-images.sh). Reads files only.
      - name: Select apps for the image cache
        id: cache-apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPS: ${{ steps.filter.outputs.apps }}
        run: |
          jq -r '.[]' <<< "$APPS" | while read -r a; do
            if grep -q '^[^#]*compose_up' "tests/apps/$a.sh" 2>/dev/null; then echo "$a"; fi
          done | jq -R . | jq -sc 'map(select(length > 0))' | sed 's/^/apps=/' | tee -a "$GITHUB_OUTPUT"

  # ── Clone core + warm the infra image cache (trusted code only) ──
  # Clones the public core repo (no token) and is the only one that writes the
  # cache. It checks out nothing but .core-ref from a trusted commit.
  fetch-core:
    needs: [gate, changes]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      core_ref: ${{ steps.core.outputs.ref }}
      cache_key: ${{ steps.images.outputs.key }}
      keycloak_image: ${{ steps.images.outputs.keycloak_image }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out .core-ref (trusted commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.trusted_ref }}
          path: trusted
          sparse-checkout: .core-ref
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Core version the templates are tested against (contracts §1).
      - name: Read .core-ref
        id: core
        run: |
          ref=$(grep -v '^[[:space:]]*#' trusted/.core-ref | tr -d '[:space:]')
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && [[ "$ref" != *..* ]] || { echo "::error file=.core-ref::invalid core ref '$ref'"; exit 1; }
          echo "Core ref: $ref" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Clone core repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: porelli/portcullis
          ref: ${{ steps.core.outputs.ref }}
          path: core
          persist-credentials: false

      # Derive the infra image list from core's compose file so the cache
      # can never drift from what the stack actually runs. The cache key is
      # a hash of that list: bumping any image tag in core invalidates it.
      - name: Resolve infra images
        id: images
        working-directory: core
        run: |
          set -euo pipefail
          # Core's compose requires every secret (${VAR:?}); a throwaway .env
          # from the CLI lets `config --images` resolve. It's not shipped.
          ./portcullis init --env-only --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none >/dev/null
          # Core's KEYCLOAK_IMAGE default is the unpinned portcullis-keycloak
          # `edge` tag on core main and branches (a release pins tag@digest).
          # Resolve it to its digest once, here (trusted job), and run core
          # with that pinned ref everywhere (the test job gets it as
          # KEYCLOAK_IMAGE), so the pin check below sees a pinned image — no
          # exclusion. A compose file without KEYCLOAK_IMAGE, or with a pinned
          # default, changes nothing.
          # shellcheck disable=SC2016  # a literal ${KEYCLOAK_IMAGE:-…} in the sed pattern
          kc_default="$(sed -n 's/.*\${KEYCLOAK_IMAGE:-\([^}]*\)}.*/\1/p' docker-compose.yml | head -n1)"
          kc=""
          case "$kc_default" in
            ""|*@sha256:*) ;;
            ghcr.io/porelli/portcullis-keycloak:*)
              digest="$(docker buildx imagetools inspect "$kc_default" --format '{{json .Manifest}}' | jq -r .digest)"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::cannot resolve $kc_default to a digest (got '$digest')"; exit 1; }
              kc="ghcr.io/porelli/portcullis-keycloak@$digest"
              echo "Keycloak image: $kc_default resolved to $kc" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::unexpected KEYCLOAK_IMAGE default in core's compose: $kc_default"; exit 1 ;;
          esac
          if [ -n "$kc" ]; then export KEYCLOAK_IMAGE="$kc"; fi
          echo "keycloak_image=$kc" >> "$GITHUB_OUTPUT"
          # Compose services minus the ones core builds locally (enroll,
          # group-gate, domains, … — every service with a build:) and the
          # unpinned edge Hub (never started here), plus the base images
          # those are built from and the CLI's pinned helper (alpine), as
          # core's e2e job lists them.
          CFG="$(docker compose config --format json)"
          {
            docker compose config --images \
              | { grep -vxF -f <(jq -r '.services | to_entries[] | select(.value.build) | .value.image // ("portcullis-" + .key)' <<<"$CFG") || true; } \
              | { grep -vxE 'ghcr\.io/porelli/portcullis-hub:.*' || true; }
            for ctx in $(jq -r '.services[] | select(.build) | .build.context' <<<"$CFG" | sort -u); do
              [ -f "$ctx/Dockerfile" ] && sed -nE 's/^FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*([^[:space:]]+).*/\2/p' "$ctx/Dockerfile"
            done
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' scripts/lib/common.sh | { grep -E '^alpine:' || true; }
          } | LC_ALL=C sort -u > ../infra-images.txt
          if grep -v '@sha256:' ../infra-images.txt; then echo "::error::unpinned infra image (above)"; exit 1; fi
          rm -f .env
          [ -s ../infra-images.txt ] || { echo "::error::no infra images resolved from core compose"; exit 1; }
          cat ../infra-images.txt
          echo "key=infra-images-$(sha256sum ../infra-images.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # tar keeps the executable bits core's scripts need.
      - name: Package core
        run: tar -czf core.tgz --exclude=core/.git core infra-images.txt

      - name: Upload core
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ github.run_id }}-${{ github.run_attempt }}
          path: core.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Look up image cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images
          key: ${{ steps.images.outputs.key }}
          lookup-only: true

      - name: Pull images
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          while read -r img; do
            [ -n "$img" ] || continue
            for i in 1 2 3 4 5; do docker pull -q "$img" && break; [ "$i" = 5 ] && exit 1; sleep $((i * 15)); done
          done < infra-images.txt
          xargs docker save -o /tmp/docker-images/infra.tar < infra-images.txt

      - name: Save image cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images
          key: ${{ steps.images.outputs.key }}

  # ── Warm the per-app image caches (trusted runs only) ──
  # Push to main only: never PRs, never dispatched runs (a dispatched PR run
  # executes in the default branch's cache scope). Runs no template code:
  # tests/app-images.sh from the pushed commit reads <app>/compose.yml, then
  # the pinned images are pulled and saved; no container is started. Keys
  # hash the image list, so any tag/digest bump makes a new entry.
  app-images:
    needs: [gate, changes]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.cache_apps != '' && needs.changes.outputs.cache_apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Runners are shared by all four repos: a full all-apps run must not
      # starve core/hub/docs CI. Single-app pushes run one job anyway.
      max-parallel: 8
      matrix:
        app: ${{ fromJson(needs.changes.outputs.cache_apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            tests/app-images.sh
            tests/apps/${{ matrix.app }}.sh
            ${{ matrix.app }}/compose.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve app images
        id: images
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          bash tests/app-images.sh "$APP" > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          if [ -s "$RUNNER_TEMP/app-images.txt" ]; then
            echo "key=app-images-$APP-$(sha256sum "$RUNNER_TEMP/app-images.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up app image cache
        id: cache
        if: steps.images.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/app-images
          key: ${{ steps.images.outputs.key }}
          lookup-only: true

      - name: Pull app images
        if: steps.images.outputs.key != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/app-images
          # Registries rate-limit bursts (toomanyrequests): retry with backoff.
          while read -r img; do
            [ -n "$img" ] || continue
            for i in 1 2 3 4 5; do docker pull -q "$img" && break; [ "$i" = 5 ] && exit 1; echo "pull $img failed (attempt $i), retrying"; sleep $((i * 15)); done
          done < "$RUNNER_TEMP/app-images.txt"
          xargs docker save -o /tmp/app-images/images.tar < "$RUNNER_TEMP/app-images.txt"

      - name: Save app image cache
        if: steps.images.outputs.key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/app-images
          key: ${{ steps.images.outputs.key }}

  # ── Warm the pip / Playwright browser cache (trusted runs only) ──
  # Push to main only, like app-images: installs the hash-pinned
  # tests/e2e/requirements.txt and the Chromium build of that Playwright
  # version, runs no template code. The key hashes the requirements, so a
  # Playwright bump (Dependabot) makes a new entry; `test` only restores it
  # (pip still checks every hash).
  e2e-browser:
    needs: [gate, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tests/e2e/requirements.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Look up the pip / Playwright browser cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}
          lookup-only: true

      - name: Install Playwright (pinned) and Chromium
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet --require-hashes -r tests/e2e/requirements.txt
          /tmp/e2e-venv/bin/playwright install chromium

      - name: Save the pip / Playwright browser cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

  # ── Per-app tests (parallel) — runs template code, no secrets ──
  test:
    needs: [gate, changes, fetch-core]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Shell test + sign-in e2e (GitLab alone boots for ~10 minutes).
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Runners are shared by all four repos: a full all-apps run must not
      # starve core/hub/docs CI. Single-app pushes run one job anyway.
      max-parallel: 8
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    env:
      # Every plain `docker compose` call in core/ (incl. the ones inside
      # core's scripts/) uses the core file + the CI override written below.
      # tests/lib.sh passes -f explicitly, so app compose files are unaffected.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      VAULT_ADDR: http://127.0.0.1:8200
      # The portcullis-keycloak image fetch-core resolved to a digest (empty:
      # core's compose has no KEYCLOAK_IMAGE, or pins its default itself).
      KEYCLOAK_IMAGE: ${{ needs.fetch-core.outputs.keycloak_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Verify tested commit
        if: needs.gate.outputs.expect_sha != ''
        env:
          EXPECT: ${{ needs.gate.outputs.expect_sha }}
        run: |
          got=$(git rev-parse HEAD)
          [ "$got" = "$EXPECT" ] || { echo "::error::PR head moved ($got != $EXPECT)"; exit 1; }

      # Downloaded by id and checked against the digest fetch-core recorded,
      # so a concurrently running job cannot swap it.
      - name: Download core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.fetch-core.outputs.artifact_id }}
          path: /tmp/core-artifact
          digest-mismatch: error

      - name: Unpack core
        run: |
          tgz=$(find /tmp/core-artifact -name core.tgz -print -quit)
          [ -n "$tgz" ] || { echo "::error::core artifact missing"; exit 1; }
          tar -xzf "$tgz" -C "$GITHUB_WORKSPACE"
          test -f core/docker-compose.yml

      - name: Restore Docker image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images
          key: ${{ needs.fetch-core.outputs.cache_key }}

      # Same list and key as `app-images` (which saves it on push to main).
      # Computed from the code under test: it only picks which entry to
      # restore, and everything restored is verified below.
      - name: Resolve app images
        id: app-images
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          bash tests/app-images.sh "$APP" > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          if [ -s "$RUNNER_TEMP/app-images.txt" ]; then
            echo "key=app-images-$APP-$(sha256sum "$RUNNER_TEMP/app-images.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore app image cache
        if: steps.app-images.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/app-images
          key: ${{ steps.app-images.outputs.key }}

      # The cache is not a trust boundary: a run of untrusted code on the
      # default branch scope could have created a cache entry, and the names
      # and RepoDigests inside a loaded tarball can claim anything. What
      # can't be faked is the image ID: it is the sha256 of the image config,
      # which pins every layer's diff_id, and `docker load` verifies layers
      # against it. So:
      #   - every name a tarball sets is removed right after `docker load`
      #     (our tarballs are saved by digest ref and carry none), so a
      #     planted tag (e.g. `alpine:latest`, which core's scripts run) can
      #     never be used;
      #   - every image ref is then bound by `docker pull` from the registry.
      #     For digest-pinned refs the engine checks the manifest against the
      #     pinned digest, reads the config digest from it and skips the
      #     download only if an image with exactly that ID was loaded;
      #     anything else is pulled fresh. The ref's image ID is therefore
      #     the config digest of the pinned manifest; the step then checks
      #     the ref carries the pinned digest (set only by a verified pull).
      #   - tag-only refs are resolved by the same pull.
      # One pull per image, no separate manifest lookups: when the cache
      # matches it costs a manifest fetch (~0.5 s), not a download.
      - name: Load and verify images
        env:
          APP_IMAGES: ${{ runner.temp }}/app-images.txt
        run: |
          set -euo pipefail
          load() {
            local out ref id
            out=$(docker load -q -i "$1")
            echo "$1: $(grep -c '^Loaded image' <<< "$out" || true) images loaded"
            # Keep the content (park it under a name nothing uses), drop the name.
            sed -n 's/^Loaded image: //p' <<< "$out" | while read -r ref; do
              id=$(docker image inspect --format '{{.Id}}' "$ref")
              docker tag "$id" "ci-cache-untrusted/loaded:${id#sha256:}"
              docker image rm "$ref" > /dev/null
              echo "::warning::$1 set the name $ref; removed"
            done
          }
          for tar in /tmp/docker-images/infra.tar /tmp/app-images/images.tar; do
            if [ -f "$tar" ]; then load "$tar"; else echo "No cached $tar; pulling"; fi
          done
          # Registries rate-limit bursts (toomanyrequests): retry with backoff.
          pull() { local i; for i in 1 2 3 4 5; do docker pull -q "$1" > /dev/null && return 0; echo "pull $1 failed (attempt $i), retrying"; sleep $((i * 15)); done; return 1; }
          # After the pull, RepoDigests holds <repo>@<pinned digest> only if
          # the engine fetched and verified that manifest (loaded names were
          # all removed above), so this is a local check, no registry call.
          while read -r img; do
            [ -n "$img" ] || continue
            pull "$img" || { echo "::error::cannot pull $img"; exit 1; }
            case "$img" in
              *@sha256:*)
                pinned="${img##*@}"
                digests=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img")
                grep -q "@${pinned}\$" <<< "$digests" || { echo "::error::$img: no registry-verified digest after pull"; exit 1; }
                echo "verified $img -> $(docker image inspect --format '{{.Id}}' "$img")"
                ;;
              *) echo "pulled $img" ;;
            esac
          done < <(cat infra-images.txt "$APP_IMAGES" | LC_ALL=C sort -u)

      # Same boot as core's own CI (ci.yml, job e2e): every secret generated
      # by `portcullis init --env-only`, Keycloak with its production command,
      # setup through the core CLI, every core service except the Hub
      # (incl. enroll, built from core). The override only publishes health
      # ports.
      - name: Create .env and CI override
        working-directory: core
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ./portcullis init --env-only --non-interactive --domain "$PORTCULLIS_DOMAIN" \
            --email "ci@$PORTCULLIS_DOMAIN" --dns-provider none
          # Credentials tests/lib.sh uses (Keycloak admin API, LLDAP admin).
          # Sign-in is passkey-only: no user password or direct grant exists.
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ -n "$val" ] || { echo "::error::$v not generated"; exit 1; }
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          # ./templates is the Hub's template overlay (the Hub copies each app
          # dir there before `compose up`), so `./templates/<app>/...` mounts
          # resolve (tests/lib.sh quirk #6). Copy, don't symlink: the core CLI
          # chowns ./templates to the Hub's uid, which must not hit the
          # workspace itself.
          mkdir -p templates
          tar -C "$WORKSPACE" --exclude=./core --exclude=./.git -cf - . | tar -C templates -xf -

          # Every app hostname (the default instance's) plus core's: auth and
          # enroll (its only public router is the setup links, /invite/*).
          {
            echo "$PORTCULLIS_DOMAIN"
            for h in auth enroll; do echo "$h.$PORTCULLIS_DOMAIN"; done
            grep -ohE '\$\{PORTCULLIS_HOST_[A-Z0-9_]+:-[a-z0-9-]+\.portcullis\.local\}' "$WORKSPACE"/*/compose.yml \
              | sed -E "s/^.*:-([a-z0-9-]+)\.portcullis\.local\}\$/\1.$PORTCULLIS_DOMAIN/"
          } | LC_ALL=C sort -u > "$RUNNER_TEMP/hosts.txt"

          # Public DNS stand-in: on portcullis-proxy every hostname resolves
          # to Traefik (apps reach Keycloak at auth.<domain> for discovery
          # and the token exchange, as through public DNS in production).
          # The static address is restated: the override replaces the entry.
          cat > docker-compose.ci.yml << 'YML'
          services:
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            traefik:
              networks:
                portcullis-proxy:
                  ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
                  aliases:
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          sed 's/^/            - /' "$RUNNER_TEMP/hosts.txt" >> docker-compose.ci.yml
          docker compose config -q
          docker compose config --format json | jq -e --arg h "auth.$PORTCULLIS_DOMAIN" \
            '.services.traefik.networks["portcullis-proxy"] | (.aliases | index($h)) and .ipv4_address != null' >/dev/null \
            || { echo "::error::Traefik alias override not applied"; exit 1; }
          # The browser (sign-in e2e) on the CI host resolves them to Traefik's published 443.
          sed 's/^/127.0.0.1 /' "$RUNNER_TEMP/hosts.txt" | sudo tee -a /etc/hosts >/dev/null

      # Their base images were loaded and verified above (infra-images.txt);
      # group-gate installs its Python deps with pip --require-hashes, Go
      # images verify their modules (go mod verify).
      - name: Build core's local images (enroll, group-gate, domains, …)
        working-directory: core
        run: |
          set -euo pipefail
          # Every core service with a build: (the domains service's age key
          # is generated by its image during vault init).
          # Retried: Go module downloads from proxy.golang.org fail now and then.
          built=$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.build) | .key')
          for i in 1 2 3; do
            # shellcheck disable=SC2086
            docker compose build $built && break
            [ "$i" = 3 ] && { echo "::error::core's images did not build"; exit 1; }
            sleep 20
          done

      - name: Boot infrastructure
        id: boot
        working-directory: core
        run: |
          set -euo pipefail
          # Compose creates portcullis-proxy from core's definition (fixed
          # IPAM subnet + Traefik's static IP) — never `docker network create`.
          docker compose up -d postgres lldap
          # Vault in server mode (initialised, unsealed, secrets/ written:
          # enroll AppRole, invite and service-account secrets, the session
          # store's config and passwords (secrets/sessions/); also creates
          # every bind-mount source), PKI + wildcard server cert, CA bundle.
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          # No ACME in CI: serve the Vault-issued wildcard cert.
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml

          # Everything but the Hub (unpinned edge image; the tests write its
          # group-gate policy file themselves).
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          TRAEFIK_IP=$(grep '^PORTCULLIS_TRAEFIK_IP=' .env | cut -d= -f2)
          GOT_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis-proxy").IPAddress}}' "$(docker compose ps -q traefik)")
          test "$GOT_IP" = "$TRAEFIK_IP" || { echo "Traefik IP on portcullis-proxy is $GOT_IP, want $TRAEFIK_IP"; exit 1; }

          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready > /dev/null && break
            [ "$i" -eq 100 ] && { echo "::error::Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          # After enroll runs: configure pushes the LDAP bind credentials and
          # client secrets, and creates the hidden invite identity provider
          # (keycloak/invite-idp.json), whose http back-channel Keycloak
          # accepts only while `enroll` resolves.
          ./portcullis keycloak configure
          ./portcullis oidc register

          # oauth2-proxy exits while Keycloak is down; (re)start it now.
          docker compose up -d forward-auth
          docker compose restart forward-auth
          for svc in traefik keycloak group-gate enroll sessions forward-auth; do
            for i in $(seq 1 40); do
              cid="$(docker compose ps -q "$svc")"
              state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")"
              case "$state" in "running healthy"|"running ") break ;; esac
              [ "$i" -eq 40 ] && { echo "::error::$svc not healthy ($state)"; docker compose logs --tail=40 "$svc"; exit 1; }
              sleep 3
            done
          done
          # The invite identity provider exists (configure only warns).
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          curl -sf -o /dev/null -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") \
            http://127.0.0.1:8080/admin/realms/portcullis/identity-provider/instances/portcullis-invite \
            || { echo "::error::invite identity provider portcullis-invite missing after keycloak configure"; docker compose logs --tail=40 keycloak enroll; exit 1; }
          # Forward-auth works end to end: an unauthenticated request to a
          # core router behind portcullis-auth is redirected to Keycloak.
          for i in $(seq 1 30); do
            loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --cacert certs/ca-chain.crt \
                    --resolve "traefik.$PORTCULLIS_DOMAIN:443:127.0.0.1" "https://traefik.$PORTCULLIS_DOMAIN/" || true)
            case "$loc" in *"//auth.$PORTCULLIS_DOMAIN/"*) break ;; esac
            [ "$i" -eq 30 ] && { echo "::error::forward-auth does not redirect to auth.$PORTCULLIS_DOMAIN (got: $loc)"; docker compose logs --tail=40 forward-auth traefik; exit 1; }
            sleep 2
          done
          docker compose ps
          echo "Infrastructure ready"

      # The generated per-app env (manifest generate: random, as the Hub
      # writes it), once for both the shell test and the sign-in e2e, so
      # they run the app with the same secrets (lib.sh only fills unset ones).
      - name: Generate the app's env
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          keys=$(bash -c 'source tests/lib.sh; trap - EXIT; _manifest_random_env_keys "$1"' _ "$APP/manifest.yaml")
          for key in $keys; do
            [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error::bad env key $key"; exit 1; }
            val=$(openssl rand -hex 16)
            echo "::add-mask::$val"
            echo "$key=$val" >> "$GITHUB_ENV"
          done

      - name: "Test: ${{ matrix.app }}"
        env:
          # lib.sh: PROJECT_DIR = core project (PROJECT_DIR/templates is a
          # copy of this repo made during setup), TEMPLATES_DIR = this repo.
          PROJECT_DIR: ${{ github.workspace }}/core
          TEMPLATES_DIR: ${{ github.workspace }}
          APP: ${{ matrix.app }}
        run: bash "tests/apps/$APP.sh"

      # pip wheels + Playwright's Chromium, saved by e2e-browser on main.
      # pip checks every hash; the browser cache is written by trusted runs only.
      - name: Restore the pip / Playwright browser cache
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet --require-hashes -r tests/e2e/requirements.txt
          # OS packages always (apt); the browser download is skipped when cached.
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium >/dev/null
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i core/certs/root-ca.crt

      # A real sign-in per user (member / admin / outsider) through
      # Portcullis: setup link, passkey (virtual authenticator), the app's
      # own sign-in; driven by the manifest's tests.signin.
      - name: "Sign-in e2e: ${{ matrix.app }}"
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        env:
          PROJECT_DIR: ${{ github.workspace }}/core
          TEMPLATES_DIR: ${{ github.workspace }}
          APP: ${{ matrix.app }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
          # Playwright's API requests (json checks) run in Node: trust core's CA there too.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/core/certs/ca-chain.crt
        run: /tmp/e2e-venv/bin/python tests/e2e/app_signin.py "$APP"

      - name: Collect logs on failure
        if: failure()
        working-directory: core
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          mkdir -p "$E2E_ARTIFACTS/core"
          for svc in traefik keycloak enroll sessions forward-auth group-gate lldap; do
            docker compose logs --no-color "$svc" > "$E2E_ARTIFACTS/core/$svc.log" 2>&1 || true
          done
          echo "=== Docker Status ==="
          docker compose ps
          echo "=== Logs ==="
          for svc in traefik vault keycloak enroll sessions forward-auth group-gate lldap; do
            echo "--- $svc ---"
            docker compose logs --tail=40 "$svc" 2>/dev/null || true
          done

      - name: Upload screenshots, traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.app }}
          path: ${{ runner.temp }}/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        working-directory: core
        run: docker compose down -v 2>/dev/null || true
