name: Test Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Core version the templates are tested against (branch or tag).
  CORE_REF: modernize
  PORTCULLIS_DOMAIN: portcullis.local
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: ci-admin-pass
  POSTGRES_PASSWORD: ci-pg-pass
  LLDAP_ADMIN_PASSWORD: ci-lldap-pass
  LLDAP_JWT_SECRET: ci-jwt-secret-value
  LLDAP_BASE_DN: dc=portcullis,dc=local
  FORWARD_AUTH_CLIENT_SECRET: ci-forward-auth-secret
  FORWARD_AUTH_COOKIE_SECRET: Y2ktY29va2llLXNlY3JldC0zMi1ieXRlcw==

jobs:
  # ── Detect which templates changed ──────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

          # First push or missing base — test all apps
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push or missing base — testing all apps"
            APPS=$(ls -d */compose.yml 2>/dev/null | sed 's|/compose.yml||' | jq -R . | jq -sc .)
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
            echo "apps=$APPS"
            exit 0
          fi

          echo "Base: $BASE"
          echo "Changed files:"
          git diff --name-only "$BASE" HEAD || true

          # If tests/lib.sh or workflow changed, test all apps
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -qE '^tests/lib\.sh$|^\.github/'; then
            echo "Test infra changed — testing all apps"
            APPS=$(ls -d */compose.yml 2>/dev/null | sed 's|/compose.yml||' | jq -R . | jq -sc .)
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
            echo "apps=$APPS"
            exit 0
          fi

          # Changed app directories (those with compose.yml), plus apps whose
          # test script tests/apps/<app>.sh changed.
          APPS=$(git diff --name-only "$BASE" HEAD | while read -r f; do
            case "$f" in
              tests/apps/*.sh) dir="${f#tests/apps/}"; dir="${dir%.sh}" ;;
              */*) dir="${f%%/*}" ;;
              *) continue ;;
            esac
            [ -f "$dir/compose.yml" ] && echo "$dir"
          done | sort -u | jq -R . | jq -sc .)

          [ "$APPS" = "null" ] && APPS='[]'
          echo "apps=$APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  # ── Cache infra Docker images ───────────────────────────
  cache-infra:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    timeout-minutes: 10
    outputs:
      key: ${{ steps.images.outputs.key }}
    steps:
      # Derive the infra image list from core's compose file so the cache
      # can never drift from what the stack actually runs. The cache key is
      # a hash of that list: bumping any image tag in core invalidates it.
      - name: Clone core repo (for image list)
        uses: actions/checkout@v7
        with:
          repository: porelli/portcullis
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.PORTCULLIS_PAT }}
          path: core

      - name: Resolve infra images
        id: images
        working-directory: core
        run: |
          # Skip locally built images and the hub (floating :latest, pulled fresh).
          docker compose config --images \
            | grep -v -e '^portcullis-enroll$' -e 'portcullis-hub' \
            | sort -u > /tmp/infra-images.txt
          cat /tmp/infra-images.txt
          echo "key=infra-images-$(sha256sum /tmp/infra-images.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Docker images
        id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: ${{ steps.images.outputs.key }}

      - name: Pull and cache images
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          xargs -n1 docker pull < /tmp/infra-images.txt
          xargs docker save -o /tmp/docker-images/infra.tar < /tmp/infra-images.txt

  # ── Per-app tests (parallel) ────────────────────────────
  test:
    needs: [changes, cache-infra]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    env:
      # Every plain `docker compose` call in core/ (incl. the ones inside
      # core's scripts/) uses the core file + the CI override written below.
      # tests/lib.sh passes -f explicitly, so app compose files are unaffected.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - uses: actions/checkout@v7

      - name: Clone core repo (for infra compose + scripts)
        uses: actions/checkout@v7
        with:
          repository: porelli/portcullis
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.PORTCULLIS_PAT }}
          path: core

      - name: Restore Docker image cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: ${{ needs.cache-infra.outputs.key }}

      - name: Load cached images
        run: |
          if [ -f /tmp/docker-images/infra.tar ]; then
            docker load -i /tmp/docker-images/infra.tar
          else
            cd core && docker compose -f docker-compose.yml pull postgres vault lldap keycloak traefik forward-auth group-gate
          fi

      - name: Create .env and CI override
        working-directory: core
        run: |
          cat > .env << 'ENVEOF'
          PORTCULLIS_DOMAIN=portcullis.local
          ACME_EMAIL=ci@portcullis.local
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-admin-pass
          POSTGRES_PASSWORD=ci-pg-pass
          LLDAP_ADMIN_PASSWORD=ci-lldap-pass
          LLDAP_JWT_SECRET=ci-jwt-secret-value
          LLDAP_BASE_DN=dc=portcullis,dc=local
          FORWARD_AUTH_CLIENT_SECRET=ci-forward-auth-secret
          FORWARD_AUTH_COOKIE_SECRET=Y2ktY29va2llLXNlY3JldC0zMi1ieXRlcw==
          CLOUDFLARE_API_TOKEN=
          PORTCULLIS_PROXY_SUBNET=172.31.250.0/24
          PORTCULLIS_PROXY_IP_RANGE=172.31.250.128/25
          PORTCULLIS_TRAEFIK_IP=172.31.250.2
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

          # Bind-mount sources must exist before compose runs, or Docker
          # creates them root-owned and core's scripts can't write into them
          # (same layout as core's bootstrap.sh / CI).
          mkdir -p certs/revocation
          : > certs/revocation/revoked-serials.txt
          (umask 077 && mkdir -p secrets/vault-unseal secrets/enroll)
          # ./templates is the Hub's template overlay; in CI it is this repo,
          # so `./templates/<app>/...` mounts resolve (tests/lib.sh quirk #6).
          ln -sfn "${{ github.workspace }}" templates

          cat > docker-compose.ci.yml << 'YML'
          services:
            keycloak:
              command: ["start-dev", "--import-realm", "--http-enabled=true", "--http-port=8080", "--hostname=https://auth.portcullis.local", "--health-enabled=true"]
              ports:
                - "127.0.0.1:8080:8080"
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          docker compose config -q

      - name: Boot infrastructure
        working-directory: core
        run: |
          # Compose creates portcullis-proxy from core's definition (fixed
          # IPAM subnet + Traefik's static IP) — never `docker network create`.
          docker compose up -d postgres lldap traefik

          TRAEFIK_IP=$(grep '^PORTCULLIS_TRAEFIK_IP=' .env | cut -d= -f2)
          GOT_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis-proxy").IPAddress}}' "$(docker compose ps -q traefik)")
          test "$GOT_IP" = "$TRAEFIK_IP" || { echo "Traefik IP on portcullis-proxy is $GOT_IP, want $TRAEFIK_IP"; exit 1; }

          # Vault in server mode: core's script starts, initialises and
          # unseals it and writes secrets/ (root token in vault-init.json).
          ./scripts/vault-init.sh

          for _ in $(seq 1 30); do docker compose exec -T postgres pg_isready -U keycloak > /dev/null 2>&1 && break; sleep 2; done
          for _ in $(seq 1 30); do docker compose exec -T lldap /app/lldap healthcheck --config-file /data/lldap_config.toml > /dev/null 2>&1 && break; sleep 2; done

          # Vault PKI. The admin token comes from secrets/vault-init.json
          # (scripts/lib/vault-common.sh); with no host vault CLI the script
          # runs the CLI inside the vault container.
          DOMAIN=$PORTCULLIS_DOMAIN CERT_DIR=./certs ./scripts/setup-vault-pki.sh --with-server-cert

          cat > traefik/dynamic/ci-certs.yml << 'EOF'
          tls:
            certificates:
              - certFile: /certs/server.crt
                keyFile: /certs/server.key
          EOF
          cp certs/ca-chain.crt certs/ca-bundle.crt

          # Keycloak
          docker compose up -d keycloak
          for _ in $(seq 1 90); do curl -sf http://localhost:9000/health/ready > /dev/null 2>&1 && break; sleep 3; done

          jq --arg pass "$LLDAP_ADMIN_PASSWORD" \
            '(.components["org.keycloak.storage.UserStorageProvider"][0].config.bindCredential) = [$pass]' \
            keycloak/realm-export.json > /tmp/realm.json
          cp /tmp/realm.json keycloak/realm-export.json
          export KEYCLOAK_URL=http://localhost:8080
          ./scripts/configure-keycloak.sh
          ./scripts/register-oidc-clients.sh

          # Auth services
          docker compose up -d forward-auth group-gate
          sleep 5
          echo "Infrastructure ready"

      - name: "Test: ${{ matrix.app }}"
        env:
          PROJECT_DIR: ${{ github.workspace }}/core
          TEMPLATES_DIR: ${{ github.workspace }}
        run: |
          # Point lib.sh at the core project for compose commands
          # (PROJECT_DIR/templates -> this repo was linked during setup)
          export PROJECT_DIR="${{ github.workspace }}/core"
          bash tests/apps/${{ matrix.app }}.sh

      - name: Collect logs on failure
        if: failure()
        working-directory: core
        run: |
          echo "=== Docker Status ==="
          docker compose ps
          echo "=== Logs ==="
          for svc in traefik vault keycloak forward-auth group-gate lldap; do
            echo "--- $svc ---"
            docker compose logs --tail=10 "$svc" 2>/dev/null || true
          done

      - name: Cleanup
        if: always()
        working-directory: core
        run: docker compose down -v 2>/dev/null || true
