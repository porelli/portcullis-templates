# Dependabot keeps image tags + digests, GitHub Actions SHAs and the
# validator's Python deps current. Every template directory must be listed
# under the docker-compose entry (tests/validate.py checks this).
#
# Upgrade constraints (see each manifest's auth.notes):
#   - database majors (postgres, mysql, redis) are never bumped automatically;
#   - GitLab and Nextcloud majors must follow the upstream upgrade path, so
#     only minor/patch updates are proposed;
#   - multi-image apps are grouped so they move in lockstep.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/actual-budget"
      - "/adguard"
      - "/cadcraft"
      - "/cloudbeaver"
      - "/craft-anything"
      - "/deckcraft"
      - "/designcraft"
      - "/docs"
      - "/dokuwiki"
      - "/effectcraft"
      - "/figcraft"
      - "/filmcraft"
      - "/firefly-iii"
      - "/firefox-sync"
      - "/gitea"
      - "/gitlab"
      - "/grafana"
      - "/gridcraft"
      - "/guacamole"
      - "/headscale"
      - "/immich"
      - "/jellyfin"
      - "/kanboard"
      - "/lightcraft"
      - "/litellm"
      - "/matrix"
      - "/mealie"
      - "/netbird"
      - "/nextcloud"
      - "/paperless"
      - "/pdfcraft"
      - "/photocraft"
      - "/pihole"
      - "/plex"
      - "/scrutiny"
      - "/soundcraft"
      - "/texturecraft"
      - "/vaultwarden"
      - "/vectorcraft"
      - "/vikunja"
      - "/wiki"
      - "/wordcraft"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "templates"
    groups:
      netbird:
        patterns: ["netbirdio/*"]
      immich:
        patterns: ["*immich-app/immich-*"]
      guacamole:
        patterns: ["guacamole/*"]
      headscale:
        patterns: ["headscale/headscale", "*tale/headplane"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # Immich's database image follows upstream's docker-compose.yml.
      - dependency-name: "*immich-app/postgres"
      - dependency-name: "gitlab/gitlab-ce"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextcloud"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tests"
    groups:
      validator:
        patterns: ["*"]

  # Sign-in e2e (tests/e2e/requirements.in -> requirements.txt, hashed).
  # A Playwright bump also changes the cached Chromium build (test-apps.yml
  # keys the browser cache on requirements.txt) and reruns every app's e2e.
  - package-ecosystem: pip
    directory: "/tests/e2e"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tests"
    groups:
      signin-e2e:
        patterns: ["*"]
