# Dependabot keeps image tags + digests, GitHub Actions SHAs and the
# validator's Python deps current. Every template directory must be listed
# under the docker-compose entry (tests/validate.py checks this).
#
# Upgrade constraints (see each manifest's auth.notes):
#   - database majors (postgres, mysql, redis) are never bumped automatically;
#   - GitLab and Nextcloud majors must follow the upstream upgrade path, so
#     only minor/patch updates are proposed;
#   - multi-image apps are grouped so they move in lockstep;
#   - AI companions are images of their template's compose.yml, tracked
#     with it (gitea: docker.gitea.com/gitea-mcp-server); a bump changes
#     the tools, which tests/apps/gitea.sh checks against the manifest;
#   - no pre-releases (pip, Go and Actions skip them by default; docker
#     needs the explicit ranges below).
#
# PRs are merged by .github/workflows/dependabot-automerge.yml once Lint and
# Test Apps pass (patch, minor, digest-only); majors get `major-update` and
# wait for a manual merge; red CI opens an `update-failed` issue.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/actual-budget"
      - "/adguard"
      - "/cadcraft"
      - "/cloudbeaver"
      - "/craft-anything"
      - "/deckcraft"
      - "/designcraft"
      - "/docs"
      - "/dokuwiki"
      - "/effectcraft"
      - "/esphome"
      - "/figcraft"
      - "/filmcraft"
      - "/firefly-iii"
      - "/firefox-sync"
      - "/gitea"
      - "/gitlab"
      - "/grafana"
      - "/gridcraft"
      - "/guacamole"
      - "/headscale"
      - "/homeassistant"
      - "/immich"
      - "/jellyfin"
      - "/kanboard"
      - "/lightcraft"
      - "/litellm"
      - "/matrix"
      - "/mattermost"
      - "/mealie"
      - "/motioneye"
      - "/netbird"
      - "/nextcloud"
      - "/oxicloud"
      - "/paperless"
      - "/pdfcraft"
      - "/photocraft"
      - "/pihole"
      - "/samba"
      - "/plex"
      - "/scrutiny"
      - "/soundcraft"
      - "/texturecraft"
      - "/timemachine"
      - "/vaultwarden"
      - "/vectorcraft"
      - "/vikunja"
      - "/wiki"
      - "/wordcraft"
      - "/zigbee2mqtt"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "templates"
    groups:
      netbird:
        patterns: ["netbirdio/*"]
      immich:
        patterns: ["*immich-app/immich-*"]
      guacamole:
        patterns: ["guacamole/*"]
      headscale:
        patterns: ["headscale/headscale", "*tale/headplane"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # Immich's database image follows upstream's docker-compose.yml.
      - dependency-name: "*immich-app/postgres"
      - dependency-name: "gitlab/gitlab-ce"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextcloud"
        update-types: ["version-update:semver-major"]
      # No pre-releases. Dependabot's own pre-release filter let
      # python 3.16.0a1-alpine through (PR #2). Docker `versions` use Ruby Gem
      # requirement syntax: ">= X.Y.0.a, < X.Y.0" is exactly X.Y.0's alphas,
      # betas and rcs (3.16.0a1, 3.16.0b2, 3.16.0rc1; not 3.16.0 or 3.15.x).
      # Add the next minor when its pre-releases start. Anything that still
      # gets through is closed by the auto-merge workflow (.github/automerge).
      - dependency-name: "python"
        versions: [">= 3.16.0.a, < 3.16.0", ">= 3.17.0.a, < 3.17.0", ">= 3.18.0.a, < 3.18.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tests"
    groups:
      validator:
        patterns: ["*"]

  # Sign-in e2e (tests/e2e/requirements.in -> requirements.txt, hashed).
  # A Playwright bump also changes the cached Chromium build (test-apps.yml
  # keys the browser cache on requirements.txt) and reruns every app's e2e.
  - package-ecosystem: pip
    directory: "/tests/e2e"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tests"
    groups:
      signin-e2e:
        patterns: ["*"]
