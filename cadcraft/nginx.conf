# Static server for a Craft web build (storytold, Rust/WebAssembly; runs in
# the browser, no server-side code). Same file in every Craft template.
# Upstream hosting notes: packaging/web/README.md of each app's repository
# (MIME types, no special isolation headers: no SharedArrayBuffer).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # Own, complete MIME map (no mime.types include): .wasm must be
    # application/wasm or browsers refuse to stream-compile it; everything
    # unknown (PhotoCraft's gzipped app/*.part-* included) is sent byte for
    # byte as application/octet-stream, as upstream requires.
    types {
        text/html                    html;
        text/javascript              js mjs;
        application/wasm             wasm;
        application/json             json;
        application/manifest+json    webmanifest;
        text/css                     css;
        text/plain                   txt;
        image/svg+xml                svg;
        image/png                    png;
        image/x-icon                 ico;
        font/otf                     otf;
        font/ttf                     ttf;
        font/woff                    woff;
        font/woff2                   woff2;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/javascript text/css text/plain application/json application/manifest+json image/svg+xml;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1k;

    # Read-only container: every runtime write goes to the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Precompressed files (LightCraft ships .gz next to its assets) and
    # on-the-fly gzip for the rest; never for the app parts (already gzip).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/javascript application/wasm application/json application/manifest+json text/css text/plain image/svg+xml;

    server {
        listen 8080;

        # Only Traefik (PORTCULLIS_TRAEFIK_SOURCE, behind forward-auth +
        # group-gate) and the container itself (healthcheck). Written at
        # start by the service's command; a missing file stops nginx.
        include /tmp/portcullis-allow.conf;

        root /srv/craft/www;
        index index.html;
        autoindex off;
        # Relative redirects (/dir -> /dir/): nginx doesn't know the public
        # scheme, host or port.
        absolute_redirect off;
        disable_symlinks on;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Revalidate everything (ETag / Last-Modified): file names differ in
        # how they change between versions across the apps, so nothing is
        # marked immutable.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Upstream's sample server configs (.htaccess etc.) and dotfiles.
        location ~ (^|/)\. {
            return 404;
        }

        # No single-page-app fallback: a missing file is a 404 (upstream).
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
