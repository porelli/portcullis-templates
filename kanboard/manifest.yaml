name: Kanboard
description: Minimalist Kanban project management with header-based auth
icon: "\U0001F4CB"
category: productivity
tags: [kanban, projects, tasks, boards]
links:
  website: https://kanboard.org/
  source: https://github.com/kanboard/kanboard
long_description: |
  Kanboard is a minimalist Kanban project management tool: boards with columns and swimlanes, tasks with subtasks, due dates and comments, and simple analytics.

  Portcullis signs people in and passes their username to Kanboard, which creates their account on first sign-in.
instances: multi

auth:
  method: header-auth
  sso: partial
  group_access: true
  group_admin: false
  access_group: users_kanboard
  admin_group: admin_kanboard
  notes: |
    Reverse proxy auth: users are matched on `X-Forwarded-User`, the immutable LLDAP username, and auto-created on first login. Access gated by group-gate.

    - The header is honoured only from Traefik (`TRUSTED_PROXY_NETWORKS` = `PORTCULLIS_TRAEFIK_SOURCE`).
    - `X-Forwarded-Email` (user-editable) only fills the profile email and is ignored from other peers too.
    - The LLDAP user picked in **Kanboard administrator** (default `admin` = LLDAP's built-in admin) gets the Kanboard admin role; other roles are set in the Kanboard UI.

    **No public exceptions:** Kanboard's router reads `?controller=&action=` before the path (`app/Core/Http/Router.php`), so any public prefix would reach every `APP_PUBLIC` action, local password login included.

    Accounts created when the header carried the email are named after it; rename them to the LLDAP username in Kanboard.

settings:
  options:
    - key: admin_user
      label: Kanboard administrator
      description: >
        The LLDAP user (username, not email) that Kanboard makes an
        administrator when it signs in. Default: admin (LLDAP's built-in
        admin account).
      type: user
      default: admin
      applies: restart
      delivery: [{env: KANBOARD_ADMIN_USER}]

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Kanboard
    url: "https://{{HOST_KANBOARD}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    signed_in:
      text: "{username}"

# AI support (contracts §3.2): why the AI can't act in this app.
ai:
  unsupported: "No official or vetted community MCP server known (surveyed 2026-11-05)"
