services:
  kanboard:
    image: kanboard/kanboard:v1.2.57@sha256:637989624e5362af2b97bfb4be1936fb6b111ea7cbdffea0ae8bd3068dc84125
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    environment:
      PLUGIN_INSTALLER: "true"
      REVERSE_PROXY_AUTH: "true"
      # Users are matched on the username column (ReverseProxyUserProvider:
      # external id column "username") = immutable LLDAP username. The email
      # header only fills the profile; Kanboard never links accounts by it.
      REVERSE_PROXY_USER_HEADER: HTTP_X_FORWARDED_USER
      REVERSE_PROXY_EMAIL_HEADER: HTTP_X_FORWARDED_EMAIL
      # LLDAP username that gets the Kanboard admin role (manifest setting).
      REVERSE_PROXY_DEFAULT_ADMIN: ${KANBOARD_ADMIN_USER:-admin}
      # Kanboard ignores REVERSE_PROXY_USER_HEADER unless REMOTE_ADDR is in
      # this list: only Traefik (static IP on portcullis-proxy) may assert it.
      TRUSTED_PROXY_NETWORKS: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}/32
    volumes:
      - kanboard-data:/var/www/app/data
      - kanboard-plugins:/var/www/app/plugins
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.kanboard.rule: Host(`${PORTCULLIS_HOST_KANBOARD:-kanboard.portcullis.local}`)
      traefik.http.routers.kanboard.entrypoints: websecure
      traefik.http.routers.kanboard.tls.options: authaware@file
      traefik.http.routers.kanboard.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.kanboard.loadbalancer.server.port: "80"
    restart: unless-stopped

volumes:
  kanboard-data: {}
  kanboard-plugins: {}

networks:
  portcullis-proxy:
    external: true
