name: Actual Budget
description: Privacy-first local budgeting app with bank sync
icon: "\U0001F4B0"
category: finance
tags: [budget, finance, money, tracking]
instances: multi

auth:
  method: native-oidc
  sso: true
  group_access: true
  keycloak_access_role: true
  group_admin: false
  access_group: users_actual-budget
  admin_group: admin_actual-budget
  notes: >
    OpenID login with auto-register. No native group/role support — all SSO
    users get equal access. Identity: Actual keys users on preferred_username
    (falling back to login, email, sub only when that claim is absent);
    Keycloak always sends it via the profile scope, so accounts follow the
    immutable LLDAP username, never the user-editable email.

env:
  - key: ACTUAL_OIDC_SECRET
    description: Actual Budget OIDC client secret
    generate: random

keycloak_clients:
  - client_id: actual-budget
    secret_env: ACTUAL_OIDC_SECRET
    redirect_uri: "https://{{HOST_ACTUAL}}/openid/callback"
    name: Actual Budget

config_files: []

urls:
  - label: Budget
    url: "https://{{HOST_ACTUAL}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    # A fresh server first offers "Start using OpenID" (the first OpenID
    # user becomes the owner), then "Sign in with OpenID".
    login: ["button:has-text('Start using OpenID')", "button:has-text('Sign in with OpenID')"]
    # Actual rate-limits /account/login: two SSO starts per button are enough.
    max_clicks: 2
    # Actual allows 500 requests a minute per client address (its frontend
    # loads hundreds of files); in CI every user shares one address.
    pause_between_users: 65
    signed_in:
      text: "{username}"
      wait: 20
    # e2eadmin signs in first and becomes the owner. Actual then admits only
    # users the owner added in its user directory (user creation mode
    # manual), so the outsider is refused by Actual itself.
    expected_fail:
      member:
        reason: "Actual admits only the first OpenID user (the owner) and users the owner adds by hand; the test doesn't add e2emember, and auto-creating accounts would let every Portcullis user in until the Hub's per-app Keycloak client access (Task 4b)"
        # Actual answers the refused grant with 400 {"reason":"openid-grant-failed"}
        # (its access log line in this flow's window counts too).
        match: "openid-grant-failed|GET 400 /openid/callback"
        # Searched in the member's own flow only; a rate-limited login (429)
        # is a different failure, not the refused grant.
        not_match: "Too many requests"
