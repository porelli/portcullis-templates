services:
  actual-budget:
    image: actualbudget/actual-server:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    environment:
      ACTUAL_LOGIN_METHOD: openid
      ACTUAL_OPENID_DISCOVERY_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/.well-known/openid-configuration
      ACTUAL_OPENID_CLIENT_ID: ${PORTCULLIS_OIDC_CLIENT_ID:-actual-budget}
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUAL_OIDC_SECRET:-}
      ACTUAL_OPENID_SERVER_HOSTNAME: https://${PORTCULLIS_HOST_ACTUAL:-budget.portcullis.local}
      ACTUAL_OPENID_ENFORCE: "true"
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.crt
    volumes:
      - actual-data:/data
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual.rule: Host(`${PORTCULLIS_HOST_ACTUAL:-budget.portcullis.local}`)
      traefik.http.routers.actual.entrypoints: websecure
      traefik.http.routers.actual.tls.options: authaware@file
      traefik.http.routers.actual.middlewares: client-headers@file,security-headers@file
      traefik.http.services.actual.loadbalancer.server.port: "5006"
    restart: unless-stopped

volumes:
  actual-data: {}

networks:
  portcullis-proxy:
    external: true
