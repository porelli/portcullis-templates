services:
  adguard:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    networks:
      - default
      - portcullis-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: Host(`${PORTCULLIS_HOST_ADGUARD:-adguard.portcullis.local}`)
      traefik.http.routers.adguard.entrypoints: websecure
      traefik.http.routers.adguard.tls.options: authaware@file
      traefik.http.routers.adguard.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.adguard.loadbalancer.server.port: "3000"
    restart: unless-stopped

volumes:
  adguard-work: {}
  adguard-conf: {}

networks:
  portcullis-proxy:
    external: true
