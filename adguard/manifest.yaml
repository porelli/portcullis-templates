name: AdGuard Home
description: Network-wide ad and tracker blocking with DNS-over-HTTPS
icon: "\U0001F6E1"
category: networking
tags: [dns, adblock, privacy, filtering]
links:
  website: https://adguard.com/en/adguard-home/overview.html
  source: https://github.com/AdguardTeam/AdGuardHome
long_description: |
  AdGuard Home is a network-wide DNS server that blocks ads and trackers for every device that uses it. It filters with blocklists and custom rules, can answer over DNS-over-HTTPS, DNS-over-TLS and DNS-over-QUIC, and shows a query log and statistics per client.

  Portcullis puts its sign-in and the access group in front of the web interface. AdGuard Home has no single sign-on, so its own admin password stays as a second step.
instances: multi

auth:
  method: forward-auth
  sso: false
  group_access: true
  group_admin: false
  access_group: users_adguard
  admin_group: admin_adguard
  notes: |
    No SSO in AdGuard Home (local accounts only). Access is gated by forward-auth + group-gate, and AdGuard's own admin password (set in its setup wizard) stays on purpose.

    Why the password stays: upstream can only disable it by leaving `users` empty, which turns authentication off for every peer (<https://github.com/AdguardTeam/AdGuardHome/wiki/Configuration>, `users`), and its web server has no client allowlist, so every other container on `portcullis-proxy` would get the full admin API unauthenticated.

    The same web server also answers DNS-over-HTTPS (`/dns-query`); through Portcullis it is behind forward-auth, so DoH clients can't use it.

ports:
  - key: ADGUARD_DNS_TCP_HOST
    label: DNS (TCP)
    description: Resolver port for TCP-based queries
    container: 53
    protocol: tcp
    default: 53
    required: true
    service: adguard
  - key: ADGUARD_DNS_UDP_HOST
    label: DNS (UDP)
    description: Resolver port for UDP-based queries
    container: 53
    protocol: udp
    default: 53
    required: true
    service: adguard

env: []
keycloak_clients: []
config_files: []

urls:
  - label: Dashboard
    url: "https://{{HOST_ADGUARD}}"

# Sign-in e2e (tests/e2e/app_signin.py, CONTRIBUTING.md "Sign-in test").
tests:
  signin:
    path: /
    # Past the gateway the browser reaches AdGuard Home itself: its setup
    # wizard on a fresh install. No identity reaches AdGuard (no SSO).
    signed_in:
      html: "AdGuard Home"
    password: "AdGuard Home keeps its own admin password behind the gateway (auth.notes: no web allowlist upstream)"

# AI support (contracts §3.2): why the AI can't act in this app.
ai:
  unsupported: "No MCP server known, and every member of the access group is a full administrator of the app (no per-person rights to act with)"
